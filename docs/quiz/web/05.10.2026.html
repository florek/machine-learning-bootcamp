<style>

.diff-łatwe{color:var(--idk);background:#e8f3fa}.diff-średnie{color:var(--mid);background:#faf0e4}.diff-trudne{color:var(--hard);background:#fce8ef}

.encourage{margin:0 0 .75rem;color:var(--idk);font-size:.95rem}
.actions{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:.65rem;margin-top:1rem;padding:1rem 0;background:linear-gradient(180deg,transparent,var(--bg) 30%)}
button{padding:.7rem 1.05rem;border:0;border-radius:10px;font:650 1rem var(--body);cursor:pointer}
.primary{color:#fff;background:var(--accent)}.ghost{border:1px solid var(--border);background:#fff}.ghost:hover{border-color:var(--accent);color:var(--accent)}

<script>
const QUIZ={"date":"05.10.2026","questions":[{"n":1,"difficulty":"łatwe","category":"ML","prompt":"W praktycznej implementacji przykładu ze spacerem LabelEncoder mapuje klasy targetu na liczby. Jakie jest mapowanie?","options":{"A":"nie → 0, tak → 1","B":"tak → 0, nie → 1","C":"nie → 1, tak → 2","D":"słonecznie → 0, deszczowo → 1"},"correct":"A","why":"W materiale LabelEncoder koduje target jako nie → 0 i tak → 1.","lesson":{"correct":"Target to kolumna „spacer” z tekstem „tak” albo „nie”. Model w scikit-learn lubi liczby, nie słowa. LabelEncoder zamienia słowa na kody. W tym przykładzie „nie” dostaje 0, a „tak” dostaje 1. Dzięki temu fit i predict działają na liczbach. Potem możesz wrócić do słów przez encoder.classes_.","example":"Wyobraź sobie listę: nie, tak, tak, nie. Po LabelEncoder dostajesz: 0, 1, 1, 0. To jak numerek na koszulce zamiast imienia. Model liczy na numerach, Ty nadal rozumiesz, że 1 znaczy „tak”.","remember":"W przykładzie spacer: nie=0, tak=1.","wrong":{"B":"To odwrotne mapowanie. W materiale jest nie→0 i tak→1, nie na odwrót.","C":"Nie ma kodów 1 i 2 dla dwóch klas w tym przykładzie — to 0 i 1.","D":"To wartości cechy pogody, nie mapowanie targetu spacer przez LabelEncoder."}}},{"n":2,"difficulty":"łatwe","category":"ML","prompt":"Co pozwala soft margin w SVM?","options":{"A":"Zakazuje jakiegokolwiek naruszenia marginesu","B":"Usuwa wszystkie kernele poza linear","C":"Zamienia klasyfikację na regresję z metryką MAE","D":"Naruszyć margines i zaakceptować część błędnych klasyfikacji"},"correct":"D","why":"Soft margin jest elastyczny: pozwala naruszyć margines i zaakceptować część błędów, co pomaga przy outlierach.","lesson":{"correct":"Soft margin oznacza „miękki” pas wokół granicy. Model nie musi rozdzielić klas idealnie. Może pozwolić, by kilka punktów weszło w margines albo nawet po złej stronie. Dzięki temu lepiej radzi sobie z nietypowymi obserwacjami. Hard margin jest sztywny i wymaga czystego podziału.","example":"Wyobraź sobie dwa stada owiec i jedną zbłąkaną owcę daleko po drugiej stronie. Hard margin mocno przesunie ogrodzenie przez tę jedną owcę. Soft margin powie: ta jedna może zostać po złej stronie — ogrodzenie zostaje szerokie i sensowne.","remember":"Soft = miękki = wolno trochę zbłądzić. Hard = twardy = zero błędów.","wrong":{"A":"To opis hard margin, nie soft. Hard zakazuje naruszeń marginesu.","B":"Soft margin nie usuwa kerneli. Kernel i margines to osobne sprawy.","C":"SVM soft margin nadal dotyczy klasyfikacji i marginesu, a nie zamiany na MAE w regresji."}}},{"n":3,"difficulty":"łatwe","category":"ML","prompt":"Jaką klasę scikit-learn tworzymy w praktycznej lekcji Pythonowej do Gaussian Naive Bayes?","options":{"A":"SVC","B":"GaussianNB","C":"LogisticRegression","D":"RandomForestClassifier"},"correct":"B","why":"W praktyce spacer używamy klasy GaussianNB z sklearn.naive_bayes.","lesson":{"correct":"Lekcja Pythonowa buduje naiwnego Bayesa w wariancie Gaussa. Importujesz GaussianNB, tworzysz model, robisz fit. SVC to SVM, regresja logistyczna i las to inne algorytmy. GaussianNB pasuje do nazwy „Gaussian Naive Bayes”.","example":"Piszesz: from sklearn.naive_bayes import GaussianNB, potem model = GaussianNB() i model.fit(X, y). Potem score, predict albo predict_proba — to cały szkielet z lekcji.","remember":"Python + Gauss w nazwie = GaussianNB.","wrong":{"A":"SVC to maszyna wektorów nośnych, nie Bayes.","C":"LogisticRegression to inny klasyfikator — nie implementacja GaussianNB.","D":"RandomForestClassifier to las drzew, nie naiwny Bayes."}}},{"n":4,"difficulty":"średnie","category":"ML","prompt":"Jak poprawnie użyć StandardScaler przed modelem wrażliwym na skalę cech (np. SVM)?","options":{"A":"fit i transform tylko na zbiorze testowym","B":"fit osobno na train i osobno na test","C":"fit tylko na train, potem transform na train i na test","D":"transform na train, a fit na test"},"correct":"C","why":"Scaler uczymy wyłącznie na train; test tylko transformujemy tym samym scalerem, żeby uniknąć data leakage.","lesson":{"correct":"StandardScaler liczy średnią i odchylenie. Te liczby wolno poznać tylko ze zbioru treningowego. Potem tą samą linijką mierzymy train i test. Gdybyśmy fitowali też na teście, model podglądałby przyszłość — to wyciek informacji.","example":"Train ma temperatury 10, 20, 30. Scaler uczy się średniej 20. Test ma 40 — tylko transformujemy względem 20, nie przeliczamy średniej od nowa z 40 w środku.","remember":"Fit tylko train. Test tylko transform. Nigdy fit na teście.","wrong":{"A":"Fit wyłącznie na teście to podglądanie danych testowych.","B":"Osobny fit na teście zmienia skalę inaczej niż na train — leakage i niespójność.","D":"Fit należy do train, nie do test."}}},{"n":5,"difficulty":"łatwe","category":"ML","prompt":"Po kodowaniu danych w przykładzie Pythonowym jak oddzielamy target „spacer” od cech?","options":{"A":"przez target = df.pop(\"spacer\")","B":"przez usunięcie wszystkich wierszy z „tak”","C":"przez StandardScaler.fit na całej tabeli","D":"przez kernel=\"rbf\" w GaussianNB"},"correct":"A","why":"W materiale target oddzielamy metodą pop(), np. target = df.pop(\"spacer\").","lesson":{"correct":"Po zakodowaniu tabeli cechy i target muszą być osobno. pop(\"spacer\") wyjmuje kolumnę spacer i zwraca ją jako target. W DataFrame zostają same cechy. To prosty, czytelny krok przed fit.","example":"Tabela ma kolumny: spacer, pogoda_…, temperatura_…. Robisz pop(\"spacer\") — w ręku masz serię 0/1, a w tabeli zostają tylko kolumny pogody i temperatury.","remember":"pop(nazwa) = wyjmij target, zostaw cechy.","wrong":{"B":"Nie usuwamy wierszy z „tak” — potrzebujemy obu klas do uczenia.","C":"Scaler nie oddziela targetu od cech; w tej lekcji nawet nie jest centralnym krokiem.","D":"GaussianNB nie ustawia kernela rbf — to temat SVM."}}},{"n":6,"difficulty":"średnie","category":"ML","prompt":"Co zwykle dzieje się przy mniejszym parametrze C w SVM (soft margin)?","options":{"A":"Margines staje się węższy, a tolerancja błędów mniejsza","B":"Kernel automatycznie zmienia się na poly degree=3","C":"Margines staje się szerszy, a tolerancja błędów większa","D":"Model przestaje używać support vectors"},"correct":"C","why":"Mniejsze C → szerszy margines i większa tolerancja na błędy; większe C → węższy margines i mniejsza tolerancja.","lesson":{"correct":"Parametr C mówi, jak mocno karać błędy. Małe C oznacza, że błędy mniej bolą, więc model woli szeroki, spokojny margines. Duże C oznacza, że każdy błąd jest drogi, więc margines się zaciska. To kompromis między szerokością pasa a dopasowaniem do treningu.","example":"C jak czujność nauczyciela. Przy małym C nauczyciel odpuszcza kilka pomyłek i rysuje szeroką linię. Przy dużym C goni każdą pomyłkę i linia staje się ciasna.","remember":"Małe C = szeroki margines + więcej wybaczenia.","wrong":{"A":"To opis większego C, nie mniejszego.","B":"C nie przełącza kernela na poly.","D":"Support vectors nadal istnieją; C zmienia kompromis margines/błędy."}}},{"n":7,"difficulty":"średnie","category":"ML","prompt":"Jak w lekcji Pythonowej kodujemy cechy tekstowe „pogoda” i „temperatura” przed GaussianNB?","options":{"A":"Zostawiamy je jako stringi i podajemy wprost do GaussianNB","B":"pd.get_dummies(..., columns=[\"pogoda\", \"temperatura\"], drop_first=True)","C":"Tylko StandardScaler bez żadnego kodowania kategorii","D":"PolynomialFeatures(degree=3) na surowych napisach"},"correct":"B","why":"Cechy kategoryczne kodujemy przez get_dummies z drop_first=True dla pogody i temperatury.","lesson":{"correct":"Pogoda i temperatura to słowa (słonecznie, ciepło itd.). Model potrzebuje liczb. get_dummies robi kolumny 0/1 dla kategorii. drop_first=True usuwa pierwszą kategorię z każdej grupy, żeby ograniczyć zbędną współliniowość. Potem te kolumny trafiają do GaussianNB.","example":"Zamiast jednej kolumny „pogoda=słonecznie” dostajesz np. pogoda_pochmurno i pogoda_słonecznie jako 0 albo 1. Jedna kategoria jest „bazą” dzięki drop_first.","remember":"Tekstowe cechy → get_dummies(..., drop_first=True).","wrong":{"A":"GaussianNB nie bierze surowych stringów jako cech w tym workflow.","C":"Sam scaler nie zamienia kategorii tekstowych na dummy.","D":"PolynomialFeatures nie jest sposobem kodowania napisów w tej lekcji."}}},{"n":8,"difficulty":"łatwe","category":"ML","prompt":"Czym są support vectors w SVM?","options":{"A":"Wszystkimi punktami leżącymi najdalej od granicy","B":"Próbkami położonymi najbliżej granicy decyzyjnej (na krańcach marginesu)","C":"Parametrem C ustawionym na zero","D":"Wyłącznie średnimi wartościami cech w każdej klasie"},"correct":"B","why":"Support vectors to próbki najbliżej granicy decyzyjnej — one w największym stopniu wyznaczają jej położenie.","lesson":{"correct":"Nazwa SVM pochodzi od wektorów nośnych. To punkty podpierające pas marginesu. Leżą najbliżej granicy. Jeśli je przesuniesz, granica zwykle się ruszy. Dalekie punkty mają mniejszy wpływ na samą linię podziału.","example":"Dwa miasta po dwóch stronach rzeki. Most opiera się na najbliższych domach przy brzegu. Dom daleko w głębi lądu nie przesuwa mostu. Te pobliskie domy to support vectors.","remember":"Support vectors = punkty najbliżej granicy, nie najdalej.","wrong":{"A":"Najdalsze punkty zwykle nie wyznaczają marginesu.","C":"C to hiperparametr kary, nie nazwa wektorów nośnych.","D":"Średnie klas to nie definicja support vectors."}}},{"n":9,"difficulty":"średnie","category":"ML","prompt":"W przykładzie Pythonowym model.score na pokazanym zbiorze daje około 77,7%. Co to oznacza intuicyjnie?","options":{"A":"Model nigdy nie przewiduje klasy „tak”","B":"Accuracy wynosi dokładnie 100% na 9 obserwacjach","C":"Model pomylił wszystkie 9 obserwacji","D":"Model poprawnie klasyfikuje około 7 z 9 obserwacji"},"correct":"D","why":"Ok. 77,7% accuracy na 9 obserwacjach to około 7 poprawnych klasyfikacji z 9.","lesson":{"correct":"score w tym zadaniu klasyfikacji to accuracy: odsetek trafionych etykiet. 0,777… to mniej więcej trzy czwarte. Przy 9 wierszach 7/9 ≈ 0,778. Lekcja podkreśla, że chodzi o pokazanie mechaniki, a nie o „idealny” wynik.","example":"Masz 9 dni. Model dobrze zgaduje spacer w 7 dniach, myli się w 2. 7 podzielone przez 9 daje około 77,7%.","remember":"≈77,7% ≈ 7 z 9 trafień na tym zbiorze.","wrong":{"A":"Model przewiduje też „tak” — m.in. dla pierwszego wiersza.","B":"100% byłoby 9/9; tu wynik jest niższy.","C":"0% to zero trafień; 77,7% to większość poprawna."}}},{"n":10,"difficulty":"trudne","category":"ML","prompt":"Jaka jest główna intuicja działania kernela w SVM przy problemie nieliniowym?","options":{"A":"Po przekształceniu przestrzeni dane mogą stać się liniowo separowalne (np. intuicja R² → R³)","B":"Kernel zamienia SVM w regresję liniową bez marginesu","C":"Kernel zawsze usuwa połowę cech wejściowych","D":"Kernel wymusza hard margin i zakazuje soft margin"},"correct":"A","why":"Kernel pozwala myśleć o transformacji przestrzeni: problem nieliniowy może stać się liniowo separowalny w nowej przestrzeni.","lesson":{"correct":"Czasem w 2D nie da się narysować prostej między klasami. Kernel to sprytna sztuczka: patrzymy na dane jakby były w bogatszej przestrzeni. Tam podział liniowy bywa możliwy. Intuicja R² → R³ pokazuje, że po uniesieniu punktów płaszczyzna może je rozdzielić.","example":"Na osi masz punkty wymieszane tak, że jednym progiem nie rozdzielisz. Po „przemapowaniu” do wyższej przestrzeni skrajne punkty układają się inaczej i nagle da się je odciąć linią.","remember":"Kernel: trudne w starej mapie → łatwiejsze po przemapowaniu przestrzeni.","wrong":{"B":"Kernel nie kasuje idei marginesu ani nie zamienia automatycznie SVM w regresję bez marginesu.","C":"Kernel nie polega na usuwaniu połowy cech.","D":"Hard/soft dotyczy tolerancji błędów (C), nie samego jądra."}}},{"n":11,"difficulty":"średnie","category":"ML","prompt":"Model.predict dla pierwszego wiersza zwraca 1. Co to oznacza po LabelEncoder w przykładzie spacer?","options":{"A":"Klasę „nie”, bo 1 zawsze znaczy brak spaceru","B":"Błąd modelu, bo predict może zwracać tylko tekst","C":"Klasę „tak” (wyjść na spacer)","D":"Prawdopodobieństwo 100%, bez wskazania klasy"},"correct":"C","why":"Po mapowaniu nie→0, tak→1 wartość 1 z predict oznacza klasę „tak”.","lesson":{"correct":"predict zwraca kod klasy, nie opis słowny. Skoro LabelEncoder ustawił tak=1, wynik 1 czyta się jako „tak”. Pierwszy wiersz to słonecznie + ciepło, a model przewiduje wyjście na spacer. Tekst odzyskasz przez encoder.classes_[1].","example":"Jak automat na basenie: wypluwa numer szafki 1. Wiesz z tabeli, że 1 = „tak, idziemy”. Bez tabeli mappingu numer nic nie mówi.","remember":"predict=1 przy tym encodingu = tak (spacer).","wrong":{"A":"„nie” to 0, nie 1.","B":"predict w sklearn zwraca kody liczbowe klas — to normalne.","D":"predict wskazuje klasę; prawdopodobieństwa daje predict_proba."}}},{"n":12,"difficulty":"średnie","category":"ML","prompt":"Co wyraża atrybut feature_importances_ w Random Forest?","options":{"A":"Liczbę klas w zbiorze Iris","B":"Względną ważność cech; większa wartość zwykle oznacza większe znaczenie","C":"Wartość parametru C w SVM","D":"Absolutną gwarancję, że cecha zawsze daje accuracy 100%"},"correct":"B","why":"feature_importances_ pokazuje względną ważność cech w lesie — wyższa wartość zwykle oznacza większy wpływ na decyzje.","lesson":{"correct":"Las składa się z wielu drzew. Cechy, które często i skutecznie dzielą węzły, dostają wyższą ważność. feature_importances_ to ranking „co model uznał za istotne”. To wskazówka, nie magiczna gwarancja idealnej dokładności.","example":"Przy kwiatach długość płatka może mieć dużą ważność, a numer wiersza prawie zero. Model mówi: patrz na płatek, nie na numer w tabeli.","remember":"Wyższa feature_importance_ ≈ cecha bardziej pomaga w podziałach lasu.","wrong":{"A":"Liczba klas to właściwość zadania, nie wynik feature_importances_.","C":"C należy do SVM, nie do opisu feature_importances_ w Random Forest.","D":"Ważność cechy nie gwarantuje accuracy 100%."}}},{"n":13,"difficulty":"trudne","category":"ML","prompt":"Dlaczego prawdopodobieństwa z GaussianNB w Pythonie mogą różnić się od wcześniejszego ręcznego liczenia Naive Bayes na kategoriach?","options":{"A":"Bo tu używamy wariantu Gaussian (założenie rozkładu normalnego), a ręcznie liczono wariant dyskretny na częstościach","B":"Bo GaussianNB zawsze zwraca wyłącznie klasę bez żadnych prawdopodobieństw","C":"Bo LabelEncoder wymusza, że obie klasy mają zawsze P=0,5","D":"Bo get_dummies usuwa target i model nie może już liczyć priorów"},"correct":"A","why":"Ręczne liczenie było dla danych dyskretnych; GaussianNB zakłada rozkład normalny, więc dokładne P mogą się różnić.","lesson":{"correct":"Ten sam przykład spacer można policzyć na dwa sposoby. Ręcznie: zliczasz kategorie (słońce/ciepło) i mnożysz częstości. W Pythonie: GaussianNB zakłada dzwon Gaussa dla cech. Inne założenie o P(cecha|klasa) daje inne liczby prawdopodobieństw. Decyzja klasy bywa podobna, ale procenty nie muszą być identyczne.","example":"Ręcznie dostałeś ok. 90,5% na „tak”. GaussianNB na zakodowanych dummy może pokazać inną, czasem bardzo wysoką wartość P(tak). To nie błąd kodu — inny wariant modelu.","remember":"Dyskretne częstości ≠ automatycznie te same P co GaussianNB.","wrong":{"B":"GaussianNB ma predict_proba — właśnie zwraca prawdopodobieństwa.","C":"LabelEncoder tylko koduje etykiety; nie ustawia sztywno P=0,5.","D":"get_dummies koduje cechy; priorów model nadal się uczy z y."}}},{"n":14,"difficulty":"łatwe","category":"ML","prompt":"Co oznacza Gini = 0 w węźle drzewa klasyfikacyjnego?","options":{"A":"Klasy są wymieszane po równo","B":"Entropia jest maksymalna","C":"Węzeł jest czysty i zawiera obserwacje jednej klasy","D":"Drzewo nie może mieć więcej niż jeden liść"},"correct":"C","why":"Gini = 0 oznacza węzeł czysty — wszystkie obserwacje należą do jednej klasy.","lesson":{"correct":"Wskaźnik Gini mierzy zanieczyszczenie węzła. Zero znaczy: zero mieszanki klas. Wszystkie próbki w węźle mają tę samą etykietę. Gdy klasy są wymieszane, Gini rośnie. Drzewo lubi podziały prowadzące do czystych węzłów.","example":"W worku same czerwone kulki — Gini 0. Pół na pół czerwone i niebieskie — Gini wyższe.","remember":"Gini 0 = czysty węzeł (jedna klasa).","wrong":{"A":"Równe wymieszanie to wysokie zanieczyszczenie, nie Gini = 0.","B":"Maksymalna entropia opisuje duży chaos klas, nie czystość.","D":"Gini = 0 nie ogranicza liczby liści całego drzewa."}}},{"n":15,"difficulty":"trudne","category":"ML","prompt":"Po predicie zwracającym kod liczbowy (np. 1) jak w materiale wracamy do etykiety tekstowej „tak”/„nie”?","options":{"A":"Przez kernel=\"linear\" w GaussianNB","B":"Przez usunięcie drop_first=True","C":"Przez model.score(X, y) zamiast predict","D":"Przez encoder.classes_[kod_klasy]"},"correct":"D","why":"encoder.classes_ trzyma oryginalne etykiety w kolejności kodów; indeksujemy kodem z predict.","lesson":{"correct":"LabelEncoder zapamiętuje, które słowo dostało który numer. Ta lista siedzi w encoder.classes_. Gdy predict poda 1, bierzesz classes_[1] i dostajesz „tak”. Bez tego widzisz tylko cyfrę i musisz pamiętać mapping z głowy.","example":"classes_ wygląda jak ['nie', 'tak']. Indeks 0 → nie, indeks 1 → tak. predict dał 1, więc classes_[1] = 'tak'.","remember":"Kod liczby → encoder.classes_[kod] → słowo.","wrong":{"A":"GaussianNB nie używa kernela linear do odkodowania etykiet.","B":"drop_first dotyczy dummy cech, nie odkodowania targetu.","C":"score mierzy accuracy, nie tłumaczy kodu na tekst."}}},{"n":16,"difficulty":"średnie","category":"ML","prompt":"Jaki jest domyślny kernel w klasie SVC w scikit-learn?","options":{"A":"Brak kernela — SVC nie używa jąder","B":"linear","C":"poly","D":"rbf"},"correct":"D","why":"Domyślnym kernelem w SVC jest rbf.","lesson":{"correct":"Gdy tworzysz SVC() bez argumentów, scikit-learn bierze kernel RBF. RBF umie rysować bardziej kręte, nieliniowe granice. Kernel linear musisz podać wprost, jeśli chcesz prostą granicę.","example":"Piszesz model = SVC() — dostajesz RBF. Piszesz SVC(kernel=\"linear\") — dostajesz linię.","remember":"SVC bez ustawień → kernel rbf.","wrong":{"A":"SVC właśnie opiera się na kernelach; domyślnie na rbf.","B":"Linear jest dostępny, ale nie jest domyślny.","C":"Poly też nie jest domyślny."}}},{"n":17,"difficulty":"trudne","category":"ML","prompt":"Do czego służy model.predict_proba(...) w praktycznej lekcji GaussianNB ze spacerem?","options":{"A":"Tylko do usuwania pierwszej kategorii z get_dummies","B":"Do zwrócenia prawdopodobieństw klas (np. P(nie) i P(tak)), nie wyłącznie samej etykiety","C":"Do wymuszenia hard margin w Bayesian SVM","D":"Do zamiany accuracy na R² regresji liniowej"},"correct":"B","why":"predict_proba zwraca prawdopodobieństwa przynależności do klas (w przykładzie P(nie) i P(tak)).","lesson":{"correct":"predict mówi „która klasa wygrywa”. predict_proba mówi „jak mocno”. Dla dwóch klas dostajesz dwa prawdopodobieństwa: dla „nie” i dla „tak”. W przykładzie P(tak) bywa bardzo wysokie. To pomaga zobaczyć pewność modelu, nie tylko zwycięzcę.","example":"Wynik w stylu [bardzo małe P(nie), prawie 1 dla P(tak)] oznacza: model prawie na pewno wybiera spacer. Nadal możesz odczytać etykietę przez predict albo argmax z tych P.","remember":"predict = etykieta; predict_proba = szanse klas.","wrong":{"A":"get_dummies to przygotowanie danych, nie rola predict_proba.","C":"Hard margin i SVM to inny temat; GaussianNB nie ustawia hard margin.","D":"predict_proba nie zamienia accuracy na R²."}}},{"n":18,"difficulty":"trudne","category":"ML","prompt":"Dlaczego na małym zbiorze (np. Iris) accuracy na teście bywa czasem wyższe niż na treningu?","options":{"A":"Bo przy małej liczbie próbek konkretny losowy podział może wrzucić trudniejsze próbki do train, a łatwiejsze do test","B":"Bo score() zawsze odwraca train i test","C":"Bo kernel linear gwarantuje overfitting ujemny","D":"Bo StandardScaler celowo psuje dane treningowe"},"correct":"A","why":"Przy małym zbiorze wynik mocno zależy od podziału: trudniejsze próbki w train i łatwiejsze w test mogą dać wyższe accuracy na teście.","lesson":{"correct":"Na dużych danych train zwykle wygrywa z testem. Na 150 próbkach Iris jeden pechowy podział wszystko zmienia. Kilka trudnych punktów w train obniża wynik treningu, a łatwy test wygląda świetnie. To nie magia modelu — to mała próbka i losowość podziału.","example":"Masz 10 pytań. Jeśli w treningu trafią najtrudniejsze, a na teście najłatwiejsze, wynik testu może być wyższy. Przy małej liczbie pytań taki przypadek zdarza się łatwo.","remember":"Mały zbiór + pechowy split → test czasem > train; interpretuj ostrożnie.","wrong":{"B":"score() nie odwraca zbiorów — liczy wynik na tym, co podasz.","C":"Nie ma „ujemnego overfittingu” wymuszanego przez kernel linear.","D":"Scaler nie psuje celowo train; ma ujednolicić skalę cech."}}},{"n":19,"difficulty":"średnie","category":"ML","prompt":"Dla pierwszego wiersza (pogoda = słonecznie, temperatura = ciepło) co przewiduje wytrenowany GaussianNB w lekcji Pythonowej?","options":{"A":"Zawsze „nie”, bo prior „nie” jest większy","B":"Brak decyzji, dopóki nie policzysz ręcznie mianownika Bayesa","C":"„tak” — wyjść na spacer","D":"Losową klasę niezależnie od cech"},"correct":"C","why":"Dla słonecznie + ciepło model przewiduje klasę tak (wyjść na spacer).","lesson":{"correct":"Pierwszy wiersz to ten sam case, który wcześniej liczono ręcznie: słonecznie i ciepło. Po fit model.predict na tym wierszu daje kod 1, czyli „tak”. To spójne z intuicją: przy ładnej pogodzie i cieple model skłania się do spaceru.","example":"Bierzesz data.iloc[[0]], wołasz predict i dostajesz 1. Potem classes_[1] mówi „tak”. predict_proba pokazuje, że P(tak) jest bardzo wysokie.","remember":"Słonecznie + ciepło → predykcja: tak (spacer).","wrong":{"A":"Prior „nie” nie jest większy (jest 4/9 vs 5/9), a model i tak wybiera „tak”.","B":"predict działa bez ręcznego mianownika — model już jest wytrenowany.","D":"Predykcja zależy od cech, nie jest czysto losowa."}}},{"n":20,"difficulty":"trudne","category":"ML","prompt":"Kiedy hard margin w SVM działa najlepiej?","options":{"A":"Gdy zawsze używamy wyłącznie kernela poly degree=3","B":"Gdy dane są mocno zaszumione i pełne outlierów","C":"Gdy problem jest regresją z metryką MAE","D":"Gdy dane są dobrze rozdzielone, bez istotnych outlierów i liniowo separowalne"},"correct":"D","why":"Hard margin wymaga czystego podziału: najlepiej przy danych dobrze rozdzielonych, bez istotnych outlierów i liniowo separowalnych.","lesson":{"correct":"Hard margin nie wybacza błędów. Margines ma być czysty. To działa, gdy klasy da się ładnie rozdzielić i nie ma zbłąkanych punktów psujących pas. Przy szumie i outlierach lepszy bywa soft margin, który odpuszcza część naruszeń.","example":"Dwa klastry punktów z wyraźną luką pośrodku — hard margin rysuje szeroki, czysty korytarz. Dodaj jeden punkt daleko w obcym klastrze — hard margin wariuje; soft margin zostaje spokojniejszy.","remember":"Hard margin lubi czyste, liniowo separowalne dane bez outlierów.","wrong":{"A":"Hard margin nie wymaga poly degree=3.","B":"Przy szumie i outlierach hard margin zwykle cierpi.","C":"Hard margin to koncepcja klasyfikacji SVM, nie przepis na MAE."}}}]};
const form=document.getElementById("quiz");
const answered=document.getElementById("answered");
const results=document.getElementById("results");
let lastGrade=null;
const esc=value=>String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function render(){
form.innerHTML=QUIZ.questions.map(q=>`<article class="card" id="card-${q.n}"><div class="meta"><span class="tag">#${q.n}</span><span class="tag diff-${q.difficulty}">${q.difficulty}</span><span class="tag">${q.category}</span></div><p class="prompt">${q.n}. ${esc(q.prompt)}</p><div class="options">${["A","B","C","D"].map(letter=>`<label class="opt"><input type="radio" name="q${q.n}" value="${letter}"><span class="letter">${letter})</span><span>${esc(q.options[letter])}</span></label>`).join("")}<label class="opt idk-option"><input type="radio" name="q${q.n}" value="?"><span class="letter">?</span><span>Nie mam pojęcia — bez zgadywania, chcę się nauczyć</span></label></div><label class="confidence">Pewność:<select name="c${q.n}" aria-label="Pewność pytania ${q.n}"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><div class="feedback" id="feedback-${q.n}" hidden></div></article>`).join("");
}
function collect(){
return QUIZ.questions.map(q=>{const selected=form.querySelector(`input[name="q${q.n}"]:checked`);const confidence=form.querySelector(`select[name="c${q.n}"]`).value;return{n:q.n,answer:selected?selected.value:"",confidence:confidence||"—"};});
}
function updateProgress(){
answered.textContent=String(collect().filter(row=>row.answer).length);
}
function lessonBlocks(q,wrong){
return `<div class="lesson">${wrong?`<div class="lesson-block wrong"><h3>Twoja odpowiedź</h3><p>${esc(q.lesson.wrong[wrong])}</p></div>`:""}<div class="lesson-block"><h3>Poprawna myśl</h3><p>${esc(q.lesson.correct)}</p></div><div class="lesson-block"><h3>Przykład</h3><p>${esc(q.lesson.example)}</p></div><div class="lesson-block remember"><h3>Zapamiętaj</h3><p>${esc(q.lesson.remember)}</p></div></div>`;
}
function grade(){
const rows=collect();
const missing=rows.filter(row=>!row.answer).map(row=>row.n);
if(missing.length){alert(`Brak odpowiedzi w pytaniach: ${missing.join(", ")}`);return null}
let score=0;
let unknown=0;
const detail=rows.map(row=>{
const q=QUIZ.questions[row.n-1];
const isUnknown=row.answer==="?";
const isCorrect=row.answer===q.correct;
if(isCorrect)score+=1;
if(isUnknown)unknown+=1;
const status=isCorrect?"OK":isUnknown?"NIE WIEM":"BŁĄD";
const card=document.getElementById(`card-${q.n}`);
const feedback=document.getElementById(`feedback-${q.n}`);
card.classList.remove("ok","bad","idk");
card.classList.add(isCorrect?"ok":isUnknown?"idk":"bad");
feedback.hidden=false;
feedback.innerHTML=isCorrect?`<p class="status-ok">OK</p><p>${esc(q.why)}</p>`:isUnknown?`<p class="status-idk">NIE WIEM · Poprawna: ${q.correct}</p><p class="encourage">Bez zgadywania — oto wyjaśnienie.</p>${lessonBlocks(q,"")}`:`<p class="status-bad">BŁĄD · Twoja: ${row.answer} · Poprawna: ${q.correct}</p>${lessonBlocks(q,row.answer)}`;
return{...row,correct:q.correct,status,why:q.why,prompt:q.prompt,isCorrect,isUnknown};
});
const percentage=Math.round(score/20*100);
document.getElementById("score").textContent=`${score}/20`;
document.getElementById("percentage").textContent=`Skuteczność: ${percentage}%`;
document.getElementById("unknown").textContent=`Nie wiem: ${unknown}`;
document.getElementById("state").textContent="Sprawdzono";
results.classList.add("show");
lastGrade={score,percentage,unknown,detail};
results.scrollIntoView({behavior:"smooth",block:"start"});
return lastGrade;
}
function download(filename,content){
const url=URL.createObjectURL(new Blob([content],{type:"text/markdown;charset=utf-8"}));
const link=document.createElement("a");
link.href=url;
link.download=filename;
link.click();
URL.revokeObjectURL(url);
}
function answersMd(detail){
const rows=detail.map(row=>`| ${row.n} | ${row.answer} | ${row.confidence==="—"?"":row.confidence} |  |`).join("\n");
return `# Moje odpowiedzi – ${QUIZ.date}\n\n| # | Twoja odpowiedź (A/B/C/D/?) | Pewność (1-5) | Uwagi |\n|---|------------------------------|---------------|-------|\n${rows}\n\n## Notatki\n\n`;
}
function resultsMd(grade){
const rows=grade.detail.map(row=>`| ${row.n} | ${row.answer} | ${row.correct} | ${row.status} | ${row.confidence} | ${row.why} |`).join("\n");
const strong=grade.detail.filter(row=>row.isCorrect).map(row=>row.n);
const weak=grade.detail.filter(row=>!row.isCorrect).map(row=>`#${row.n} (${row.status})`);
const strongText=strong.length?`Pytania OK: ${strong.join(", ")}.`:"Brak trafionych pytań w tej próbie.";
const weakText=weak.length?`Do powtórki: ${weak.join(", ")}.`:"Brak pozycji do powtórki.";
return `# Wynik quizu — ${QUIZ.date}\n\n## Wynik\n\n- Wynik: ${grade.score}/20\n- Skuteczność: ${grade.percentage}%\n- Nie wiem: ${grade.unknown}\n\n## Szczegóły\n\n| # | Twoja odpowiedź | Poprawna odpowiedź | Wynik | Pewność | Komentarz |\n|---|-----------------|--------------------|-------|---------|-----------|\n${rows}\n\n## Mocne strony\n\n${strongText}\n\n## Obszary do powtórki\n\n${weakText}\n`;
}
form.addEventListener("change",updateProgress);
document.getElementById("grade").addEventListener("click",grade);
document.getElementById("reset").addEventListener("click",()=>{form.reset();results.classList.remove("show");lastGrade=null;document.getElementById("state").textContent="W trakcie";QUIZ.questions.forEach(q=>{const card=document.getElementById(`card-${q.n}`);const feedback=document.getElementById(`feedback-${q.n}`);card.classList.remove("ok","bad","idk");feedback.hidden=true;feedback.innerHTML="";});updateProgress();});
document.getElementById("download-answers").addEventListener("click",()=>{const grade=lastGrade||grade();if(!grade)return;download(`${QUIZ.date}_my_answers.md`,answersMd(grade.detail));});
document.getElementById("download-results").addEventListener("click",()=>{const grade=lastGrade||grade();if(!grade)return;download(`${QUIZ.date}_results.md`,resultsMd(grade));});
render();
updateProgress();
</script>
</body>
</html>
