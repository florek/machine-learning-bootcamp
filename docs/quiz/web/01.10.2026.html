<style>

<script>
const QUIZ={"date": "01.10.2026", "questions": [{"n": 1, "difficulty": "łatwe", "category": "ML", "prompt": "Na czym opiera się naiwny klasyfikator Bayesa?", "options": {"A": "Wyłącznie na głosowaniu wielu drzew decyzyjnych", "B": "Na twierdzeniu Bayesa", "C": "Na maksymalizacji szerokości marginesu SVM", "D": "Na uśrednianiu współczynników regresji liniowej"}, "correct": "B", "why": "Naive Bayes to metoda klasyfikacji oparta na twierdzeniu Bayesa.", "lesson": {"correct": "Naiwny klasyfikator Bayesa bierze nazwę od Thomasa Bayesa. Jego sercem jest twierdzenie Bayesa. Dzięki niemu model odwraca prawdopodobieństwo warunkowe. Z cech próbki liczy, która klasa jest najbardziej prawdopodobna. To nie jest las drzew i nie jest SVM. To prosty, szybki model statystyczny.", "example": "Wyobraź sobie, że znasz gorączkę pacjenta. Chcesz wiedzieć, jak bardzo prawdopodobna jest grypa. Twierdzenie Bayesa łączy: jak często grypa daje gorączkę, jak często w ogóle jest grypa i jak często w ogóle jest gorączka. Naive Bayes robi podobną rzecz dla wielu cech naraz.", "remember": "Naive Bayes = klasyfikacja na twierdzeniu Bayesa.", "wrong": {"A": "Głosowanie drzew to Random Forest. Naive Bayes liczy prawdopodobieństwa, nie buduje lasu.", "C": "Maksymalny margines należy do SVM. Tu nie szukamy pasa między klasami.", "D": "Uśrednianie współczynników regresji nie opisuje Naive Bayes."}}}, {"n": 2, "difficulty": "łatwe", "category": "ML", "prompt": "Co pozwala soft margin w SVM?", "options": {"A": "Zakazuje jakiegokolwiek naruszenia marginesu", "B": "Zamienia klasyfikację na regresję z metryką MAE", "C": "Usuwa wszystkie kernele poza linear", "D": "Naruszyć margines i zaakceptować część błędnych klasyfikacji"}, "correct": "D", "why": "Soft margin jest elastyczny: pozwala naruszyć margines i zaakceptować część błędów, zwłaszcza przy outlierach.", "lesson": {"correct": "Hard margin wymaga idealnego rozdzielenia bez błędów. Soft margin jest łagodniejszy. Może wpuścić kilka punktów w pas marginesu albo nawet po złej stronie. Dzięki temu lepiej znosi obserwacje odstające. W praktyce to częstsze i bezpieczniejsze podejście przy niedoskonałych danych.", "example": "Masz dwie grupy punktów i jeden dziwny punkt po złej stronie. Hard margin mocno wykrzywia granicę pod ten punkt. Soft margin mówi: ten punkt może być wyjątkiem. Margines zostaje szerszy i rozsądniejszy.", "remember": "Soft margin = wolno trochę się pomylić dla szerszego pasa.", "wrong": {"A": "Zakaz naruszeń to hard margin, nie soft margin.", "B": "Soft margin nie zamienia problemu na regresję MAE.", "C": "Soft margin nie usuwa kerneli. Kernel ustawiasz osobno."}}}, {"n": 3, "difficulty": "łatwe", "category": "ML", "prompt": "Dlaczego klasyfikator Bayesa nazywamy „naiwnym”?", "options": {"A": "Bo zakłada, że poszczególne cechy są od siebie niezależne", "B": "Bo zawsze ma accuracy dokładnie 0%", "C": "Bo nie potrafi pracować z więcej niż jedną cechą", "D": "Bo wymaga zawsze kernela RBF"}, "correct": "A", "why": "„Naiwność” wynika z silnego założenia, że cechy są od siebie niezależne.", "lesson": {"correct": "Część „Bayes” pochodzi od twierdzenia Bayesa. Część „naiwny” mówi o uproszczeniu. Model zakłada, że cechy nie wpływają na siebie nawzajem. W prawdziwym świecie często wpływają. Mimo to założenie mocno upraszcza obliczenia. Dlatego nazywamy je naiwnym.", "example": "Wzrost, masa ciała i BMI są powiązane. Naive Bayes i tak traktuje je jak niezależne przy danej klasie. To uproszczenie. Czasem działa zaskakująco dobrze mimo tej naiwności.", "remember": "Naiwny = założenie niezależności cech.", "wrong": {"B": "Model nie jest „naiwny”, bo zawsze ma wynik zero. Może działać bardzo dobrze.", "C": "Wręcz przeciwnie: dobrze skaluje się przy wielu cechach.", "D": "Kernel RBF należy do SVM, nie do definicji „naiwności” Bayesa."}}}, {"n": 4, "difficulty": "średnie", "category": "ML", "prompt": "Przy P(grypa)=15%, P(gorączka)=20%, P(gorączka|grypa)=80% ile wynosi P(grypa|gorączka) według twierdzenia Bayesa?", "options": {"A": "15%", "B": "20%", "C": "60%", "D": "80%"}, "correct": "C", "why": "P(A|B)=P(B|A)*P(A)/P(B)=0,8*0,15/0,20=0,6, czyli 60%.", "lesson": {"correct": "Podstawiasz liczby do wzoru Bayesa. Najpierw mnożysz prawdopodobieństwo gorączki przy grypie przez prawdopodobieństwo grypy. Potem dzielisz przez prawdopodobieństwo gorączki w ogóle. Dostajesz 0,6. To znaczy: wśród osób z wysoką gorączką około 60% ma grypę. To klasyczny przykład odwracania warunku.", "example": "0,8 razy 0,15 daje 0,12. Dzielisz 0,12 przez 0,20. Wynik to 0,60. Czyli 60%, nie 80%. 80% mówiło tylko, jak często grypa daje gorączkę, a nie odwrotnie.", "remember": "0,8 × 0,15 / 0,20 = 0,60 → 60%.", "wrong": {"A": "15% to prior grypy, nie wynik po uwzględnieniu gorączki.", "B": "20% to częstość gorączki, nie posterior grypy.", "D": "80% to P(gorączka|grypa), a pytanie pyta o odwrotne P(grypa|gorączka)."}}}, {"n": 5, "difficulty": "łatwe", "category": "ML", "prompt": "Jaki jest domyślny kernel w klasie SVC w scikit-learn?", "options": {"A": "linear", "B": "rbf", "C": "poly", "D": "Brak kernela — SVC nie używa jąder"}, "correct": "B", "why": "Domyślnym kernelem w SVC jest rbf.", "lesson": {"correct": "Gdy tworzysz SVC() bez ustawiania kernela, dostajesz RBF. RBF buduje bardziej złożone, nieliniowe granice. Kernel linear musisz ustawić świadomie. Poly też. Warto pamiętać domyślną wartość, żeby nie mylić wyników eksperymentów.", "example": "Piszesz model = SVC(). Nie podajesz kernel. Model i tak używa kernel='rbf'. Jeśli chcesz prostą linię, musisz napisać kernel='linear'.", "remember": "Domyślny SVC = kernel rbf.", "wrong": {"A": "Linear jest dostępny, ale nie jest domyślny.", "C": "Poly trzeba ustawić ręcznie, np. z degree.", "D": "Domyślny kernel to rbf, a nie brak kernela. Poly trzeba ustawić osobno."}}}, {"n": 6, "difficulty": "średnie", "category": "ML", "prompt": "Co w modelu Naive Bayes oznacza prior P(Y)?", "options": {"A": "Prawdopodobieństwo klasy Y przed uwzględnieniem cech", "B": "Prawdopodobieństwo klasy Y dopiero po zobaczeniu wszystkich cech", "C": "Prawdopodobieństwo obserwowanych danych bez klasy", "D": "Szerokość marginesu SVM dla klasy Y"}, "correct": "A", "why": "Prior P(Y) to prawdopodobieństwo klasy przed uwzględnieniem cech.", "lesson": {"correct": "Prior to punkt startowy. Mówi, jak często klasa występuje sama z siebie. Jeszcze nie patrzymy na cechy próbki. Potem mnożymy through likelihoods cech. Na końcu dostajemy posterior. Prior jest więc „wcześniejszym” przekonaniem o klasie.", "example": "Jeśli 15% pacjentów ma grypę, prior grypy wynosi 0,15. Dopiero potem dokładamy gorączkę i inne objawy. Po cechach prior zmienia się w posterior.", "remember": "Prior = P(Y) zanim zobaczysz cechy.", "wrong": {"B": "To opisuje posterior P(Y|X), nie prior.", "C": "To evidence P(X), nie prior klasy.", "D": "Margines dotyczy SVM, nie prioru w Bayesie."}}}, {"n": 7, "difficulty": "średnie", "category": "ML", "prompt": "Kiedy hard margin w SVM działa najlepiej?", "options": {"A": "Gdy dane są mocno zaszumione i pełne outlierów", "B": "Gdy problem jest regresją z metryką MAE", "C": "Gdy zawsze używamy wyłącznie kernela poly degree=3", "D": "Gdy dane są dobrze rozdzielone, bez istotnych outlierów i liniowo separowalne"}, "correct": "D", "why": "Hard margin najlepiej działa przy czystych, dobrze rozdzielonych, liniowo separowalnych danych bez istotnych outlierów.", "lesson": {"correct": "Hard margin nie pozwala na błędy ani naruszenia pasa. Dlatego potrzebuje „ładnych” danych. Klasy mają być wyraźnie oddzielone. Nie powinno być dziwnych punktów psujących obraz. Gdy dane są brudne, soft margin jest bezpieczniejszy.", "example": "Dwie chmury punktów z pustym pasem pośrodku i bez zbłąkanych kropek. Hard margin rysuje szeroki, czysty margines. Dodaj jeden outlier po złej stronie i hard margin zaczyna cierpieć.", "remember": "Hard margin lubi czyste, liniowo separowalne dane.", "wrong": {"A": "Przy outlierach lepiej sprawdza się soft margin.", "B": "Hard margin dotyczy klasyfikacji SVM, nie regresji MAE.", "C": "Kernel poly nie jest warunkiem hard margin."}}}, {"n": 8, "difficulty": "średnie", "category": "ML", "prompt": "Jak wygląda wzór na prawdopodobieństwo jednoczesnego zajścia dwóch niezależnych zdarzeń A i B?", "options": {"A": "P(A ∩ B) = P(A) + P(B)", "B": "P(A ∩ B) = P(A) / P(B)", "C": "P(A ∩ B) = P(A) * P(B)", "D": "P(A ∩ B) = P(A) - P(B)"}, "correct": "C", "why": "Dla niezależnych zdarzeń P(A ∩ B) = P(A) * P(B).", "lesson": {"correct": "Niezależność znaczy: jedno zdarzenie nie zmienia szans drugiego. Wtedy wspólne prawdopodobieństwo jest iloczynem. To prosty, ale kluczowy fakt. Naive Bayes korzysta z podobnej idei dla wielu cech. Zamiast jednego skomplikowanego wspólnego rozkładu mnoży prostsze części.", "example": "Moneta i kostka. Szansa orła to 1/2. Szansa szóstki to 1/6. Jeśli rzuty są niezależne, szansa orła i szóstki naraz to (1/2)*(1/6)=1/12. Nie dodajesz i nie odejmujesz.", "remember": "Niezależne zdarzenia → mnożysz prawdopodobieństwa.", "wrong": {"A": "Dodawanie nie jest wzorem na przecięcie niezależnych zdarzeń.", "B": "Dzielenie należy do wzoru Bayesa na warunek, nie do iloczynu niezależności.", "D": "Odejmowanie nie opisuje niezależnego przecięcia."}}}, {"n": 9, "difficulty": "łatwe", "category": "ML", "prompt": "Co mierzy MAE (Mean Absolute Error) w regresji?", "options": {"A": "Średnią wartość bezwzględną błędu predykcji", "B": "Udział poprawnie sklasyfikowanych próbek", "C": "Szerokość marginesu SVM", "D": "Liczbę drzew w Random Forest"}, "correct": "A", "why": "MAE to średnia wartość bezwzględna różnicy między predykcją a prawdziwą wartością.", "lesson": {"correct": "W regresji liczymy, o ile model się myli liczbowo. MAE bierze absolutną wartość każdego błędu. Potem uśrednia te wartości. Duże i małe pomyłki wchodzą liniowo. To czytelna metryka w jednostkach targetu.", "example": "Błędy to 2, -4 i 0. Absolutne: 2, 4, 0. Średnia to 2. MAE wynosi 2. Accuracy by tu nie pasowało, bo to nie klasyfikacja.", "remember": "MAE = średnia z |błąd|.", "wrong": {"B": "Udział trafionych klas to accuracy, nie MAE.", "C": "Szerokość marginesu dotyczy SVM.", "D": "Liczbę drzew ustawia n_estimators."}}}, {"n": 10, "difficulty": "trudne", "category": "ML", "prompt": "Jak Naive Bayes upraszcza P(X1, X2, ..., Xn | Y) dzięki założeniu niezależności?", "options": {"A": "Zamienia je na maksymalną wartość spośród P(Xi|Y)", "B": "Zamienia je na sumę P(Xi|Y)", "C": "Odrzuca wszystkie cechy poza pierwszą", "D": "Rozpisuje je jako iloczyn P(X1|Y) * P(X2|Y) * ... * P(Xn|Y)"}, "correct": "D", "why": "Przy założeniu warunkowej niezależności wspólne prawdopodobieństwo cech przy klasie staje się iloczynem pojedynczych P(Xi|Y).", "lesson": {"correct": "Bez założenia wspólne prawdopodobieństwo wielu cech jest trudne. Naive Bayes mówi: cechy są niezależne względem klasy. Wtedy jedna wielka wspólna szansa rozpada się na mnożenie małych szans. Każda cecha ma własne P(Xi|Y). To ogromne uproszczenie obliczeń i powód szybkości modelu.", "example": "Masz cechy: gorączka, kaszel, ból głowy przy klasie grypa. Zamiast jednego skomplikowanego P(wszystkie|grypa) liczysz P(gorączka|grypa) * P(kaszel|grypa) * P(ból|grypa). Potem mnożysz przez prior grypy.", "remember": "Niezależność → wspólne P(X|Y) = iloczyn P(Xi|Y).", "wrong": {"A": "Model nie bierze tylko maksimum likelihoodów.", "B": "To iloczyn, nie suma prawdopodobieństw cech.", "C": "Naive Bayes właśnie lubi wiele cech; nie odrzuca ich do jednej."}}}, {"n": 11, "difficulty": "średnie", "category": "ML", "prompt": "Co wyraża atrybut feature_importances_ w Random Forest?", "options": {"A": "Absolutną gwarancję, że cecha zawsze ma accuracy 100%", "B": "Względną ważność cech; większa wartość zwykle oznacza większe znaczenie", "C": "Wartość parametru C w SVM", "D": "Liczbę klas w zbiorze Iris"}, "correct": "B", "why": "feature_importances_ pokazuje względną ważność cech; większa wartość zwykle oznacza większe znaczenie (wartości sumują się około 1).", "lesson": {"correct": "Las patrzy, które cechy najczęściej i najbardziej pomagały w podziałach. Z tego powstaje ranking ważności. To ranking względny, nie magiczna pewność. W Iris zwykle wyżej stoją cechy płatka niż działki kielicha. To pomaga zrozumieć model, ale nie zastępuje oceny na teście.", "example": "Dostajesz wektor wagi: petal length duża, sepal width mała. Model bardziej polega na długości płatka. Suma wag jest bliska 1.0. To mapa „które cechy liczą się bardziej”.", "remember": "feature_importances_ = względny ranking ważności cech.", "wrong": {"A": "Ważność cechy nie gwarantuje accuracy 100%.", "C": "Parametr C należy do SVM, nie do feature_importances_.", "D": "Liczba klas wynika z targetu, nie z tego atrybutu."}}}, {"n": 12, "difficulty": "średnie", "category": "ML", "prompt": "Dlaczego przy samym porównywaniu klas w Naive Bayes mianownik P(X1,...,Xn) często można pominąć?", "options": {"A": "Bo zawsze wynosi dokładnie zero", "B": "Bo prior każdej klasy jest zawsze równy jeden", "C": "Bo dla tej samej próbki ten mianownik jest taki sam dla każdej klasy", "D": "Bo Naive Bayes nie używa żadnych prawdopodobieństw"}, "correct": "C", "why": "Dla tej samej próbki evidence P(X) jest wspólne dla wszystkich klas, więc przy porównaniu wystarczy licznik.", "lesson": {"correct": "Klasyfikujesz jedną konkretną próbkę. Jej cechy X są ustalone. Evidence P(X) nie zależy od tego, którą klasę akurat sprawdzasz. Przy porównywaniu klas ten sam dzielnik nic nie zmienia kolejności. Dlatego wystarczy porównać prior razy iloczyn likelihoodów. To praktyczna oszczędność.", "example": "Dla klasy A licznik daje 0,10. Dla klasy B daje 0,40. Mianownik dla obu to np. 0,5. Po dzieleniu nadal B wygrywa. Możesz od razu porównać 0,10 z 0,40 i wybrać B.", "remember": "To samo X → ten sam mianownik → porównuj liczniki.", "wrong": {"A": "Mianownik nie jest zerem; po prostu bywa zbędny przy rankingu klas.", "B": "Priory klas nie muszą być równe jeden.", "D": "Naive Bayes właśnie jest modelem prawdopodobieństwowym."}}}, {"n": 13, "difficulty": "łatwe", "category": "ML", "prompt": "Co oznacza Gini = 0 w węźle drzewa klasyfikacyjnego?", "options": {"A": "Węzeł jest czysty i zawiera obserwacje jednej klasy", "B": "Klasy są wymieszane po równo", "C": "Entropia jest maksymalna", "D": "Model jest gorszy od przewidywania średniej targetu"}, "correct": "A", "why": "Gini równe zero oznacza czysty węzeł z obserwacjami jednej klasy.", "lesson": {"correct": "Gini mierzy, jak mocno klasy są wymieszane w węźle. Zero znaczy: brak bałaganu. Wszystkie próbki mają tę samą etykietę. Taki węzeł jest czysty. Im wyższe Gini, tym więcej mieszania klas.", "example": "W liściu siedzi 20 próbek Setosa i nic więcej. Gini spada do zera. Jeśli byłoby po połowie dwóch klas, Gini byłoby wysokie.", "remember": "Gini zero = czysty węzeł jednej klasy.", "wrong": {"B": "Równe wymieszanie to wysoka nieczystość, nie zero.", "C": "Maksymalna entropia też opisuje mocne wymieszanie.", "D": "Porównanie ze średnią dotyczy R², nie Gini."}}}, {"n": 14, "difficulty": "średnie", "category": "ML", "prompt": "Które zastosowania są typowe dla Naive Bayes według materiału kursu?", "options": {"A": "Wyłącznie regresja wielomianowa stopnia 10", "B": "Budowa lasu stu drzew bez głosowania", "C": "Dobór kernela poly w SVM", "D": "Klasyfikacja dokumentów i filtrowanie spamu"}, "correct": "D", "why": "W materiale wskazano m.in. klasyfikację dokumentów i filtrowanie spamu jako typowe zastosowania Naive Bayes.", "lesson": {"correct": "Naive Bayes lubi dużo cech i duże zbiory. Teksty naturalnie dają wiele cech, np. obecność słów. Spam filtering to klasyczny przykład. Model jest szybki dzięki założeniu niezależności. Dlatego często pojawia się właśnie przy dokumentach i spamie.", "example": "Mail ma słowa „promocja”, „gratis”, „kliknij”. Model liczy, jak te słowa wyglądają przy klasie spam i nie-spam. Wybiera klasę z wyższym wynikiem. Tak działa intuicja filtrowania spamu.", "remember": "Naive Bayes: dokumenty i spam to typowe zastosowania.", "wrong": {"A": "Regresja wielomianowa to inny temat kursu, nie typowe zastosowanie NB.", "B": "Las drzew to Random Forest.", "C": "Dobór kernela należy do SVM."}}}, {"n": 15, "difficulty": "trudne", "category": "ML", "prompt": "Czym głównie różnią się odmiany Naive Bayes, np. Gaussian i Multinomial?", "options": {"A": "Tym, czy model może mieć więcej niż jedną klasę", "B": "Założeniem co do rozkładu cech", "C": "Tym, czy używają twierdzenia Bayesa", "D": "Tym, czy wymagają kernela RBF"}, "correct": "B", "why": "Różne wersje Naive Bayes różnią się głównie założeniem o rozkładzie cech.", "lesson": {"correct": "Wszystkie te odmiany stoją na twierdzeniu Bayesa i naiwnej niezależności. Różnica jest w tym, jak modelują P(Xi|Y). Gaussian zakłada rozkład gaussowski cech. Multinomial pasuje do innych typów danych, np. zliczeń. Wybór odmiany to wybór założenia o rozkładzie.", "example": "Masz ciągłe pomiary typu temperatura. Naturalniej myślisz o Gaussian Naive Bayes. Masz zliczenia słów w dokumentach. Częściej myślisz o wariancie multinomialnym. Rdzeń Bayesa zostaje ten sam.", "remember": "Odmiany NB = różne założenia o rozkładzie cech.", "wrong": {"A": "Wiele klas nie jest cechą rozróżniającą te odmiany.", "C": "Obie odmiany nadal opierają się na twierdzeniu Bayesa.", "D": "Kernel RBF należy do SVM, nie do wyboru odmiany NB."}}}, {"n": 16, "difficulty": "średnie", "category": "ML", "prompt": "Co zwykle robi większe C w SVM?", "options": {"A": "Daje węższy margines i mniejszą tolerancję na błędy", "B": "Zawsze usuwa support vectors", "C": "Zamienia accuracy na R²", "D": "Wymusza ocenę wyłącznie metryką MAE"}, "correct": "A", "why": "Większe C zwykle oznacza węższy margines i mniejszą tolerancję na błędy klasyfikacji.", "lesson": {"correct": "C karze pomyłki. Duże C karze mocno. Model mniej chętnie zostawia błędy i zwęża margines. Małe C jest łagodniejsze i lubi szerszy pas. Domyślnie często spotykasz C=1. To pokrętło kompromisu między szerokością marginesu a wiernością treningowi.", "example": "Przy bardzo dużym C model walczy o każdy punkt treningowy. Pas między klasami robi się wąski. Przy małym C kilka punktów może wejść w margines, a pas zostaje szerszy.", "remember": "Duże C: węższy margines, mniejsza tolerancja błędów.", "wrong": {"B": "C nie usuwa wektorów nośnych automatycznie.", "C": "C nie zamienia metryk accuracy na R².", "D": "MAE nie jest wymuszane przez C."}}}, {"n": 17, "difficulty": "trudne", "category": "ML", "prompt": "Jak Naive Bayes wybiera klasę dla nowej próbki?", "options": {"A": "Losuje klasę z równym prawdopodobieństwem bez cech", "B": "Bierze zawsze klasę o najmniejszym priorze", "C": "Oblicza dla każdej klasy wartość opartą o prior i likelihoods, potem wybiera klasę z najwyższym wynikiem", "D": "Buduje jedno drzewo i czyta etykietę z korzenia"}, "correct": "C", "why": "Dla każdej klasy liczony jest wynik z prior i likelihoodów cech; wybierana jest klasa o największej wartości (największy posterior).", "lesson": {"correct": "Dostajesz cechy próbki. Dla klasy A liczysz prior A razy iloczyn P(cecha|A). To samo robisz dla B i C. Porównujesz wyniki. Wygrywa największa wartość. To właśnie wybór klasy o najwyższym posterior. Mianownik często możesz pominąć przy samym rankingu.", "example": "Wyniki: klasa A 0,10; klasa B 0,75; klasa C 0,15. Wybierasz B. Nie losujesz. Nie bierzesz najmniejszego prioru. Bierzesz najwyższy wynik po cechach.", "remember": "NB wybiera klasę z najwyższym wynikiem prior × likelihoods.", "wrong": {"A": "Model nie losuje klasy bez użycia cech.", "B": "Najmniejszy prior nie jest regułą decyzji.", "D": "Naive Bayes nie buduje drzewa decyzyjnego."}}}, {"n": 18, "difficulty": "trudne", "category": "ML", "prompt": "Jaka jest strata binary cross-entropy dla obserwacji z y=1?", "options": {"A": "Zawsze dokładnie równa MAE", "B": "Równa szerokości marginesu SVM", "C": "Równa −log(1 − y_pred)", "D": "Równa −log(y_pred)"}, "correct": "D", "why": "Dla y=1 strata binary cross-entropy wynosi −log(y_pred).", "lesson": {"correct": "Binary cross-entropy karze złe prawdopodobieństwa w klasyfikacji binarnej. Gdy prawdziwa etykieta to 1, patrzysz na y_pred. Im bliżej 1, tym strata mniejsza. Im bliżej 0, tym −log(y_pred) rośnie mocno. Dla y=0 używasz drugiej gałęzi: −log(1−y_pred).", "example": "Prawda to klasa 1. Model daje y_pred=0,9. −log(0,9) jest małe. Jeśli model da 0,1, −log(0,1) jest duże. Model dostaje mocną karę za pewność w złą stronę.", "remember": "y=1 → strata −log(y_pred).", "wrong": {"A": "BCE to nie to samo co MAE.", "B": "Margines SVM nie jest tą stratą.", "C": "−log(1−y_pred) dotyczy przypadku y=0, nie y=1."}}}, {"n": 19, "difficulty": "trudne", "category": "ML", "prompt": "Który podział wybiera drzewo decyzyjne podczas budowy?", "options": {"A": "Podział z najmniejszym zyskiem informacyjnym", "B": "Podział z największym zyskiem informacyjnym (największy spadek ważonej nieczystości)", "C": "Podział dający największą nieczystość dzieci", "D": "Losowy podział bez oceny klas"}, "correct": "B", "why": "Drzewo wybiera podział z największym zyskiem informacyjnym, czyli największą redukcją ważonej nieczystości.", "lesson": {"correct": "Drzewo sprawdza możliwe cięcia cechy. Liczy, jak bardzo spada ważona nieczystość dzieci względem rodzica. Ten spadek to zysk informacyjny. Algorytm bierze największy zysk. Dzięki temu węzły stają się czystsze klasowo.", "example": "Nieczystość rodzica wynosi 1,0. Po podziale ważona nieczystość dzieci spada do 0,3. Zysk to 0,7. Jeśli inny podział daje zysk 0,2, wygrywa ten z 0,7.", "remember": "Najlepszy podział = największy zysk informacyjny.", "wrong": {"A": "Najmniejszy zysk prawie nie porządkuje klas.", "C": "Chcemy zmniejszać nieczystość dzieci, nie ją zwiększać.", "D": "Podziały są oceniane, np. Gini lub entropią, nie losowo bez oceny."}}}, {"n": 20, "difficulty": "trudne", "category": "ML", "prompt": "Jaka jest najważniejsza intuicja działania kerneli w SVM?", "options": {"A": "Kernel zawsze usuwa połowę cech wejściowych", "B": "Kernel zamienia accuracy na R²", "C": "Dane nieliniowo separowalne w jednej przestrzeni mogą stać się liniowo separowalne po odpowiednim przekształceniu", "D": "Kernel wymusza ocenę modelu wyłącznie na danych treningowych"}, "correct": "C", "why": "Po przekształceniu przestrzeni problem nieliniowy może stać się liniowo separowalny — to główna intuicja kerneli.", "lesson": {"correct": "W oryginalnej przestrzeni klasy mogą się przeplatać. Prosta linia wtedy nie wystarcza. Kernel przenosi myślenie do innej przestrzeni cech. Tam układ punktów może się „wyprostować”. Wtedy zwykła hiperpłaszczyzna potrafi rozdzielić klasy. To kluczowa moc SVM.", "example": "Na osi: A, potem B, potem znów A. Jednym progiem ich nie przetniesz. Po przekształceniu, np. funkcją kwadratową, grupy mogą ułożyć się inaczej. W nowej przestrzeni podział liniowy staje się możliwy.", "remember": "Kernel: inna przestrzeń może uczynić podział liniowym.", "wrong": {"A": "Kernel nie polega na usuwaniu połowy cech.", "B": "Accuracy i R² to metryki; kernel ich nie zamienia.", "D": "Kernel nie zmienia zasady, że model oceniamy też na teście."}}}]};
const form=document.getElementById("quiz");
const answered=document.getElementById("answered");
const results=document.getElementById("results");
let lastGrade=null;
const esc=value=>String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function render(){
form.innerHTML=QUIZ.questions.map(q=>`<article class="card" id="card-${q.n}"><div class="meta"><span class="tag">#${q.n}</span><span class="tag diff-${q.difficulty}">${q.difficulty}</span><span class="tag">${q.category}</span></div><p class="prompt">${q.n}. ${esc(q.prompt)}</p><div class="options">${["A","B","C","D"].map(letter=>`<label class="opt"><input type="radio" name="q${q.n}" value="${letter}"><span class="letter">${letter})</span><span>${esc(q.options[letter])}</span></label>`).join("")}<label class="opt idk-option"><input type="radio" name="q${q.n}" value="?"><span class="letter">?</span><span>Nie mam pojęcia — bez zgadywania, chcę się nauczyć</span></label></div><label class="confidence">Pewność:<select name="c${q.n}" aria-label="Pewność pytania ${q.n}"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><div class="feedback" id="feedback-${q.n}" hidden></div></article>`).join("");
}
function collect(){
return QUIZ.questions.map(q=>{const selected=form.querySelector(`input[name="q${q.n}"]:checked`);const confidence=form.querySelector(`select[name="c${q.n}"]`).value;return{n:q.n,answer:selected?selected.value:"",confidence:confidence||"—"};});
}
function updateProgress(){
answered.textContent=String(collect().filter(row=>row.answer).length);
}
function lessonBlocks(q,wrong){
return `<div class="lesson">${wrong?`<div class="lesson-block wrong"><h3>Twoja odpowiedź</h3><p>${esc(q.lesson.wrong[wrong])}</p></div>`:""}<div class="lesson-block"><h3>Poprawna myśl</h3><p>${esc(q.lesson.correct)}</p></div><div class="lesson-block"><h3>Przykład</h3><p>${esc(q.lesson.example)}</p></div><div class="lesson-block remember"><h3>Zapamiętaj</h3><p>${esc(q.lesson.remember)}</p></div></div>`;
}
function grade(){
const rows=collect();
const missing=rows.filter(row=>!row.answer).map(row=>row.n);
if(missing.length){alert(`Brak odpowiedzi w pytaniach: ${missing.join(", ")}`);return null}
let score=0;
let unknown=0;
const detail=rows.map(row=>{
const q=QUIZ.questions[row.n-1];
const isUnknown=row.answer==="?";
const isCorrect=row.answer===q.correct;
if(isCorrect)score+=1;
if(isUnknown)unknown+=1;
const status=isCorrect?"OK":isUnknown?"NIE WIEM":"BŁĄD";
const card=document.getElementById(`card-${q.n}`);
const feedback=document.getElementById(`feedback-${q.n}`);
card.classList.remove("ok","bad","idk");
card.classList.add(isCorrect?"ok":isUnknown?"idk":"bad");
feedback.hidden=false;
feedback.innerHTML=isCorrect?`<p class="status-ok">OK</p><p>${esc(q.why)}</p>`:isUnknown?`<p class="status-idk">NIE WIEM · Poprawna: ${q.correct}</p><p class="encourage">Bez zgadywania — oto wyjaśnienie.</p>${lessonBlocks(q,"")}`:`<p class="status-bad">BŁĄD · Twoja: ${row.answer} · Poprawna: ${q.correct}</p>${lessonBlocks(q,row.answer)}`;
return{...row,correct:q.correct,status,why:q.why,prompt:q.prompt,isCorrect,isUnknown};
});
const percentage=Math.round(score/20*100);
document.getElementById("score").textContent=`${score}/20`;
document.getElementById("percentage").textContent=`Skuteczność: ${percentage}%`;
document.getElementById("unknown").textContent=`Nie wiem: ${unknown}`;
document.getElementById("state").textContent="Sprawdzono";
results.classList.add("show");
lastGrade={score,percentage,unknown,detail};
results.scrollIntoView({behavior:"smooth",block:"start"});
return lastGrade;
}
function download(filename,content){
const url=URL.createObjectURL(new Blob([content],{type:"text/markdown;charset=utf-8"}));
const link=document.createElement("a");
link.href=url;
link.download=filename;
link.click();
URL.revokeObjectURL(url);
}
function answersMd(detail){
const rows=detail.map(row=>`| ${row.n} | ${row.answer} | ${row.confidence==="—"?"":row.confidence} |  |`).join("\n");
return `# Moje odpowiedzi – ${QUIZ.date}\n\n| # | Twoja odpowiedź (A/B/C/D/?) | Pewność (1-5) | Uwagi |\n|---|------------------------------|---------------|-------|\n${rows}\n\n## Notatki\n\n`;
}
function resultsMd(grade){
const rows=grade.detail.map(row=>`| ${row.n} | ${row.answer} | ${row.correct} | ${row.status} | ${row.confidence} | ${row.why} |`).join("\n");
const strong=grade.detail.filter(row=>row.isCorrect).map(row=>row.n);
const weak=grade.detail.filter(row=>!row.isCorrect).map(row=>`#${row.n} (${row.status})`);
const strongText=strong.length?`Pytania OK: ${strong.join(", ")}.`:"Brak trafionych pytań w tej próbie.";
const weakText=weak.length?`Do powtórki: ${weak.join(", ")}.`:"Brak pozycji do powtórki.";
return `# Wynik quizu — ${QUIZ.date}\n\n## Wynik\n\n- Wynik: ${grade.score}/20\n- Skuteczność: ${grade.percentage}%\n- Nie wiem: ${grade.unknown}\n\n## Szczegóły\n\n| # | Twoja odpowiedź | Poprawna odpowiedź | Wynik | Pewność | Komentarz |\n|---|-----------------|--------------------|-------|---------|-----------|\n${rows}\n\n## Mocne strony\n\n${strongText}\n\n## Obszary do powtórki\n\n${weakText}\n`;
}
form.addEventListener("change",updateProgress);
document.getElementById("grade").addEventListener("click",grade);
document.getElementById("reset").addEventListener("click",()=>{form.reset();results.classList.remove("show");lastGrade=null;document.getElementById("state").textContent="W trakcie";QUIZ.questions.forEach(q=>{const card=document.getElementById(`card-${q.n}`);const feedback=document.getElementById(`feedback-${q.n}`);card.classList.remove("ok","bad","idk");feedback.hidden=true;feedback.innerHTML="";});updateProgress();});
document.getElementById("download-answers").addEventListener("click",()=>{const grade=lastGrade||grade();if(!grade)return;download(`${QUIZ.date}_my_answers.md`,answersMd(grade.detail));});
document.getElementById("download-results").addEventListener("click",()=>{const grade=lastGrade||grade();if(!grade)return;download(`${QUIZ.date}_results.md`,resultsMd(grade));});
render();
updateProgress();
</script>
</body>
</html>
