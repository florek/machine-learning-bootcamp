<style>

.tag{padding:.2rem .55rem;border:1px solid var(--border);border-radius:999px;background:var(--soft);color:var(--muted);font-size:.7rem;font-weight:700;text-transform:uppercase}
.diff-łatwe{color:var(--idk);background:#e8f3fa}.diff-średnie{color:var(--mid);background:#faf0e4}.diff-trudne{color:var(--hard);background:#fce8ef}

.lesson-block p{margin:0}.lesson-block.wrong{border-color:var(--bad)}.lesson-block.remember{border-color:var(--accent);background:var(--accent-soft)}

<script>
const QUIZ={"date":"02.10.2026","questions":[{"n":1,"difficulty":"łatwe","category":"ML","prompt":"W przykładzie ze spacerem jest 5 przypadków „tak” i 4 „nie” (łącznie 9). Ile wynosi prior P(spacer = tak)?","options":{"A":"5/9","B":"4/9","C":"5/4","D":"1/2"},"correct":"A","why":"Prior to udział klasy przed cechami: 5 przypadków „tak” na 9 obserwacji, czyli 5/9.","lesson":{"correct":"Prior to prawdopodobieństwo klasy zanim spojrzymy na cechy. Liczymy je po prostu z danych: ile razy dana klasa występuje. Tu „tak” pojawia się 5 razy, a wszystkich obserwacji jest 9. Dlatego P(spacer = tak) = 5/9. Klasa „nie” ma prior 4/9. Te liczby później mnożymy przez prawdopodobieństwa cech.","example":"Wyobraź sobie 9 dni. Przez 5 dni wyszedłeś na spacer, przez 4 nie. Zanim spytasz o pogodę, model już wie: częściej wychodzisz niż zostajesz. To właśnie prior 5/9 kontra 4/9. Potem dopiero dopyta: a jaka jest pogoda i temperatura?","remember":"Prior = ile razy klasa w danych / ile wszystkich obserwacji. Tu: 5/9 dla „tak”.","wrong":{"B":"4/9 to prior klasy „nie”, nie „tak”. „Nie” pojawia się 4 razy na 9.","C":"5/4 nie ma sensu jako prawdopodobieństwo klasy — to nie jest udział w 9 obserwacjach.","D":"1/2 byłoby prawdziwe tylko przy równej liczbie „tak” i „nie”. Tu jest 5 do 4, nie po równo."}}},{"n":2,"difficulty":"łatwe","category":"ML","prompt":"Co pozwala soft margin w SVM?","options":{"A":"Zakazuje jakiegokolwiek naruszenia marginesu","B":"Usuwa wszystkie kernele poza linear","C":"Zamienia klasyfikację na regresję z metryką MAE","D":"Naruszyć margines i zaakceptować część błędnych klasyfikacji"},"correct":"D","why":"Soft margin jest elastyczny: pozwala naruszyć margines i zaakceptować część błędów, co pomaga przy outlierach.","lesson":{"correct":"Soft margin oznacza „miękki” pas wokół granicy. Model nie musi rozdzielić klas idealnie. Może pozwolić, by kilka punktów weszło w margines albo nawet po złej stronie. Dzięki temu lepiej radzi sobie z nietypowymi obserwacjami. Hard margin jest sztywny i wymaga czystego podziału.","example":"Wyobraź sobie dwa stada owiec i jedną zbłąkaną owcę daleko po drugiej stronie. Hard margin mocno przesunie ogrodzenie przez tę jedną owcę. Soft margin powie: „ta jedna może zostać po złej stronie — ogrodzenie zostaje szerokie i sensowne”.","remember":"Soft = miękki = wolno trochę zbłądzić. Hard = twardy = zero błędów.","wrong":{"A":"To opis hard margin, nie soft. Hard zakazuje naruszeń marginesu.","B":"Soft margin nie usuwa kerneli. Kernel i margines to osobne sprawy.","C":"SVM soft margin nadal dotyczy klasyfikacji (i marginesu), a nie zamiany na MAE w regresji."}}},{"n":3,"difficulty":"łatwe","category":"ML","prompt":"Jaką klasę scikit-learn używamy do Gaussian Naive Bayes?","options":{"A":"SVC","B":"GaussianNB","C":"DecisionTreeClassifier","D":"RandomForestClassifier"},"correct":"B","why":"Do Gaussian Naive Bayes w scikit-learn służy klasa GaussianNB z modułu naive_bayes.","lesson":{"correct":"Gaussian Naive Bayes to wariant naiwnego Bayesa dla cech ciągłych. Zakłada rozkład normalny cechy w obrębie klasy. W scikit-learn tworzymy model klasą GaussianNB, potem fit i predict. SVC to SVM, a drzewo i las to zupełnie inne modele.","example":"Piszesz: from sklearn.naive_bayes import GaussianNB, potem model = GaussianNB(), model.fit(X_train, y_train) i model.predict(X_test). To cały typowy workflow z notatek.","remember":"Gauss w nazwie = GaussianNB w kodzie.","wrong":{"A":"SVC to Support Vector Classifier — maszyna wektorów nośnych, nie Bayes.","C":"DecisionTreeClassifier to drzewo decyzyjne, nie naiwny Bayes.","D":"RandomForestClassifier to las losowy (ensemble drzew), nie GaussianNB."}}},{"n":4,"difficulty":"średnie","category":"ML","prompt":"Jak poprawnie użyć StandardScaler przed trenowaniem modelu wrażliwego na skalę cech (np. SVM)?","options":{"A":"fit i transform tylko na zbiorze testowym","B":"fit osobno na train i osobno na test","C":"fit tylko na train, potem transform na train i na test","D":"transform na train, a fit na test"},"correct":"C","why":"Scaler uczymy wyłącznie na train; test tylko transformujemy tym samym scalerem, żeby uniknąć data leakage.","lesson":{"correct":"StandardScaler liczy średnią i odchylenie. Te liczby wolno poznać tylko ze zbioru treningowego. Potem tym samym „linijką” mierzymy train i test. Gdybyśmy fitowali też na teście, model podglądałby przyszłość — to wyciek informacji (data leakage).","example":"Train ma temperatury 10, 20, 30. Scaler uczy się średniej 20. Test ma 40 — tylko transformujemy względem 20, nie przeliczamy średniej od nowa z 40 w środku. Dzięki temu test nie „pomaga” w ustawieniu skali.","remember":"Fit tylko train. Test tylko transform. Nigdy fit na teście.","wrong":{"A":"Fit wyłącznie na teście to podglądanie danych testowych i brak poprawnego skalowania train.","B":"Osobny fit na teście zmienia skalę inaczej niż na train — to leakage i niespójność.","D":"Transform przed fit na train nie ma sensu; fit należy do train, nie do test."}}},{"n":5,"difficulty":"łatwe","category":"ML","prompt":"W przykładzie ze spacerem słonecznie + „tak” występuje 3 razy (przy 5 „tak”). Ile wynosi P(słonecznie | spacer = tak)?","options":{"A":"3/5","B":"3/9","C":"1/4","D":"5/3"},"correct":"A","why":"Likelihood cechuje się względnie do klasy: wśród 5 dni „tak” słonecznie było 3 razy, więc 3/5.","lesson":{"correct":"P(słonecznie | tak) to nie udział wśród wszystkich dni, tylko wśród dni z klasą „tak”. Patrzysz tylko na te 5 obserwacji „tak” i liczysz, ile z nich miało słoneczną pogodę. Było 3, więc 3/5. To likelihood cechy przy danej klasie.","example":"Masz 5 dni spaceru: słońce, słońce, deszcz, słońce, chmury. Słońce pada 3 razy na 5 spacerów. Model mówi: gdy wychodzisz, dość często jest słonecznie (3/5).","remember":"Warunek „| tak” znaczy: patrz tylko na wiersze z klasą tak.","wrong":{"B":"3/9 dzieliłoby przez wszystkie obserwacje, a nie przez liczbę „tak”. To nie jest P(słonecznie|tak).","C":"1/4 to P(słonecznie | nie) w przykładzie, nie dla klasy „tak”.","D":"5/3 > 1 — nie jest poprawnym prawdopodobieństwem w tym liczeniu częstości."}}},{"n":6,"difficulty":"średnie","category":"ML","prompt":"Co zwykle dzieje się przy mniejszym parametrze C w SVM (soft margin)?","options":{"A":"Margines staje się węższy, a tolerancja błędów mniejsza","B":"Kernel automatycznie zmienia się na poly degree=3","C":"Margines staje się szerszy, a tolerancja błędów większa","D":"Model przestaje używać support vectors"},"correct":"C","why":"Mniejsze C → szerszy margines i większa tolerancja na błędy; większe C → węższy margines i mniejsza tolerancja.","lesson":{"correct":"Parametr C mówi, jak mocno karać błędy. Małe C = „błędy mniej bolą” = model woli szeroki, spokojny margines. Duże C = „każdy błąd jest drogi” = margines się zaciska, by mniej mylić. To kompromis między szerokością pasa a dopasowaniem do treningu.","example":"C jak „czujność nauczyciela”. Przy małym C nauczyciel odpuszcza kilka pomyłek i rysuje szeroką linię. Przy dużym C goni każdą pomyłkę i linia staje się ciasna.","remember":"Małe C = szeroki margines + więcej wybaczenia. Duże C = wąski + ostrzejsza kara.","wrong":{"A":"To opis większego C, nie mniejszego.","B":"C nie przełącza kernela na poly — kernel ustawiasz osobno.","D":"Support vectors nadal istnieją; C zmienia kompromis margines/błędy, nie kasuje wektorów nośnych."}}},{"n":7,"difficulty":"średnie","category":"ML","prompt":"Dlaczego przy samym wyborze klasy w Naive Bayes często można pominąć wspólny mianownik P(słonecznie, ciepło)?","options":{"A":"Bo Naive Bayes nie używa żadnych prawdopodobieństw","B":"Bo prior każdej klasy jest zawsze równy jeden","C":"Bo ten mianownik zawsze wynosi dokładnie zero","D":"Bo dla tej samej próbki mianownik jest taki sam dla każdej klasy"},"correct":"D","why":"Przy porównaniu klas dla tej samej próbki mianownik jest wspólny, więc wystarczy porównać liczniki.","lesson":{"correct":"Wzór Bayesa ma licznik i mianownik. Mianownik P(cechy) nie zależy od klasy, którą akurat sprawdzamy. Dla „tak” i „nie” dzielisz przez tę samą liczbę. Przy samym „która klasa wygrywa?” wystarczy porównać liczniki. Mianownik potrzebujesz dopiero, gdy chcesz prawdziwe procenty po normalizacji.","example":"Masz dwa wyniki: 0,2667 i 0,0278. Oba dzielone przez to samo P(słonecznie, ciepło). Które większe? To widać już przed dzieleniem. Jak 12 > 3 przed dzieleniem przez 4, tak samo 12/4 > 3/4.","remember":"Wspólny mianownik nie zmienia kolejności — do wyboru klasy wystarczą liczniki.","wrong":{"A":"Naive Bayes właśnie liczy z prawdopodobieństw — priorów i likelihoodów.","B":"Priory nie są równe jeden; w przykładzie to 5/9 i 4/9.","C":"Mianownik nie jest zerem — to prawdopodobieństwo obserwowanych cech."}}},{"n":8,"difficulty":"łatwe","category":"ML","prompt":"Czym są support vectors w SVM?","options":{"A":"Wszystkimi punktami leżącymi najdalej od granicy","B":"Próbkami położonymi najbliżej granicy decyzyjnej (na krańcach marginesu)","C":"Parametrem C ustawionym na zero","D":"Wyłącznie średnimi wartościami cech w każdej klasie"},"correct":"B","why":"Support vectors to próbki najbliżej granicy decyzyjnej — one w największym stopniu wyznaczają jej położenie.","lesson":{"correct":"Nazwa SVM pochodzi od wektorów nośnych. To punkty „podpierające” pas marginesu. Leżą najbliżej granicy. Jeśli je przesuniesz, granica zwykle się ruszy. Dalekie punkty mają mniejszy wpływ na samą linię podziału.","example":"Dwa miasta po dwóch stronach rzeki. Most (granica) opiera się na najbliższych domach przy brzegu. Dom daleko w głębi lądu nie przesuwa mostu. Te pobliskie domy to support vectors.","remember":"Support vectors = punkty najbliżej granicy, nie najdalej.","wrong":{"A":"Najdalsze punkty zwykle nie wyznaczają marginesu — liczą się najbliższe.","C":"C to hiperparametr kary, nie nazwa wektorów nośnych.","D":"Średnie klas to nie definicja support vectors."}}},{"n":9,"difficulty":"średnie","category":"ML","prompt":"Ile wynosi w przybliżeniu wynik licznika dla klasy „tak” przy 3/5 * 4/5 * 5/9 w przykładzie ze spacerem?","options":{"A":"ok. 0,0278","B":"dokładnie 1","C":"ok. 0,2667","D":"ok. 0,905"},"correct":"C","why":"Iloczyn 3/5 * 4/5 * 5/9 = 12/45 ≈ 0,2667 to wynik licznika dla klasy „tak” przed normalizacją.","lesson":{"correct":"Dla klasy „tak” mnożymy: P(słonecznie|tak) * P(ciepło|tak) * P(tak). To 3/5 * 4/5 * 5/9. Licząc: 3/5*4/5=12/25, potem *5/9 = 12/45 ≈ 0,2667. To jeszcze nie procent końcowy — dopiero porównanie z „nie” i ewentualna normalizacja dadzą ostateczny udział.","example":"Najpierw 0,6 * 0,8 = 0,48, potem 0,48 * (ok. 0,556) ≈ 0,267. Klasa „nie” dostaje dużo mniej (ok. 0,0278). Już widać zwycięzcę.","remember":"3/5 * 4/5 * 5/9 ≈ 0,2667 — licznik dla „tak”.","wrong":{"A":"0,0278 to wynik licznika dla „nie” (1/4 * 1/4 * 4/9), nie dla „tak”.","B":"Iloczyn nie wynosi 1 — to nie są jeszcze znormalizowane prawdopodobieństwa klas.","D":"0,905 pojawia się dopiero po normalizacji (0,2667 / 0,2945), nie jako surowy iloczyn."}}},{"n":10,"difficulty":"trudne","category":"ML","prompt":"Jaka jest główna intuicja działania kernela w SVM przy problemie nieliniowym?","options":{"A":"Po przekształceniu przestrzeni dane mogą stać się liniowo separowalne (np. intuicja R² → R³)","B":"Kernel zamienia SVM w regresję liniową bez marginesu","C":"Kernel zawsze usuwa połowę cech wejściowych","D":"Kernel wymusza hard margin i zakazuje soft margin"},"correct":"A","why":"Kernel pozwala myśleć o transformacji przestrzeni: problem nieliniowy może stać się liniowo separowalny w nowej przestrzeni.","lesson":{"correct":"Czasem w 2D nie da się narysować prostej między klasami. Kernel to sprytna sztuczka: patrzymy na dane „jakby” były w bogatszej przestrzeni. Tam podział liniowy bywa możliwy. Intuicja R² → R³ pokazuje, że po uniesieniu punktów płaszczyzna może je rozdzielić.","example":"Na osi masz ● ○ ○ ● — jednym progiem nie rozdzielisz. Po podniesieniu do kwadratu „skrajne” punkty wznoszą się inaczej i nagle da się je odciąć linią w nowej przestrzeni. O to mniej więcej chodzi w intuicji jądra.","remember":"Kernel: trudne w starej mapie → łatwiejsze po „przemapowaniu” przestrzeni.","wrong":{"B":"Kernel nie kasuje idei marginesu ani nie zamienia automatycznie SVM w zwykłą regresję bez marginesu.","C":"Kernel nie polega na usuwaniu połowy cech.","D":"Kernel nie wymusza hard margin; hard/soft dotyczy tolerancji błędów (C), nie samego jądra."}}},{"n":11,"difficulty":"średnie","category":"ML","prompt":"Przy wynikach liczników ok. 0,2667 („tak”) i ok. 0,0278 („nie”) jaką decyzję podejmuje model dla „słonecznie + ciepło”?","options":{"A":"zawsze wybiera klasę losowo","B":"model odmawia decyzji, bo mianownik nie został policzony","C":"spacer = nie, bo prior „nie” jest większy","D":"spacer = tak, bo 0,2667 > 0,0278"},"correct":"D","why":"Model wybiera klasę z większym wynikiem licznika: 0,2667 > 0,0278, więc spacer = tak.","lesson":{"correct":"Naive Bayes porównuje wyniki dla klas i bierze maksimum. Tu „tak” ma wyraźnie wyższy iloczyn niż „nie”. Nie trzeba jeszcze znać mianownika, by wskazać zwycięzcę. Decyzja: wychodzimy na spacer.","example":"To jak dwa wyniki konkursu: 27 punktów kontra 3. Zwycięzca jest jasny zanim przeliczysz procenty udziału w sumie. Potem możesz powiedzieć „ok. 90% vs 10%”, ale kierunek decyzji już znasz.","remember":"Większy licznik wygrywa. Tu wygrywa „tak”.","wrong":{"A":"Model nie losuje — wybiera klasę o największym wyniku.","B":"Brak mianownika nie blokuje wyboru klasy — właśnie dlatego często go pomijamy przy porównaniu.","C":"Prior „nie” (4/9) jest mniejszy niż prior „tak” (5/9), a decyzja i tak wynika z pełnego iloczynu, nie z samego prioru „nie”."}}},{"n":12,"difficulty":"średnie","category":"ML","prompt":"Co wyraża atrybut feature_importances_ w Random Forest?","options":{"A":"Liczbę klas w zbiorze Iris","B":"Względną ważność cech; większa wartość zwykle oznacza większe znaczenie","C":"Wartość parametru C w SVM","D":"Absolutną gwarancję, że cecha zawsze daje accuracy 100%"},"correct":"B","why":"feature_importances_ pokazuje względną ważność cech w lesie — wyższa wartość zwykle oznacza większy wpływ na decyzje.","lesson":{"correct":"Las składa się z wielu drzew. Cechy, które często i skutecznie dzielą węzły, dostają wyższą ważność. feature_importances_ to właśnie ten ranking. To wskazówka „co model uznał za istotne”, nie magiczna gwarancja idealnej dokładności.","example":"Przy kwiatach „długość płatka” może mieć dużą ważność, a „numer wiersza” prawie zero. Model mówi: patrz na płatek, nie na numer w tabeli.","remember":"Wyższa feature_importance_ ≈ cecha bardziej pomaga w podziałach lasu.","wrong":{"A":"Liczba klas to właściwość zadania, nie wynik feature_importances_.","C":"C należy do SVM, nie do opisu feature_importances_ w Random Forest.","D":"Ważność cechy nie gwarantuje accuracy 100%."}}},{"n":13,"difficulty":"trudne","category":"ML","prompt":"Po normalizacji wyników 0,2667 i 0,0278 (suma ≈ 0,2945) ile wynosi w przybliżeniu P(tak | słonecznie, ciepło)?","options":{"A":"ok. 90,5%","B":"ok. 2,78%","C":"ok. 50%","D":"ok. 26,67%"},"correct":"A","why":"Normalizacja: 0,2667 / 0,2945 ≈ 0,905, czyli około 90,5% dla klasy „tak”.","lesson":{"correct":"Surowy iloczyn to nie jeszcze „procent pewności” sumujący się do 100%. Dzielimy wynik klasy przez sumę wyników wszystkich klas. 0,2667 / (0,2667+0,0278) ≈ 0,905. Dla „nie” zostaje ok. 9,5%. To właśnie normalizacja z przykładu.","example":"Masz 27 żetonów „tak” i 3 żetony „nie”. Razem 30. Udział „tak” to 27/30 = 90%. Tu zamiast żetonów są 0,2667 i 0,0278 — ta sama idea.","remember":"Po normalizacji: ok. 90,5% tak, ok. 9,5% nie.","wrong":{"B":"2,78% to rząd wielkości surowego wyniku „nie” (0,0278), nie znormalizowanego P(tak|…).","C":"50% byłoby przy remisie; tu „tak” wyraźnie wygrywa.","D":"26,67% to surowy licznik 0,2667 potraktowany jak procent — bez dzielenia przez sumę."}}},{"n":14,"difficulty":"łatwe","category":"ML","prompt":"Co oznacza Gini = 0 w węźle drzewa klasyfikacyjnego?","options":{"A":"Klasy są wymieszane po równo","B":"Entropia jest maksymalna","C":"Węzeł jest czysty i zawiera obserwacje jednej klasy","D":"Drzewo nie może mieć więcej niż jeden liść"},"correct":"C","why":"Gini = 0 oznacza węzeł czysty — wszystkie obserwacje należą do jednej klasy.","lesson":{"correct":"Wskaźnik Gini mierzy „zanieczyszczenie” węzła. Zero znaczy: zero mieszanki klas. Wszystkie próbki w węźle mają tę samą etykietę. To sytuacja idealnie czysta. Gdy klasy są wymieszane, Gini rośnie.","example":"W worku same czerwone kulki — Gini 0. Pół na pół czerwone i niebieskie — Gini wyższe. Drzewo lubi podziały, które prowadzą do czystych worków.","remember":"Gini 0 = czysty węzeł (jedna klasa).","wrong":{"A":"Równe wymieszanie to wysokie zanieczyszczenie, nie Gini = 0.","B":"Maksymalna entropia też opisuje duży chaos klas, nie czystość.","D":"Gini = 0 nie ogranicza liczby liści całego drzewa."}}},{"n":15,"difficulty":"trudne","category":"ML","prompt":"Gdzie w przykładzie ze spacerem widać „naiwność” Naive Bayes?","options":{"A":"W tym, że mianownik musi być inny dla każdej klasy","B":"W założeniu, że po ustaleniu klasy cechy (pogoda i temperatura) są niezależne, więc wspólne P rozpisujemy jako iloczyn","C":"W tym, że model nigdy nie liczy priorów","D":"W tym, że model wymaga zawsze kernela RBF"},"correct":"B","why":"Naiwność to założenie warunkowej niezależności cech: P(słonecznie, ciepło | klasa) ≈ P(słonecznie|klasa) * P(ciepło|klasa).","lesson":{"correct":"„Naiwny” znaczy: zakładamy, że cechy nie zależą od siebie, gdy znamy klasę. Pogoda i temperatura są traktowane osobno i mnożone. W życiu mogą być powiązane, ale model i tak używa tego uproszczenia. Dzięki temu obliczenia są proste i szybkie.","example":"Zamiast jednej skomplikowanej tabeli „słońce i ciepło naraz przy tak”, model mówi: policz osobno szansę słońca przy tak oraz ciepło przy tak, potem pomnóż. To skrót myślowy — stąd „naiwność”.","remember":"Naiwność = cechom „każda sobie” (iloczyn), mimo że w rzeczywistości bywają zależne.","wrong":{"A":"Mianownik dla tej samej próbki jest wspólny, nie inny per klasa.","C":"Model właśnie liczy priory — w przykładzie 5/9 i 4/9.","D":"Kernel RBF należy do SVM, nie do definicji naiwności Bayesa."}}},{"n":16,"difficulty":"średnie","category":"ML","prompt":"Jaki jest domyślny kernel w klasie SVC w scikit-learn?","options":{"A":"Brak kernela — SVC nie używa jąder","B":"linear","C":"poly","D":"rbf"},"correct":"D","why":"Domyślnym kernelem w SVC jest rbf.","lesson":{"correct":"Gdy tworzysz SVC() bez argumentów, scikit-learn bierze kernel RBF. RBF umie rysować bardziej kręte, nieliniowe granice. Kernel linear musisz podać wprost, jeśli chcesz prostą granicę. Poly też ustawiasz ręcznie.","example":"Piszesz model = SVC() — dostajesz RBF. Piszesz SVC(kernel=\"linear\") — dostajesz linię. Domyślnie wygrywa RBF.","remember":"SVC bez ustawień → kernel rbf.","wrong":{"A":"SVC właśnie opiera się na kernelach; domyślnie na rbf.","B":"Linear jest dostępny, ale nie jest domyślny — trzeba go wskazać.","C":"Poly też nie jest domyślny."}}},{"n":17,"difficulty":"trudne","category":"ML","prompt":"Dlaczego dla cech ciągłych (np. temperatura 21,7°C) zwykłe zliczanie kategorii jak „ciepło/zimno” nie wystarcza i pojawia się Gaussian Naive Bayes?","options":{"A":"Bo cechy ciągłe zawsze trzeba zamienić na kernel poly","B":"Bo Naive Bayes działa wyłącznie na dwóch klasach i dwóch cechach","C":"Bo dla wartości ciągłych potrzebujemy założenia o rozkładzie cechy w klasie; Gaussian NB zakłada rozkład normalny","D":"Bo accuracy na cechach ciągłych zawsze wynosi dokładnie 0%"},"correct":"C","why":"Przy cechach ciągłych potrzeba założenia o rozkładzie P(Xi|Y); Gaussian Naive Bayes zakłada rozkład normalny w obrębie klasy.","lesson":{"correct":"Gdy cecha to kategoria („słońce/deszcz”), liczymy częstości. Gdy cecha to liczba rzeczywista (21,7°C), nie ma gotowej „przegródki” do zliczenia. Trzeba powiedzieć, jak wartości układają się w klasie. Gaussian NB zakłada dzwon Gaussa (rozkład normalny) osobno dla każdej klasy.","example":"Dla „zdrowy” temperatura ciała skupia się wokół 36,6. Dla „chory” wokół wyższej średniej. Dostajesz nowy pomiar 38,1 i pytasz: w którym dzwonie jest bardziej prawdopodobny? Tak działa intuicja Gaussian NB.","remember":"Ciągłe cechy → potrzebny rozkład; Gaussian = dzwon normalny w klasie.","wrong":{"A":"Kernel poly to temat SVM, nie wymóg ciągłych cech w Bayesie.","B":"Naive Bayes nie jest ograniczony do dokładnie 2 klas i 2 cech.","D":"Nie ma reguły, że accuracy na cechach ciągłych wynosi 0%."}}},{"n":18,"difficulty":"trudne","category":"ML","prompt":"Dlaczego na małym zbiorze (np. Iris) accuracy na teście bywa czasem wyższe niż na treningu?","options":{"A":"Bo przy małej liczbie próbek konkretny losowy podział może wrzucić trudniejsze próbki do train, a łatwiejsze do test","B":"Bo score() zawsze odwraca train i test","C":"Bo kernel linear gwarantuje overfitting ujemny","D":"Bo StandardScaler celowo psuje dane treningowe"},"correct":"A","why":"Przy małym zbiorze wynik mocno zależy od podziału: trudniejsze próbki w train i łatwiejsze w test mogą dać wyższe accuracy na teście.","lesson":{"correct":"Na dużych danych train zwykle wygrywa z testem. Na 150 próbkach Iris jeden pechowy podział wszystko zmienia. Kilka trudnych punktów w train obniża wynik treningu, a łatwy test wygląda świetnie. To nie magia modelu — to mała próbka i losowość podziału.","example":"Masz 10 pytań na kartkówce. Jeśli w „treningu” trafią najtrudniejsze, a na „teście” najłatwiejsze, wynik testu może być wyższy. Przy małej liczbie pytań taki przypadek zdarza się łatwo.","remember":"Mały zbiór + pechowy split → test czasem > train; interpretuj ostrożnie.","wrong":{"B":"score() nie odwraca zbiorów — liczy wynik na tym, co podasz.","C":"Nie ma „ujemnego overfittingu” wymuszanego przez kernel linear.","D":"Scaler nie psuje celowo train; ma ujednolicić skalę cech."}}},{"n":19,"difficulty":"średnie","category":"ML","prompt":"Jakie założenie o P(Xi | Y) przyjmuje Gaussian Naive Bayes?","options":{"A":"Że cechy w klasie mają wyłącznie wartości 0 i 1","B":"Że wartości cechy w obrębie klasy mają rozkład normalny (Gaussa)","C":"Że P(Xi | Y) jest zawsze równe priorowi P(Y)","D":"Że wszystkie cechy są niezależne od klasy Y"},"correct":"B","why":"Gaussian Naive Bayes zakłada, że wartości cechy w obrębie klasy pochodzą z rozkładu normalnego.","lesson":{"correct":"Słowo Gaussian = Gauss = dzwon normalny. W każdej klasie cecha ma swoją średnią i „rozrzut”. Model pyta: jak bardzo ta liczba pasuje do dzwonu klasy A, a jak do dzwonu klasy B? To właśnie założenie o P(Xi|Y). Inne odmiany Bayesa biorą inne rozkłady.","example":"Wzrost w klasie „dorosły” może być dzwonem wokół 175 cm. W klasie „dziecko” wokół 120 cm. Nowy wzrost 170 cm bardziej pasuje do dorosłych — większe P(wzrost|dorosły).","remember":"Gaussian NB: w klasie cecha ~ rozkład normalny.","wrong":{"A":"To raczej świat cech binarnych, nie definicja wariantu Gaussa.","C":"Likelihood nie jest z definicji równy priorowi.","D":"Cechy zależą od klasy — właśnie liczymy P(Xi|Y). Niezależność dotyczy cech między sobą (przy klasie)."}}},{"n":20,"difficulty":"trudne","category":"ML","prompt":"Kiedy hard margin w SVM działa najlepiej?","options":{"A":"Gdy zawsze używamy wyłącznie kernela poly degree=3","B":"Gdy dane są mocno zaszumione i pełne outlierów","C":"Gdy problem jest regresją z metryką MAE","D":"Gdy dane są dobrze rozdzielone, bez istotnych outlierów i liniowo separowalne"},"correct":"D","why":"Hard margin wymaga czystego podziału: najlepiej przy danych dobrze rozdzielonych, bez istotnych outlierów i liniowo separowalnych.","lesson":{"correct":"Hard margin nie wybacza błędów. Margines ma być czysty. To działa, gdy klasy da się ładnie rozdzielić i nie ma „zbłąkanych” punktów psujących pas. Przy szumie i outlierach lepszy bywa soft margin, który odpuszcza część naruszeń.","example":"Dwa klastry punktów z wyraźną luką pośrodku — hard margin rysuje szeroki, czysty korytarz. Dodaj jeden punkt daleko w obcym klastrze — hard margin wariuje; soft margin zostaje spokojniejszy.","remember":"Hard margin lubi czyste, liniowo separowalne dane bez outlierów.","wrong":{"A":"Hard margin nie wymaga poly degree=3; to osobna decyzja o kernelu.","B":"Przy szumie i outlierach hard margin zwykle cierpi — wtedy soft jest bezpieczniejszy.","C":"Hard margin to koncepcja klasyfikacji SVM, nie przepis na MAE w regresji."}}}]};
const form=document.getElementById("quiz");
const answered=document.getElementById("answered");
const results=document.getElementById("results");
let lastGrade=null;
const esc=value=>String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function render(){
form.innerHTML=QUIZ.questions.map(q=>`<article class="card" id="card-${q.n}"><div class="meta"><span class="tag">#${q.n}</span><span class="tag diff-${q.difficulty}">${q.difficulty}</span><span class="tag">${q.category}</span></div><p class="prompt">${q.n}. ${esc(q.prompt)}</p><div class="options">${["A","B","C","D"].map(letter=>`<label class="opt"><input type="radio" name="q${q.n}" value="${letter}"><span class="letter">${letter})</span><span>${esc(q.options[letter])}</span></label>`).join("")}<label class="opt idk-option"><input type="radio" name="q${q.n}" value="?"><span class="letter">?</span><span>Nie mam pojęcia — bez zgadywania, chcę się nauczyć</span></label></div><label class="confidence">Pewność:<select name="c${q.n}" aria-label="Pewność pytania ${q.n}"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><div class="feedback" id="feedback-${q.n}" hidden></div></article>`).join("");
}
function collect(){
return QUIZ.questions.map(q=>{const selected=form.querySelector(`input[name="q${q.n}"]:checked`);const confidence=form.querySelector(`select[name="c${q.n}"]`).value;return{n:q.n,answer:selected?selected.value:"",confidence:confidence||"—"};});
}
function updateProgress(){
answered.textContent=String(collect().filter(row=>row.answer).length);
}
function lessonBlocks(q,wrong){
return `<div class="lesson">${wrong?`<div class="lesson-block wrong"><h3>Twoja odpowiedź</h3><p>${esc(q.lesson.wrong[wrong])}</p></div>`:""}<div class="lesson-block"><h3>Poprawna myśl</h3><p>${esc(q.lesson.correct)}</p></div><div class="lesson-block"><h3>Przykład</h3><p>${esc(q.lesson.example)}</p></div><div class="lesson-block remember"><h3>Zapamiętaj</h3><p>${esc(q.lesson.remember)}</p></div></div>`;
}
function grade(){
const rows=collect();
const missing=rows.filter(row=>!row.answer).map(row=>row.n);
if(missing.length){alert(`Brak odpowiedzi w pytaniach: ${missing.join(", ")}`);return null}
let score=0;
let unknown=0;
const detail=rows.map(row=>{
const q=QUIZ.questions[row.n-1];
const isUnknown=row.answer==="?";
const isCorrect=row.answer===q.correct;
if(isCorrect)score+=1;
if(isUnknown)unknown+=1;
const status=isCorrect?"OK":isUnknown?"NIE WIEM":"BŁĄD";
const card=document.getElementById(`card-${q.n}`);
const feedback=document.getElementById(`feedback-${q.n}`);
card.classList.remove("ok","bad","idk");
card.classList.add(isCorrect?"ok":isUnknown?"idk":"bad");
feedback.hidden=false;
feedback.innerHTML=isCorrect?`<p class="status-ok">OK</p><p>${esc(q.why)}</p>`:isUnknown?`<p class="status-idk">NIE WIEM · Poprawna: ${q.correct}</p><p class="encourage">Bez zgadywania — oto wyjaśnienie.</p>${lessonBlocks(q,"")}`:`<p class="status-bad">BŁĄD · Twoja: ${row.answer} · Poprawna: ${q.correct}</p>${lessonBlocks(q,row.answer)}`;
return{...row,correct:q.correct,status,why:q.why,prompt:q.prompt,isCorrect,isUnknown};
});
const percentage=Math.round(score/20*100);
document.getElementById("score").textContent=`${score}/20`;
document.getElementById("percentage").textContent=`Skuteczność: ${percentage}%`;
document.getElementById("unknown").textContent=`Nie wiem: ${unknown}`;
document.getElementById("state").textContent="Sprawdzono";
results.classList.add("show");
lastGrade={score,percentage,unknown,detail};
results.scrollIntoView({behavior:"smooth",block:"start"});
return lastGrade;
}
function download(filename,content){
const url=URL.createObjectURL(new Blob([content],{type:"text/markdown;charset=utf-8"}));
const link=document.createElement("a");
link.href=url;
link.download=filename;
link.click();
URL.revokeObjectURL(url);
}
function answersMd(detail){
const rows=detail.map(row=>`| ${row.n} | ${row.answer} | ${row.confidence==="—"?"":row.confidence} |  |`).join("\n");
return `# Moje odpowiedzi – ${QUIZ.date}\n\n| # | Twoja odpowiedź (A/B/C/D/?) | Pewność (1-5) | Uwagi |\n|---|------------------------------|---------------|-------|\n${rows}\n\n## Notatki\n\n`;
}
function resultsMd(grade){
const rows=grade.detail.map(row=>`| ${row.n} | ${row.answer} | ${row.correct} | ${row.status} | ${row.confidence} | ${row.why} |`).join("\n");
const strong=grade.detail.filter(row=>row.isCorrect).map(row=>row.n);
const weak=grade.detail.filter(row=>!row.isCorrect).map(row=>`#${row.n} (${row.status})`);
const strongText=strong.length?`Pytania OK: ${strong.join(", ")}.`:"Brak trafionych pytań w tej próbie.";
const weakText=weak.length?`Do powtórki: ${weak.join(", ")}.`:"Brak pozycji do powtórki.";
return `# Wynik quizu — ${QUIZ.date}\n\n## Wynik\n\n- Wynik: ${grade.score}/20\n- Skuteczność: ${grade.percentage}%\n- Nie wiem: ${grade.unknown}\n\n## Szczegóły\n\n| # | Twoja odpowiedź | Poprawna odpowiedź | Wynik | Pewność | Komentarz |\n|---|-----------------|--------------------|-------|---------|-----------|\n${rows}\n\n## Mocne strony\n\n${strongText}\n\n## Obszary do powtórki\n\n${weakText}\n`;
}
form.addEventListener("change",updateProgress);
document.getElementById("grade").addEventListener("click",grade);
document.getElementById("reset").addEventListener("click",()=>{form.reset();results.classList.remove("show");lastGrade=null;document.getElementById("state").textContent="W trakcie";QUIZ.questions.forEach(q=>{const card=document.getElementById(`card-${q.n}`);const feedback=document.getElementById(`feedback-${q.n}`);card.classList.remove("ok","bad","idk");feedback.hidden=true;feedback.innerHTML="";});updateProgress();});
document.getElementById("download-answers").addEventListener("click",()=>{const grade=lastGrade||grade();if(!grade)return;download(`${QUIZ.date}_my_answers.md`,answersMd(grade.detail));});
document.getElementById("download-results").addEventListener("click",()=>{const grade=lastGrade||grade();if(!grade)return;download(`${QUIZ.date}_results.md`,resultsMd(grade));});
render();
updateProgress();
</script>
</body>
</html>
