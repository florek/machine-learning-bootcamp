<script>
const QUIZ={"date": "28.09.2026", "questions": [{"n": 1, "difficulty": "łatwe", "category": "ML", "prompt": "Czego przede wszystkim szuka SVM przy budowie granicy decyzyjnej?", "options": {"A": "Najwęższej możliwej linii między klasami", "B": "Granicy z możliwie najszerszym marginesem między klasami", "C": "Średniej wartości wszystkich cech wejściowych", "D": "Jednego drzewa decyzyjnego o maksymalnej głębokości"}, "correct": "B", "why": "SVM szuka granicy decyzyjnej z możliwie najszerszym marginesem między klasami.", "lesson": {"correct": "SVM oznacza maszynę wektorów nośnych. Model nie rysuje byle jakiej linii między klasami. Szuka takiej granicy, przy której pas między klasami jest jak najszerszy. Ten pas nazywamy marginesem. Szeroki margines zwykle lepiej oddziela klasy na nowych danych.", "example": "Wyobraź sobie psy i koty na kartce. Możesz narysować wiele linii między nimi. Jedna linia prawie dotyka obu grup. Inna zostawia szeroki wolny pas. SVM wybiera tę z szerokim pasem. Dzięki temu nowy punkt ma więcej miejsca, zanim wpadnie na złą stronę.", "remember": "SVM chce najszerszy możliwy margines między klasami.", "wrong": {"A": "Najwęższa linia to przeciwieństwo celu SVM. Model maksymalizuje szerokość marginesu, a nie ją minimalizuje.", "C": "Średnia cech to operacja statystyczna, nie cel SVM. SVM wyznacza granicę z maksymalnym marginesem.", "D": "Pojedyncze głębokie drzewo należy do innej rodziny modeli. SVM buduje granicę z marginesem, nie drzewo."}}}, {"n": 2, "difficulty": "łatwe", "category": "ML", "prompt": "Czym są support vectors (wektory nośne) w SVM?", "options": {"A": "Wszystkimi punktami leżącymi najdalej od granicy", "B": "Losowo wybranymi punktami bez wpływu na model", "C": "Próbkami położonymi najbliżej granicy decyzyjnej, które w największym stopniu ją wyznaczają", "D": "Współczynnikami regresji liniowej modelu"}, "correct": "C", "why": "Support vectors to próbki najbliżej granicy; one w największym stopniu wyznaczają jej położenie.", "lesson": {"correct": "Na krańcach marginesu leżą punkty najbliżej granicy. Nazywamy je wektorami nośnymi. To właśnie one mocno wpływają na położenie granicy. Odległe punkty mają zwykle mniejszy wpływ. Nazwa SVM pochodzi właśnie od tych punktów.", "example": "Masz dwie grupy punktów. Trzy punkty z jednej grupy i dwa z drugiej stoją tuż przy pasie między klasami. Reszta leży daleko. SVM opiera granicę głównie na tych bliskich punktach. One są support vectors.", "remember": "Support vectors to punkty najbliżej granicy.", "wrong": {"A": "Punkty najdalej od granicy nie są wektorami nośnymi. Liczą się próbki najbliższe granicy.", "B": "Support vectors nie są losowe i bez znaczenia. To one w największym stopniu wyznaczają granicę.", "D": "Współczynniki regresji liniowej to inna koncepcja. Support vectors to konkretne próbki treningowe."}}}, {"n": 3, "difficulty": "łatwe", "category": "ML", "prompt": "Co zakłada podejście hard margin w SVM?", "options": {"A": "Dane muszą być rozdzielone bez błędów klasyfikacji i bez naruszenia marginesu", "B": "Model zawsze akceptuje dowolną liczbę błędów", "C": "Każdy punkt musi leżeć dokładnie na granicy decyzyjnej", "D": "Kernel musi być zawsze wielomianowy"}, "correct": "A", "why": "Hard margin wymaga rozdzielenia klas bez błędów i bez naruszenia marginesu.", "lesson": {"correct": "Hard margin to twarde podejście. Model nie pozwala na błędy klasyfikacji. Nie pozwala też naruszać marginesu. Działa najlepiej, gdy klasy są czysto rozdzielone. Przy outlierach bywa zbyt sztywne.", "example": "Wyobraź sobie dwie grupy punktów idealnie oddzielone pustym pasem. Hard margin rysuje granicę i wymaga, by nikt nie wszedł w ten pas. Jeśli pojawi się jeden punkt po złej stronie, twarde założenie się psuje. Wtedy soft margin jest rozsądniejszy.", "remember": "Hard margin = zero błędów i zero naruszeń marginesu.", "wrong": {"B": "Akceptowanie błędów opisuje soft margin. Hard margin jest nieelastyczny.", "C": "Punkty nie muszą leżeć na samej granicy. Mają znajdować się po właściwych stronach poza naruszeniem marginesu.", "D": "Hard margin dotyczy tolerancji błędów, nie wymusza kernela poly."}}}, {"n": 4, "difficulty": "średnie", "category": "ML", "prompt": "Jak soft margin różni się od hard margin?", "options": {"A": "Soft margin zakazuje jakiegokolwiek naruszenia marginesu", "B": "Soft margin pozwala naruszyć margines i zaakceptować część błędnych klasyfikacji", "C": "Soft margin usuwa wszystkie support vectors", "D": "Soft margin działa wyłącznie dla regresji liniowej"}, "correct": "B", "why": "Soft margin pozwala naruszyć margines i zaakceptować część błędów, co pomaga przy outlierach.", "lesson": {"correct": "Soft margin jest elastyczny. Pozwala niektórym punktom wejść w pas marginesu. Może też zaakceptować część pomyłek. Dzięki temu outlier mniej psuje całą granicę. To praktyczniejsze na prawdziwych danych.", "example": "Dziewięćdziesiąt dziewięć punktów jest dobrze rozdzielonych. Jeden punkt leży daleko po złej stronie. Hard margin mocno przesuwa granicę przez ten jeden punkt. Soft margin pozwala na ten wyjątek i zachowuje szerszy, sensowniejszy margines.", "remember": "Soft margin = elastyczność wobec błędów i outlierów.", "wrong": {"A": "Zakaz naruszeń to hard margin. Soft margin właśnie pozwala na naruszenia.", "C": "Support vectors nadal istnieją. Soft margin nie usuwa ich z definicji modelu.", "D": "Soft margin dotyczy kompromisu w SVM, nie ogranicza się do regresji liniowej."}}}, {"n": 5, "difficulty": "średnie", "category": "ML", "prompt": "Co zwykle oznacza mniejsze wartości parametru `C` w SVM?", "options": {"A": "Węższy margines i mniejszą tolerancję na błędy", "B": "Automatyczne usunięcie wszystkich kerneli", "C": "Szerszy margines i większą tolerancję na błędy", "D": "Wymuszenie hard margin bez wyjątków"}, "correct": "C", "why": "Mniejsze C daje zwykle szerszy margines i większą tolerancję na błędy klasyfikacji.", "lesson": {"correct": "Parametr C steruje kompromisem między szerokością marginesu a karą za błędy. Małe C łagodniej karze błędy. Model może wtedy utrzymać szerszy margines. Duże C mocniej karze błędy i zwęża margines. Domyślnie w wielu przykładach C wynosi 1.", "example": "Przy C równym 0.1 model pozwala na kilka punktów w pasie marginesu. Granica zostaje szeroka i spokojna. Przy bardzo dużym C model mocno pilnuje każdej próbki. Margines staje się węższy.", "remember": "Małe C: szerszy margines, więcej tolerancji.", "wrong": {"A": "To opis dużego C. Małe C działa odwrotnie.", "B": "C nie usuwa kerneli. Kernel wybierasz osobnym parametrem.", "D": "Małe C zwiększa elastyczność, a nie wymusza twardego hard margin."}}}, {"n": 6, "difficulty": "średnie", "category": "ML", "prompt": "Jaki jest domyślny kernel w klasie `SVC` w scikit-learn?", "options": {"A": "linear", "B": "poly", "C": "sigmoid", "D": "rbf"}, "correct": "D", "why": "Domyślnym kernelem w SVC jest rbf.", "lesson": {"correct": "SVC to klasyfikator SVM w scikit-learn. Parametr kernel wybiera rodzaj jądra. Jeśli nie ustawisz kernela, używany jest rbf. RBF pozwala budować nieliniowe granice. Linear i poly trzeba wybrać świadomie.", "example": "Tworzysz model = SVC() bez dodatkowych argumentów. Model i tak ma kernel. Tym kernelem jest rbf. Dopiero SVC(kernel='linear') wymusza granicę liniową.", "remember": "Domyślny kernel w SVC to rbf.", "wrong": {"A": "Kernel linear trzeba ustawić jawnie. Nie jest domyślny w SVC.", "B": "Kernel poly także wymaga jawnego wyboru. Nie jest domyślny.", "C": "Sigmoid nie jest domyślnym kernelem opisanym w notatkach kursu jako standard SVC."}}}, {"n": 7, "difficulty": "średnie", "category": "ML", "prompt": "Po co stosuje się kernel (jądro) w SVM?", "options": {"A": "Aby usunąć potrzebę zbioru treningowego", "B": "Aby rozwiązywać także problemy nieliniowe przez odpowiedni sposób budowy granicy", "C": "Aby zamienić klasyfikację na regułę większości drzew", "D": "Aby zawsze wymusić hard margin"}, "correct": "B", "why": "Kernel pozwala SVM budować nie tylko liniowe, lecz także nieliniowe granice i radzić sobie z problemami nieliniowymi.", "lesson": {"correct": "Nie wszystkie dane da się rozdzielić prostą linią. Kernel zmienia sposób budowy granicy. Dzięki temu SVM potrafi działać też przy zależnościach nieliniowych. Popularne kernele to linear, rbf i poly. Intuicja: w innej przestrzeni podział może stać się prostszy.", "example": "Punkty tworzą pierścień jednej klasy wokół drugiej. Linia prosta ich nie rozdzieli. Kernel rbf może utworzyć bardziej złożoną granicę. Wtedy obie klasy da się sensownie oddzielić.", "remember": "Kernel pomaga SVM przy problemach nieliniowych.", "wrong": {"A": "Kernel nie usuwa treningu. Model nadal uczy się na danych.", "C": "Głosowanie drzew należy do Random Forest. Kernel należy do SVM.", "D": "Kernel nie wymusza hard margin. Hard/soft margin to osobna decyzja o tolerancji błędów."}}}, {"n": 8, "difficulty": "trudne", "category": "ML", "prompt": "Kiedy szczególnie przydatny jest kernel `rbf`?", "options": {"A": "Gdy dane da się idealnie rozdzielić jedną prostą linią i chcemy najprostszą granicę", "B": "Gdy chcemy budować bardziej złożone, nieliniowe granice, bo linia nie wystarcza", "C": "Gdy model ma składać się z wielu drzew decyzyjnych", "D": "Gdy celem jest wyłącznie obliczenie MAE"}, "correct": "B", "why": "RBF przydaje się, gdy potrzebne są złożone nieliniowe granice, bo danych nie da się sensownie oddzielić prostą linią.", "lesson": {"correct": "Kernel linear rysuje prostą granicę liniową. Gdy klasy są mocno wymieszane w sposób nieliniowy, linia nie wystarcza. RBF pozwala tworzyć bardziej zawiłe regiony. To właśnie wtedy jest szczególnie użyteczny. Poly buduje z kolei granice wielomianowe.", "example": "Jedna klasa tworzy wyspę w środku, a druga otacza ją dookoła. Linia przetnie obie grupy. Kernel rbf może otoczyć środkową wyspę krzywą granicą. Predykcje lepiej oddają kształt danych.", "remember": "RBF = nieliniowe, bardziej złożone granice.", "wrong": {"A": "Przy idealnie liniowo separowalnych danych naturalnym wyborem jest często kernel linear. RBF jest silniejszy przy nieliniowości.", "C": "Wiele drzew to Random Forest. SVM z rbf nie buduje lasu drzew.", "D": "MAE jest metryką regresji. Nie określa wyboru kernela SVM."}}}, {"n": 9, "difficulty": "trudne", "category": "ML", "prompt": "Jaka jest najważniejsza intuicja działania kerneli w SVM?", "options": {"A": "Dane nieliniowo separowalne w jednej przestrzeni mogą stać się liniowo separowalne po odpowiednim przekształceniu", "B": "Kernel zawsze usuwa połowę cech wejściowych", "C": "Kernel zamienia accuracy na R²", "D": "Kernel wymusza ocenę modelu wyłącznie na danych treningowych"}, "correct": "A", "why": "Kernel opiera się na intuicji, że po przekształceniu przestrzeni problem nieliniowy może stać się liniowo separowalny.", "lesson": {"correct": "W oryginalnej przestrzeni klasy mogą się przeplatać. Prosta linia wtedy nie działa. Po przekształceniu do innej przestrzeni układ punktów może się zmienić. Wtedy zwykła hiperpłaszczyzna potrafi je rozdzielić. Kernel daje właśnie taką intuicję transformacji.", "example": "Na jednej osi leżą punkty: klasa A, potem B, potem znów A. Jednym progiem ich nie rozdzielisz. Po podniesieniu pozycji do kwadratu grupy mogą się ułożyć inaczej. W nowej przestrzeni podział staje się możliwy. Podobnie R² może przejść do R³.", "remember": "Kernel: inna przestrzeń może uczynić podział liniowym.", "wrong": {"B": "Kernel nie polega na usuwaniu połowy cech. Chodzi o przekształcenie sposobu dzielenia przestrzeni.", "C": "Accuracy i R² to metryki różnych typów zadań. Kernel ich nie zamienia.", "D": "Kernel nie zmienia zasady oceny. Nadal warto testować model na niewidzianych danych."}}}, {"n": 10, "difficulty": "trudne", "category": "ML", "prompt": "Które zestawienie parametrów `SVC` jest zgodne z notatkami kursu?", "options": {"A": "`C` wybiera liczbę drzew, a `kernel` ustawia accuracy", "B": "`kernel` zawsze musi być linear, a `C` nie ma wpływu na margines", "C": "`C` usuwa support vectors, a `kernel` liczy MAE", "D": "`C` steruje tolerancją błędów i szerokością marginesu, a `kernel` wybiera rodzaj granicy (np. linear, rbf, poly)"}, "correct": "D", "why": "C reguluje kompromis margines–błędy, a kernel wybiera rodzaj granicy (linear, rbf, poly).", "lesson": {"correct": "W SVC dwa kluczowe parametry to C oraz kernel. C mówi, jak mocno karać błędy i jak szeroki ma być margines. Kernel mówi, czy granica ma być liniowa, RBF czy wielomianowa. Razem pozwalają dopasować elastyczność modelu. To podstawowy zestaw ustawień SVM w scikit-learn.", "example": "Bierzesz SVC(C=1, kernel='poly', degree=3). C=1 ustawia standardowy kompromis błędów. Kernel poly buduje wielomianową granicę. Degree=3 określa stopień wielomianu. Model trenuje się przez fit na danych.", "remember": "C = margines i błędy; kernel = kształt granicy.", "wrong": {"A": "Liczbę drzew ustawia n_estimators w Random Forest. Kernel nie ustawia accuracy.", "B": "Kernel nie musi być zawsze linear. C właśnie wpływa na margines i tolerancję błędów.", "C": "C nie usuwa support vectors. Kernel nie liczy MAE."}}}, {"n": 11, "difficulty": "łatwe", "category": "ML", "prompt": "Co określa parametr `n_estimators` w Random Forest?", "options": {"A": "Liczbę drzew decyzyjnych w lesie", "B": "Maksymalną głębokość jednego drzewa", "C": "Liczbę klas w zbiorze Iris", "D": "Wartość parametru C w SVM"}, "correct": "A", "why": "n_estimators określa liczbę drzew decyzyjnych budowanych w lesie.", "lesson": {"correct": "Random Forest to las wielu drzew. Parametr n_estimators mówi, ile tych drzew zbudować. Wartość 100 oznacza sto drzew. Nie ustawia głębokości ani liczby klas. Końcowa decyzja powstaje z głosów tych drzew.", "example": "Tworzysz RandomForestClassifier(n_estimators=100). Model buduje sto drzew. Każde drzewo oddaje głos na klasę. Las wybiera klasę z większości głosów.", "remember": "n_estimators = liczba drzew w lesie.", "wrong": {"B": "Głębokość kontroluje inny parametr. n_estimators liczy drzewa.", "C": "Liczba klas wynika z targetu. n_estimators jej nie ustawia.", "D": "Parametr C należy do SVM. Random Forest używa n_estimators."}}}, {"n": 12, "difficulty": "łatwe", "category": "ML", "prompt": "Co oznacza `Gini = 0` w węźle drzewa klasyfikacyjnego?", "options": {"A": "Klasy są wymieszane po równo", "B": "Węzeł jest czysty i zawiera obserwacje jednej klasy", "C": "Entropia węzła jest maksymalna", "D": "Model jest gorszy niż przewidywanie średniej"}, "correct": "B", "why": "Gini równe zero oznacza czysty węzeł z obserwacjami jednej klasy.", "lesson": {"correct": "Gini mierzy wymieszanie klas. Zero oznacza brak wymieszania. Wszystkie próbki w węźle mają tę samą klasę. Taki węzeł nazywamy czystym. Im wyższe Gini, tym większe mieszanie.", "example": "W liściu siedzi dwadzieścia próbek Setosa i nic więcej. Udział jednej klasy wynosi 100 procent. Gini spada do zera. Węzeł jest czysty.", "remember": "Gini zero = czysty węzeł.", "wrong": {"A": "Równe wymieszanie daje wysoką nieczystość, nie Gini zero.", "C": "Maksymalna entropia dotyczy mocnego wymieszania. Czysty węzeł ma entropię zero.", "D": "Porównanie ze średnią dotyczy R² w regresji, nie Gini."}}}, {"n": 13, "difficulty": "łatwe", "category": "ML", "prompt": "Jak poprawnie użyć `StandardScaler` po podziale train/test?", "options": {"A": "Dopasować scaler na całych danych przed podziałem", "B": "Dopasować osobny scaler tylko na zbiorze testowym", "C": "Dopasować scaler na train, a następnie tym samym scalerem transformować train i test", "D": "Dopasować scaler wyłącznie na teście, a train zostawić bez zmian"}, "correct": "C", "why": "Scaler fit tylko na train; potem tymi samymi parametrami transformujemy train i test.", "lesson": {"correct": "StandardScaler uczy się średniej i odchylenia podczas fit. Te parametry wolno liczyć tylko na train. Potem ten sam scaler transformuje train i test. Dzięki temu test nie wycieka do dopasowania. To chroni przed data leakage.", "example": "Dzielisz dane. Wywołujesz scaler.fit(X_train). Potem transformujesz X_train i X_test. Oba zbiory używają średniej z treningu. Test nie wpływa na parametry skalowania.", "remember": "Fit scalera tylko na train, transform na train i test.", "wrong": {"A": "Fit przed podziałem pozwala testowi wpłynąć na średnią. To wyciek informacji.", "B": "Osobny fit na teście wykorzystuje dane testowe i psuje spójność skali.", "D": "Train musi być przeskalowany tymi samymi regułami. Test nie może być źródłem dopasowania."}}}, {"n": 14, "difficulty": "średnie", "category": "ML", "prompt": "Jaki jest typowy skutek małego `k` w KNN?", "options": {"A": "Zawsze maksymalnie gładkie granice i silny underfitting", "B": "Poszarpane granice i większe ryzyko overfittingu", "C": "Budowa lasu stu drzew", "D": "Wymuszenie kernela linear w SVM"}, "correct": "B", "why": "Małe k daje lokalne, poszarpane granice i większe ryzyko overfittingu.", "lesson": {"correct": "KNN patrzy na najbliższych sąsiadów. Małe k oznacza bardzo małą grupę. Pojedyncze punkty mocno zmieniają decyzję. Granice stają się poszarpane. Rośnie ryzyko przeuczenia do lokalnego szumu.", "example": "Przy k=1 decyduje jeden najbliższy punkt. Nietypowa próbka tworzy małą wyspę swojej klasy. Przy większym k głosuje więcej sąsiadów. Granica zwykle się wygładza.", "remember": "Małe k = poszarpane granice i ryzyko overfittingu.", "wrong": {"A": "Gładkie granice są typowe raczej dla większego k.", "C": "Las drzew to Random Forest, nie skutek małego k w KNN.", "D": "Kernel SVM nie zależy od parametru k w KNN."}}}, {"n": 15, "difficulty": "średnie", "category": "ML", "prompt": "Co oznacza `R² = 0` dla modelu regresji?", "options": {"A": "Idealne dopasowanie do wszystkich obserwacji", "B": "Zerowy błąd każdej predykcji", "C": "Model nie jest lepszy od przewidywania średniej targetu", "D": "Model zawsze jest gorszy od każdego innego modelu"}, "correct": "C", "why": "R² równe zero oznacza jakość na poziomie przewidywania średniej targetu.", "lesson": {"correct": "R² porównuje model z naiwnym przewidywaniem średniej. Zero oznacza ten sam poziom jakości. Jeden oznacza idealne dopasowanie. Wartość ujemna oznacza wynik gorszy od średniej. Zero nie jest więc sukcesem ani katastrofą ekstremalną.", "example": "Naiwny model zawsze podaje średnią cenę domu. Twój model ma R² = 0. Nie wyjaśnia wahań lepiej od tej prostej reguły. R² poniżej zera byłoby jeszcze słabsze.", "remember": "R² zero = poziom średniej.", "wrong": {"A": "Idealne dopasowanie to R² = 1, nie 0.", "B": "Zerowe błędy dałyby R² = 1.", "D": "R² = 0 nie jest najgorszym wynikiem. R² może być ujemne."}}}, {"n": 16, "difficulty": "średnie", "category": "ML", "prompt": "Jak Random Forest ustala końcową klasę w klasyfikacji?", "options": {"A": "Wybiera klasę wskazaną przez większość drzew", "B": "Uśrednia nazwy klas zapisane w liściach", "C": "Korzysta wyłącznie z predykcji pierwszego drzewa", "D": "Wybiera klasę o najmniejszej feature importance"}, "correct": "A", "why": "W klasyfikacji drzewa głosują, a las wybiera klasę większości.", "lesson": {"correct": "Każde drzewo oddaje głos na klasę. Las zbiera te głosy. Wygrywa klasa z największą liczbą głosów. To głosowanie większościowe. Dzięki temu wynik mniej zależy od jednego drzewa.", "example": "Pięć drzew mówi: A, A, B, A, B. Klasa A ma trzy głosy. Las przewiduje A. Pojedyncze drzewo nie decyduje samo.", "remember": "Klasyfikacja w lesie = głosowanie większości.", "wrong": {"B": "Nazw klas nie uśrednia się sensownie. Liczy się liczba głosów.", "C": "Las łączy wiele drzew, nie tylko pierwsze.", "D": "Feature importance opisuje znaczenie cech, nie wybiera końcowej klasy próbki."}}}, {"n": 17, "difficulty": "średnie", "category": "ML", "prompt": "Który podział wybiera drzewo decyzyjne podczas budowy?", "options": {"A": "Podział z najmniejszym zyskiem informacyjnym", "B": "Podział dający największą nieczystość dzieci", "C": "Podział z największym zyskiem informacyjnym (największy spadek ważonej nieczystości)", "D": "Losowy podział bez oceny klas"}, "correct": "C", "why": "Drzewo wybiera podział z największym zyskiem informacyjnym, czyli największą redukcją ważonej nieczystości.", "lesson": {"correct": "Drzewo porównuje możliwe podziały. Dobry podział zmniejsza ważoną nieczystość dzieci. Zysk informacyjny mierzy ten spadek. Algorytm wybiera największy zysk. Dzięki temu węzły stają się czystsze.", "example": "Nieczystość rodzica wynosi 1.0. Po podziale ważona nieczystość dzieci spada do 0.3. Zysk wynosi 0.7. Podział z większym zyskiem wygrywa.", "remember": "Najlepszy podział = największy spadek nieczystości.", "wrong": {"A": "Mały zysk prawie nie porządkuje klas. Szukamy największego zysku.", "B": "Duża nieczystość dzieci oznacza silne wymieszanie. Algorytm chce ją zmniejszyć.", "D": "Podziały są oceniane miarami Gini lub entropii, nie są wybierane w ciemno."}}}, {"n": 18, "difficulty": "trudne", "category": "ML", "prompt": "Po co stosuje się `drop_first=True` przy one-hot encodingu?", "options": {"A": "Aby utworzyć K+1 kolumn dla K kategorii", "B": "Aby pozostawić K−1 kolumn i ograniczyć kolinearność", "C": "Aby zamienić target ciągły na klasy", "D": "Aby zwiększyć stopień wielomianu cech"}, "correct": "B", "why": "drop_first usuwa kategorię bazową, zostawia K−1 kolumn i ogranicza kolinearność.", "lesson": {"correct": "One-hot tworzy kolumny 0/1 dla kategorii. Pełne K kolumn niesie zbędną zależność liniową. drop_first usuwa jedną kategorię jako bazę. Zostaje K−1 kolumn. To ogranicza pułapkę zmiennych fikcyjnych.", "example": "Kolor: czerwony, zielony, niebieski. Zostawiasz zielony i niebieski. Dwa zera oznaczają czerwony. Trzecia kolumna nie jest potrzebna.", "remember": "Dla K kategorii drop_first zostawia K−1 kolumn.", "wrong": {"A": "drop_first usuwa kolumnę, nie dodaje ekstra kolumny.", "C": "To dotyczy kodowania cech kategorycznych, nie automatycznej zamiany targetu.", "D": "Stopień wielomianu ustawia PolynomialFeatures, nie drop_first."}}}, {"n": 19, "difficulty": "trudne", "category": "ML", "prompt": "Dlaczego `accuracy = 1.0` na małym zbiorze testowym Iris nie dowodzi, że model jest idealny?", "options": {"A": "Accuracy 1.0 oznacza dokładnie połowę poprawnych odpowiedzi", "B": "Wynik dotyczy tylko konkretnego, małego testu i nie gwarantuje braku błędów na nowych danych", "C": "Żaden klasyfikator nie może osiągnąć accuracy większej niż 0.5", "D": "Taki wynik zawsze oznacza underfitting"}, "correct": "B", "why": "Perfekcyjny wynik na małym teście opisuje tylko te próbki i nie gwarantuje bezbłędnej generalizacji.", "lesson": {"correct": "Accuracy 1.0 oznacza brak błędów na sprawdzonym zbiorze. Iris jest mały i stosunkowo prosty. Test może mieć tylko kilkadziesiąt próbek. Na większej liczbie nowych danych model nadal może się mylić. Dlatego nie wolno mylić jednego testu z gwarancją idealności.", "example": "Model trafia wszystkie 38 próbek testowych. Potem dostaje tysiące nowych kwiatów. Część może być trudniejsza. Pierwszy wynik nie gwarantuje kolejnych stu procent.", "remember": "100% na małym teście ≠ model idealny na zawsze.", "wrong": {"A": "Accuracy 1.0 to wszystkie poprawne odpowiedzi na danym zbiorze.", "C": "Klasyfikator może mieć accuracy powyżej 0.5, także 1.0.", "D": "Wysoki wynik nie dowodzi underfittingu."}}}, {"n": 20, "difficulty": "trudne", "category": "ML", "prompt": "Co zwraca `predict_proba()` klasyfikatora?", "options": {"A": "Wyłącznie końcowe etykiety klas", "B": "Współczynnik R² dla każdej próbki", "C": "Prawdopodobieństwa przynależności do poszczególnych klas", "D": "Macierz korelacji cech"}, "correct": "C", "why": "predict_proba zwraca dla każdej próbki prawdopodobieństwa poszczególnych klas.", "lesson": {"correct": "Metoda predict zwraca wybraną etykietę. predict_proba pokazuje rozkład prawdopodobieństw klas. Wartości w wierszu sumują się do jednego. Dzięki temu widać pewność decyzji. To ważna różnica w klasyfikacji.", "example": "Klasyfikator zwraca 0.08 i 0.92. Pierwsza liczba dotyczy pierwszej klasy. Druga drugiej. Predict wybierze klasę z większym prawdopodobieństwem.", "remember": "predict = etykieta; predict_proba = prawdopodobieństwa.", "wrong": {"A": "Etykiety zwraca predict, nie predict_proba.", "B": "R² jest metryką regresji, nie wynikiem predict_proba.", "D": "Macierz korelacji opisuje cechy, nie predykcje prawdopodobieństw."}}}]};
const form=document.getElementById("quiz");
const answered=document.getElementById("answered");
const results=document.getElementById("results");
let lastGrade=null;
const esc=value=>String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function render(){
form.innerHTML=QUIZ.questions.map(q=>`<article class="card" id="card-${q.n}"><div class="meta"><span class="tag">#${q.n}</span><span class="tag diff-${q.difficulty}">${q.difficulty}</span><span class="tag">${q.category}</span></div><p class="prompt">${q.n}. ${esc(q.prompt)}</p><div class="options">${["A","B","C","D"].map(letter=>`<label class="opt"><input type="radio" name="q${q.n}" value="${letter}"><span class="letter">${letter})</span><span>${esc(q.options[letter])}</span></label>`).join("")}<label class="opt idk-option"><input type="radio" name="q${q.n}" value="?"><span class="letter">?</span><span>Nie mam pojęcia — bez zgadywania, chcę się nauczyć</span></label></div><label class="confidence">Pewność:<select name="c${q.n}" aria-label="Pewność pytania ${q.n}"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><div class="feedback" id="feedback-${q.n}" hidden></div></article>`).join("");
}
function collect(){
return QUIZ.questions.map(q=>{const selected=form.querySelector(`input[name="q${q.n}"]:checked`);const confidence=form.querySelector(`select[name="c${q.n}"]`).value;return{n:q.n,answer:selected?selected.value:"",confidence:confidence||"—"};});
}
function updateProgress(){
answered.textContent=String(collect().filter(row=>row.answer).length);
}
function lessonBlocks(q,wrong){
return `<div class="lesson">${wrong?`<div class="lesson-block wrong"><h3>Twoja odpowiedź</h3><p>${esc(q.lesson.wrong[wrong])}</p></div>`:""}<div class="lesson-block"><h3>Poprawna myśl</h3><p>${esc(q.lesson.correct)}</p></div><div class="lesson-block"><h3>Przykład</h3><p>${esc(q.lesson.example)}</p></div><div class="lesson-block remember"><h3>Zapamiętaj</h3><p>${esc(q.lesson.remember)}</p></div></div>`;
}
function grade(){
const rows=collect();
const missing=rows.filter(row=>!row.answer).map(row=>row.n);
if(missing.length){alert(`Brak odpowiedzi w pytaniach: ${missing.join(", ")}`);return null}
let score=0;
let unknown=0;
const detail=rows.map(row=>{
const q=QUIZ.questions[row.n-1];
const isUnknown=row.answer==="?";
const isCorrect=row.answer===q.correct;
if(isCorrect)score+=1;
if(isUnknown)unknown+=1;
const status=isCorrect?"OK":isUnknown?"NIE WIEM":"BŁĄD";
const card=document.getElementById(`card-${q.n}`);
const feedback=document.getElementById(`feedback-${q.n}`);
card.classList.remove("ok","bad","idk");
card.classList.add(isCorrect?"ok":isUnknown?"idk":"bad");
feedback.hidden=false;
feedback.innerHTML=isCorrect?`<p class="status-ok">OK</p><p>${esc(q.why)}</p>`:isUnknown?`<p class="status-idk">NIE WIEM · Poprawna: ${q.correct}</p><p class="encourage">Bez zgadywania — oto wyjaśnienie.</p>${lessonBlocks(q,"")}`:`<p class="status-bad">BŁĄD · Twoja: ${row.answer} · Poprawna: ${q.correct}</p>${lessonBlocks(q,row.answer)}`;
return{...row,correct:q.correct,status,why:q.why,prompt:q.prompt,isCorrect,isUnknown};
});
const percentage=Math.round(score/20*100);
document.getElementById("score").textContent=`${score}/20`;
document.getElementById("percentage").textContent=`Skuteczność: ${percentage}%`;
document.getElementById("unknown").textContent=`Nie wiem: ${unknown}`;
document.getElementById("state").textContent="Sprawdzono";
results.classList.add("show");
lastGrade={score,percentage,unknown,detail};
results.scrollIntoView({behavior:"smooth",block:"start"});
return lastGrade;
}
function download(filename,content){
const url=URL.createObjectURL(new Blob([content],{type:"text/markdown;charset=utf-8"}));
const link=document.createElement("a");
link.href=url;
link.download=filename;
link.click();
URL.revokeObjectURL(url);
}
function answersMd(detail){
const rows=detail.map(row=>`| ${row.n} | ${row.answer} | ${row.confidence==="—"?"":row.confidence} |  |`).join("\n");
return `# Moje odpowiedzi – ${QUIZ.date}\n\n| # | Twoja odpowiedź (A/B/C/D/?) | Pewność (1-5) | Uwagi |\n|---|------------------------------|---------------|-------|\n${rows}\n\n## Notatki\n\n`;
}
function resultsMd(grade){
const rows=grade.detail.map(row=>`| ${row.n} | ${row.answer} | ${row.correct} | ${row.status} | ${row.confidence} | ${row.why} |`).join("\n");
const strong=grade.detail.filter(row=>row.isCorrect).map(row=>row.n);
const weak=grade.detail.filter(row=>!row.isCorrect).map(row=>`#${row.n} (${row.status})`);
const strongText=strong.length?`Pytania OK: ${strong.join(", ")}.`:"Brak trafionych pytań w tej próbie.";
const weakText=weak.length?`Do powtórki: ${weak.join(", ")}.`:"Brak pozycji do powtórki.";
return `# Wynik quizu — ${QUIZ.date}\n\n## Wynik\n\n- Wynik: ${grade.score}/20\n- Skuteczność: ${grade.percentage}%\n- Nie wiem: ${grade.unknown}\n\n## Szczegóły\n\n| # | Twoja odpowiedź | Poprawna odpowiedź | Wynik | Pewność | Komentarz |\n|---|-----------------|--------------------|-------|---------|-----------|\n${rows}\n\n## Mocne strony\n\n${strongText}\n\n## Obszary do powtórki\n\n${weakText}\n`;
}
form.addEventListener("change",updateProgress);
document.getElementById("grade").addEventListener("click",grade);
document.getElementById("reset").addEventListener("click",()=>{form.reset();results.classList.remove("show");lastGrade=null;document.getElementById("state").textContent="W trakcie";QUIZ.questions.forEach(q=>{const card=document.getElementById(`card-${q.n}`);const feedback=document.getElementById(`feedback-${q.n}`);card.classList.remove("ok","bad","idk");feedback.hidden=true;feedback.innerHTML="";});updateProgress();});
document.getElementById("download-answers").addEventListener("click",()=>{const grade=lastGrade||grade();if(!grade)return;download(`${QUIZ.date}_my_answers.md`,answersMd(grade.detail));});
document.getElementById("download-results").addEventListener("click",()=>{const grade=lastGrade||grade();if(!grade)return;download(`${QUIZ.date}_results.md`,resultsMd(grade));});
render();
updateProgress();
</script>
</body>
</html>
