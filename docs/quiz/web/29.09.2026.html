<script>
const QUIZ={"date": "29.09.2026", "questions": [{"n": 1, "difficulty": "łatwe", "category": "ML", "prompt": "Dlaczego przy treningu SVM na Iris zwykle standaryzuje się cechy?", "options": {"A": "Bo StandardScaler zamienia klasyfikację na regresję", "B": "Bo bez skalowania model zawsze buduje las stu drzew", "C": "Bo SVM jest wrażliwy na skalę cech i przeskalowanie danych jest ważne dla poprawnego działania", "D": "Bo standaryzacja usuwa potrzebę zbioru testowego"}, "correct": "C", "why": "Przy SVM ważne jest przeskalowanie cech, bo model jest wrażliwy na skalę zmiennych.", "lesson": {"correct": "SVM patrzy na odległości i położenie punktów w przestrzeni cech. Jeśli jedna cecha ma duże liczby, a druga małe, ta duża może zdominować granicę. Dlatego cechy często sprowadza się do podobnej skali. StandardScaler ustawia średnią blisko zera i odchylenie blisko jedynki. Dzięki temu model porównuje cechy uczciwiej.", "example": "Wyobraź sobie dwie cechy: długość płatka w centymetrach i inną cechę w tysiącach. Bez skalowania druga cecha krzyczy głośniej. Po standaryzacji obie mówią podobnym głosem. SVM łatwiej buduje sensowny margines.", "remember": "SVM lubi cechy w podobnej skali — stąd StandardScaler.", "wrong": {"A": "Scaler nie zmienia typu zadania. Klasyfikacja zostaje klasyfikacją.", "B": "Las drzew to Random Forest. Standaryzacja nie buduje drzew.", "D": "Zbiór testowy nadal jest potrzebny do oceny modelu."}}}, {"n": 2, "difficulty": "łatwe", "category": "ML", "prompt": "Jak poprawnie użyć StandardScaler przed trenowaniem SVC?", "options": {"A": "Dopasować scaler na całych danych przed podziałem train/test", "B": "Dopasować scaler tylko na train, a potem tym samym scalerem transformować train i test", "C": "Dopasować osobny scaler wyłącznie na zbiorze testowym", "D": "Pominąć transformację train i skalować tylko test"}, "correct": "B", "why": "Scaler uczymy tylko na danych treningowych, a potem tymi samymi parametrami transformujemy train i test.", "lesson": {"correct": "Najpierw dzielisz dane na train i test. Potem scaler.fit robisz tylko na train. Scaler zapamiętuje średnią i odchylenie z treningu. Potem transformujesz train i test tym samym scalerem. Test nie może wpływać na parametry skalowania. To chroni przed wyciekiem informacji.", "example": "Masz X_train i X_test. Wywołujesz scaler.fit(X_train). Potem X_train = scaler.transform(X_train) oraz X_test = scaler.transform(X_test). Średnia pochodzi z treningu. Test tylko korzysta z tych liczb.", "remember": "Fit scalera tylko na train; transform na train i test.", "wrong": {"A": "Fit przed podziałem pozwala testowi wpłynąć na średnią. To data leakage.", "C": "Fit na teście wykorzystuje dane, których model nie powinien widzieć przy przygotowaniu.", "D": "Train też musi być przeskalowany tą samą regułą. Sam test to za mało."}}}, {"n": 3, "difficulty": "łatwe", "category": "ML", "prompt": "Co oznacza skrót SVC w scikit-learn?", "options": {"A": "Support Vector Classifier", "B": "Simple Variance Calculator", "C": "Sequential Value Clustering", "D": "Standard Variable Compressor"}, "correct": "A", "why": "SVC oznacza Support Vector Classifier — klasyfikator SVM.", "lesson": {"correct": "SVC to klasa do klasyfikacji metodą SVM. Importujesz ją z sklearn.svm. Tworzysz model, ustawiasz C i kernel, potem fit. Score na klasyfikacji to accuracy. To praktyczne narzędzie do maszyny wektorów nośnych.", "example": "Piszesz from sklearn.svm import SVC. Potem classifier = SVC(C=1, kernel='linear'). Na końcu classifier.fit(X_train, y_train). Model uczy się granicy między klasami.", "remember": "SVC = Support Vector Classifier.", "wrong": {"B": "To nie jest kalkulator wariancji. SVC to klasyfikator SVM.", "C": "Sequential Value Clustering nie opisuje tej klasy.", "D": "SVC nie kompresuje zmiennych. Służy do klasyfikacji."}}}, {"n": 4, "difficulty": "średnie", "category": "ML", "prompt": "Po co w przykładzie SVM na Iris wybiera się tylko dwie cechy, np. petal length i sepal width?", "options": {"A": "Bo Iris ma zawsze tylko dwie cechy wejściowe", "B": "Bo StandardScaler działa wyłącznie dla dwóch kolumn", "C": "Bo SVC wymaga dokładnie dwóch klas i dwóch cech jednocześnie", "D": "Głównie po to, aby dało się narysować granice decyzyjne na wykresie 2D"}, "correct": "D", "why": "Dwie cechy wybiera się głównie po to, by móc zwizualizować granice decyzyjne na płaszczyźnie 2D.", "lesson": {"correct": "Iris ma cztery cechy. Do rysunku 2D potrzebujesz dwóch osi. Dlatego bierzesz np. długość płatka i szerokość działki. Model nadal klasyfikuje, ale przestrzeń da się pokazać na kartce. Dzięki temu widać liniową albo zakrzywioną granicę. To cel dydaktyczny i wizualny.", "example": "Bierzesz kolumny o indeksach 2 i 1. Na osi X masz petal length. Na osi Y masz sepal width. plot_decision_regions maluje kolorowe regiony klas. Od razu widać, jak SVC dzieli płaszczyznę.", "remember": "Dwie cechy = wygodna wizualizacja granic 2D.", "wrong": {"A": "Iris ma cztery cechy. Dwie wybieramy świadomie do rysunku.", "B": "Scaler działa dla dowolnej liczby kolumn numerycznych.", "C": "SVC może mieć więcej cech i więcej klas. Limit dwóch cech nie jest wymogiem algorytmu."}}}, {"n": 5, "difficulty": "średnie", "category": "ML", "prompt": "Jaka jest typowa różnica granicy między kernel='linear' a kernel='rbf' przy podobnym wyniku accuracy?", "options": {"A": "Linear daje prostą granicę, a RBF bardziej złożoną, zakrzywioną granicę", "B": "Linear zawsze buduje sto drzew, a RBF jedno drzewo", "C": "RBF zawsze wymusza hard margin, a linear soft margin", "D": "Linear liczy MAE, a RBF liczy wyłącznie R²"}, "correct": "A", "why": "Kernel linear buduje prostą granicę, a RBF bardziej złożoną i zakrzywioną — nawet gdy accuracy bywa podobne.", "lesson": {"correct": "Accuracy mówi, ile próbek trafiłeś. Nie pokazuje kształtu granicy. Linear rysuje linię albo hiperpłaszczyznę. RBF potrafi zaginać regiony klas. Na łatwych danych obie metody mogą mieć podobny wynik. Różnica widać na wykresie granic.", "example": "Dwie klasy są siedzą po dwóch stronach kartki. Linear przecina je prostą kreską. RBF może narysować łagodniejszy łuk. Oba modele mogą mieć 100% accuracy, ale wyglądają inaczej.", "remember": "Linear = prosta granica; RBF = bardziej złożona.", "wrong": {"B": "Drzewa należą do Random Forest. Kernel SVM nie buduje lasu.", "C": "Wybór kernela nie jest tym samym co hard/soft margin.", "D": "MAE i R² to metryki regresji. Tu oceniamy klasyfikację accuracy."}}}, {"n": 6, "difficulty": "średnie", "category": "ML", "prompt": "Dlaczego przy dwóch łatwo separowalnych klasach Iris model liniowy SVC może uzyskać około 100% accuracy?", "options": {"A": "Bo każdy model SVM zawsze ma accuracy dokładnie 100%", "B": "Bo kernel linear usuwa wszystkie trudne próbki przed treningiem", "C": "Bo wybrane klasy i cechy mogą być bardzo łatwo liniowo separowalne", "D": "Bo score() w SVC zawsze zwraca R² równe 1"}, "correct": "C", "why": "Przy dobrze dobranych dwóch klasach i cechach dane bywają łatwo liniowo separowalne, stąd bardzo wysokie accuracy.", "lesson": {"correct": "Nie każdy problem jest trudny. Setosa i Versicolor przy wybranych cechach mogą leżeć wyraźnie osobno. Liniowa granica wtedy wystarcza. Model trafia prawie wszystko albo wszystko. To nie magia algorytmu, tylko prostota danych. Przy trzech klasach jest już trudniej.", "example": "Zostawiasz klasy 0 i 1 oraz dwie cechy. Punkty tworzą dwie wyraźne chmury. SVC z kernel linear rysuje linię między nimi. Na teście wychodzi 100%. Potem dodajesz trzecią klasę i wynik spada.", "remember": "Łatwa separowalność danych może dać 100% accuracy.", "wrong": {"A": "SVM nie gwarantuje zawsze stu procent. Zależy od danych.", "B": "Kernel linear nie usuwa trudnych próbek automatycznie.", "D": "W klasyfikacji score to accuracy, nie R²."}}}, {"n": 7, "difficulty": "średnie", "category": "ML", "prompt": "Dlaczego na małym zbiorze Iris accuracy na teście może wyjść wyższe niż na treningu?", "options": {"A": "Bo test zawsze musi być lepszy od train w każdym modelu", "B": "Bo przy małej liczbie danych konkretny losowy podział może wrzucić łatwiejsze próbki do testu", "C": "Bo StandardScaler automatycznie poprawia tylko wynik testowy", "D": "Bo kernel rbf zabroniony jest na zbiorze treningowym"}, "correct": "B", "why": "Przy małym zbiorze wynik mocno zależy od losowego podziału — łatwiejsze próbki mogą trafić do testu.", "lesson": {"correct": "Zwykle train bywa lepszy niż test, ale to nie prawo fizyki. Iris ma mało próbek. Po podziale test jest jeszcze mniejszy. Kilka łatwych punktów w teście podnosi procent. Kilka trudnych w train obniża wynik treningu. Dlatego test czasem wygrywa.", "example": "Na train masz kilka trudnych, nakładających się kwiatów. Na test trafiają czyste, oczywiste przypadki. Accuracy train to 93%. Accuracy test to 97%. To efekt podziału, nie dowód overfittingu odwrotnego.", "remember": "Mały zbiór + pech/szczęście podziału = test czasem > train.", "wrong": {"A": "To nie jest obowiązkowa reguła. Częściej train bywa wyższy.", "C": "Scaler nie poprawia magicznie samego testu.", "D": "Kernel rbf trenuje się normalnie na danych treningowych."}}}, {"n": 8, "difficulty": "trudne", "category": "ML", "prompt": "Co jest przykładem data leakage przy przygotowaniu SVM z StandardScaler?", "options": {"A": "Użycie kernel='linear' zamiast 'rbf'", "B": "Rysowanie granic osobno dla train i test", "C": "Ustawienie C=1.0", "D": "Wywołanie fit() scalera także na danych testowych"}, "correct": "D", "why": "Fit scalera na teście pozwala modelowi pośrednio zobaczyć informacje ze zbioru testowego — to data leakage.", "lesson": {"correct": "Data leakage znaczy: do przygotowania lub treningu wyciekają informacje z testu. Scaler.fit liczy średnią i odchylenie. Jeśli policzysz je też na teście, test wpływa na skale. Ocena przestaje być uczciwa. Dlatego fit robisz tylko na train.", "example": "Masz test z bardzo dużymi wartościami. Fit na teście wciąga te wartości do średniej. Potem transform używa wiedzy o teście. To jak podejrzenie odpowiedzi przed egzaminem. Poprawnie: fit tylko na train.", "remember": "Fit scalera na teście = wyciek informacji.", "wrong": {"A": "Wybór kernela to decyzja modelu, nie wyciek danych testowych.", "B": "Osobne wykresy train/test są OK i nie oznaczają leakage.", "C": "C=1.0 to zwykła wartość parametru, nie wyciek."}}}, {"n": 9, "difficulty": "trudne", "category": "ML", "prompt": "Po co ustawiać random_state w train_test_split przy porównywaniu SVC linear i RBF?", "options": {"A": "Aby zwiększyć liczbę cech Iris z 4 do 8", "B": "Aby zamienić accuracy na MAE", "C": "Aby przy kolejnych uruchomieniach dostać ten sam podział danych i porównywać modele uczciwie", "D": "Aby wymusić kernel poly o degree=3"}, "correct": "C", "why": "random_state zapewnia powtarzalny podział, dzięki czemu różnice wyników wynikają z modelu, a nie z innego losowania.", "lesson": {"correct": "Bez ziarna losowego każdy run może dać inny train i test. Wtedy linear i rbf widzą inne próbki. Różnica accuracy może wynikać z pecha podziału. random_state blokuje ten chaos. Przy tym samym podziale porównujesz modele uczciwiej.", "example": "Raz uruchamiasz split bez random_state i linear ma 94%. Potem RBF na innym podziale ma 97%. Nie wiesz, czy wygrał kernel, czy łatwiejszy test. Z random_state=42 oba modele dostają ten sam split.", "remember": "random_state = ten sam podział = uczciwsze porównanie.", "wrong": {"A": "random_state nie dodaje cech. Steruje losowością podziału.", "B": "Nie zamienia metryk. Accuracy zostaje accuracy.", "D": "Kernel poly ustawiasz parametrem kernel, nie random_state."}}}, {"n": 10, "difficulty": "trudne", "category": "ML", "prompt": "Dlaczego przy pełnym Iris (3 klasy) trzeba ostrożniej interpretować pojedynczy wynik accuracy SVC?", "options": {"A": "Bo zbiór ma tylko 150 próbek, a po podziale test jest jeszcze mniejszy, więc pojedyncze próbki mocno ruszają procentami", "B": "Bo accuracy w klasyfikacji zawsze jest nieważne", "C": "Bo SVC nie potrafi pracować z więcej niż dwiema klasami", "D": "Bo trzy klasy automatycznie oznaczają R² zamiast accuracy"}, "correct": "A", "why": "Iris ma 150 próbek; mały test sprawia, że pojedyncze obserwacje mocno zmieniają wynik procentowy.", "lesson": {"correct": "Pełny Iris ma trzy klasy i tylko 150 próbek. Część klas się nakłada. Problem jest trudniejszy niż przy dwóch klasach. Po split test ma niewiele punktów. Jedna pomyłka mocno zmienia procent. Dlatego jeden wynik trzeba czytać ostrożnie.", "example": "Test ma około 38 próbek. Jedna zła predykcja to już kilka punktów procentowych. Model liniowy może mieć około 94–95%. To nie jest wyrok ostateczny na wszystkie przyszłe kwiaty.", "remember": "Mały test = duża wrażliwość accuracy na pojedyncze próbki.", "wrong": {"B": "Accuracy jest użyteczne, ale na małym zbiorze wymaga ostrożności.", "C": "SVC radzi sobie z wieloma klasami. Iris 3-klasowy jest standardowym przykładem.", "D": "Nadal liczymy accuracy klasyfikacji, nie R²."}}}, {"n": 11, "difficulty": "łatwe", "category": "ML", "prompt": "Czym są support vectors w SVM?", "options": {"A": "Wszystkimi punktami leżącymi najdalej od granicy", "B": "Próbkami najbliżej granicy decyzyjnej, które w największym stopniu ją wyznaczają", "C": "Losowymi punktami bez wpływu na model", "D": "Współczynnikami regresji liniowej"}, "correct": "B", "why": "Support vectors to próbki najbliżej granicy; one w największym stopniu wyznaczają jej położenie.", "lesson": {"correct": "Na brzegu marginesu leżą punkty najbliżej granicy. Nazywamy je wektorami nośnymi. To one mocno trzymają granicę w miejscu. Punkty daleko zwykle mniej wpływają. Nazwa SVM bierze się właśnie od tych punktów.", "example": "Dwie grupy punktów. Kilka sztuk stoi tuż przy pasie między klasami. Reszta siedzi daleko. SVM opiera granicę głównie na tych bliskich. One są support vectors.", "remember": "Support vectors = punkty najbliżej granicy.", "wrong": {"A": "Najdalsze punkty nie są wektorami nośnymi.", "C": "Nie są losowe i bez znaczenia — to one trzymają granicę.", "D": "To nie współczynniki regresji, tylko konkretne próbki."}}}, {"n": 12, "difficulty": "łatwe", "category": "ML", "prompt": "Co ustawia parametr n_estimators w Random Forest?", "options": {"A": "Maksymalną głębokość jednego drzewa", "B": "Wartość C w SVM", "C": "Liczbę klas w Iris", "D": "Liczbę drzew decyzyjnych w lesie"}, "correct": "D", "why": "n_estimators określa liczbę drzew budowanych w lesie.", "lesson": {"correct": "Random Forest to wiele drzew razem. n_estimators mówi, ile ich zbudować. Sto oznacza sto drzew. Nie ustawia głębokości ani liczby klas. Końcowa decyzja powstaje z głosów drzew.", "example": "RandomForestClassifier(n_estimators=100) buduje sto drzew. Każde głosuje. Las wybiera klasę większości.", "remember": "n_estimators = liczba drzew.", "wrong": {"A": "Głębokość to osobny parametr.", "B": "C należy do SVM.", "C": "Liczba klas wynika z targetu, nie z n_estimators."}}}, {"n": 13, "difficulty": "łatwe", "category": "ML", "prompt": "Co oznacza Gini = 0 w węźle drzewa klasyfikacyjnego?", "options": {"A": "Węzeł jest czysty i zawiera obserwacje jednej klasy", "B": "Klasy są wymieszane po równo", "C": "Entropia jest maksymalna", "D": "Model jest gorszy od przewidywania średniej"}, "correct": "A", "why": "Gini równe zero oznacza czysty węzeł z jedną klasą.", "lesson": {"correct": "Gini mierzy wymieszanie klas. Zero znaczy: brak wymieszania. Wszystkie próbki mają tę samą klasę. Taki węzeł jest czysty. Im wyższe Gini, tym większy bałagan klas.", "example": "W liściu jest dwadzieścia próbek Setosa i nic więcej. Gini spada do zera. Węzeł jest czysty.", "remember": "Gini zero = czysty węzeł.", "wrong": {"B": "Równe wymieszanie to wysoka nieczystość, nie zero.", "C": "Maksymalna entropia to mocne wymieszanie.", "D": "Porównanie ze średnią dotyczy R², nie Gini."}}}, {"n": 14, "difficulty": "średnie", "category": "ML", "prompt": "Co zwykle robi mniejsze C w SVM?", "options": {"A": "Wymusza hard margin bez wyjątków", "B": "Usuwa wszystkie kernele", "C": "Daje szerszy margines i większą tolerancję na błędy", "D": "Zawsze buduje kernel poly degree=3"}, "correct": "C", "why": "Mniejsze C zwykle oznacza szerszy margines i większą tolerancję błędów.", "lesson": {"correct": "C steruje kompromisem między szerokością marginesu a karą za błędy. Małe C łagodniej karze pomyłki. Model może zostać przy szerszym pasie. Duże C mocniej pilnuje każdej próbki i zwęża margines. Domyślnie często C=1.", "example": "Przy małym C kilka punktów może wejść w pas marginesu. Granica zostaje szeroka. Przy bardzo dużym C model walczy o każdy punkt i margines się ścisza.", "remember": "Małe C: szerszy margines, więcej tolerancji.", "wrong": {"A": "Małe C zwiększa elastyczność, nie hard margin.", "B": "C nie usuwa kerneli.", "D": "Kernel poly ustawiasz osobno."}}}, {"n": 15, "difficulty": "średnie", "category": "ML", "prompt": "Co oznacza R² = 0 dla modelu regresji?", "options": {"A": "Idealne dopasowanie do wszystkich obserwacji", "B": "Model nie jest lepszy od przewidywania średniej targetu", "C": "Zerowy błąd każdej predykcji", "D": "Model zawsze jest gorszy od każdego innego modelu"}, "correct": "B", "why": "R² = 0 oznacza jakość na poziomie przewidywania średniej targetu.", "lesson": {"correct": "R² porównuje model z naiwną średnią. Zero znaczy: taki sam poziom. Jeden to idealne dopasowanie. Ujemne znaczy: gorzej niż średnia. Zero nie jest sukcesem.", "example": "Naiwny model zawsze podaje średnią cenę. Twój model ma R²=0. Nie wyjaśnia wahań lepiej od średniej.", "remember": "R² zero = poziom średniej.", "wrong": {"A": "Ideał to R²=1.", "C": "Zerowe błędy dałyby R²=1.", "D": "Gorsze od średniej jest R² ujemne."}}}, {"n": 16, "difficulty": "średnie", "category": "ML", "prompt": "Jaki jest typowy skutek bardzo małego k w KNN?", "options": {"A": "Poszarpane granice i większe ryzyko overfittingu", "B": "Zawsze maksymalnie gładkie granice i silny underfitting", "C": "Budowa lasu stu drzew", "D": "Wymuszenie kernela linear w SVM"}, "correct": "A", "why": "Małe k daje lokalne, poszarpane granice i większe ryzyko overfittingu.", "lesson": {"correct": "KNN patrzy na najbliższych sąsiadów. Małe k to bardzo mała grupa. Pojedyncze punkty mocno ruszają decyzją. Granice stają się poszarpane. Rośnie ryzyko dopasowania do szumu.", "example": "Przy k=1 decyduje jeden sąsiad. Nietypowy punkt robi małą wyspę swojej klasy. Przy większym k głosuje więcej sąsiadów i granica się wygładza.", "remember": "Małe k = poszarpane granice i ryzyko overfittingu.", "wrong": {"B": "Gładkie granice są typowe raczej dla większego k.", "C": "Las drzew to Random Forest.", "D": "Kernel SVM nie zależy od k w KNN."}}}, {"n": 17, "difficulty": "średnie", "category": "ML", "prompt": "Jak Random Forest wybiera końcową klasę w klasyfikacji?", "options": {"A": "Uśrednia nazwy klas zapisane w liściach", "B": "Korzysta wyłącznie z predykcji pierwszego drzewa", "C": "Wybiera klasę o najmniejszej feature importance", "D": "Wybiera klasę wskazaną przez większość drzew"}, "correct": "D", "why": "W klasyfikacji drzewa głosują, a las wybiera klasę większości.", "lesson": {"correct": "Każde drzewo oddaje głos. Las zbiera głosy. Wygrywa klasa z największą liczbą głosów. To głosowanie większościowe. Wynik mniej zależy od jednego drzewa.", "example": "Pięć drzew: A, A, B, A, B. Klasa A ma trzy głosy. Las przewiduje A.", "remember": "Klasyfikacja w lesie = głosowanie większości.", "wrong": {"A": "Nazw klas nie uśrednia się sensownie.", "B": "Las łączy wiele drzew, nie tylko pierwsze.", "C": "Feature importance nie wybiera klasy próbki."}}}, {"n": 18, "difficulty": "trudne", "category": "ML", "prompt": "Który podział wybiera drzewo decyzyjne podczas budowy?", "options": {"A": "Podział z najmniejszym zyskiem informacyjnym", "B": "Podział z największym zyskiem informacyjnym (największy spadek ważonej nieczystości)", "C": "Podział dający największą nieczystość dzieci", "D": "Losowy podział bez oceny klas"}, "correct": "B", "why": "Drzewo wybiera podział z największym zyskiem informacyjnym, czyli największą redukcją ważonej nieczystości.", "lesson": {"correct": "Drzewo porównuje możliwe cięcia. Dobry podział zmniejsza ważoną nieczystość dzieci. Zysk informacyjny mierzy ten spadek. Algorytm bierze największy zysk. Węzły stają się czystsze.", "example": "Nieczystość rodzica to 1.0. Po podziale ważona nieczystość dzieci spada do 0.3. Zysk wynosi 0.7. Większy zysk wygrywa.", "remember": "Najlepszy podział = największy spadek nieczystości.", "wrong": {"A": "Mały zysk prawie nie porządkuje klas.", "C": "Chcemy zmniejszyć nieczystość dzieci, nie ją zwiększać.", "D": "Podziały są oceniane Gini lub entropią."}}}, {"n": 19, "difficulty": "trudne", "category": "ML", "prompt": "Po co stosuje się drop_first=True przy one-hot encodingu?", "options": {"A": "Aby utworzyć K+1 kolumn dla K kategorii", "B": "Aby zamienić target ciągły na klasy", "C": "Aby pozostawić K−1 kolumn i ograniczyć kolinearność", "D": "Aby zwiększyć stopień wielomianu cech"}, "correct": "C", "why": "drop_first usuwa kategorię bazową, zostawia K−1 kolumn i ogranicza kolinearność.", "lesson": {"correct": "One-hot robi kolumny 0/1 dla kategorii. Pełne K kolumn niesie zbędną zależność liniową. drop_first usuwa jedną kategorię jako bazę. Zostaje K−1 kolumn. To ogranicza pułapkę zmiennych fikcyjnych.", "example": "Kolor: czerwony, zielony, niebieski. Zostawiasz zielony i niebieski. Dwa zera oznaczają czerwony. Trzecia kolumna nie jest potrzebna.", "remember": "Dla K kategorii drop_first zostawia K−1 kolumn.", "wrong": {"A": "drop_first usuwa kolumnę, nie dodaje ekstra.", "B": "To kodowanie cech, nie automatyczna zmiana targetu.", "D": "Stopień wielomianu ustawia PolynomialFeatures."}}}, {"n": 20, "difficulty": "trudne", "category": "ML", "prompt": "Jaka jest najważniejsza intuicja działania kerneli w SVM?", "options": {"A": "Dane nieliniowo separowalne w jednej przestrzeni mogą stać się liniowo separowalne po odpowiednim przekształceniu", "B": "Kernel zawsze usuwa połowę cech wejściowych", "C": "Kernel zamienia accuracy na R²", "D": "Kernel wymusza ocenę modelu wyłącznie na danych treningowych"}, "correct": "A", "why": "Po przekształceniu przestrzeni problem nieliniowy może stać się liniowo separowalny.", "lesson": {"correct": "W oryginalnej przestrzeni klasy mogą się przeplatać. Prosta linia wtedy nie działa. Po przekształceniu układ punktów może się zmienić. Wtedy zwykła hiperpłaszczyzna potrafi je rozdzielić. Kernel daje właśnie taką intuicję.", "example": "Na osi: klasa A, potem B, potem znów A. Jednym progiem ich nie rozdzielisz. Po podniesieniu do kwadratu grupy mogą się ułożyć inaczej. W nowej przestrzeni podział staje się możliwy.", "remember": "Kernel: inna przestrzeń może uczynić podział liniowym.", "wrong": {"B": "Kernel nie polega na usuwaniu połowy cech.", "C": "Accuracy i R² to metryki; kernel ich nie zamienia.", "D": "Kernel nie zmienia zasady oceny na teście."}}}]};
const form=document.getElementById("quiz");
const answered=document.getElementById("answered");
const results=document.getElementById("results");
let lastGrade=null;
const esc=value=>String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function render(){
form.innerHTML=QUIZ.questions.map(q=>`<article class="card" id="card-${q.n}"><div class="meta"><span class="tag">#${q.n}</span><span class="tag diff-${q.difficulty}">${q.difficulty}</span><span class="tag">${q.category}</span></div><p class="prompt">${q.n}. ${esc(q.prompt)}</p><div class="options">${["A","B","C","D"].map(letter=>`<label class="opt"><input type="radio" name="q${q.n}" value="${letter}"><span class="letter">${letter})</span><span>${esc(q.options[letter])}</span></label>`).join("")}<label class="opt idk-option"><input type="radio" name="q${q.n}" value="?"><span class="letter">?</span><span>Nie mam pojęcia — bez zgadywania, chcę się nauczyć</span></label></div><label class="confidence">Pewność:<select name="c${q.n}" aria-label="Pewność pytania ${q.n}"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><div class="feedback" id="feedback-${q.n}" hidden></div></article>`).join("");
}
function collect(){
return QUIZ.questions.map(q=>{const selected=form.querySelector(`input[name="q${q.n}"]:checked`);const confidence=form.querySelector(`select[name="c${q.n}"]`).value;return{n:q.n,answer:selected?selected.value:"",confidence:confidence||"—"};});
}
function updateProgress(){
answered.textContent=String(collect().filter(row=>row.answer).length);
}
function lessonBlocks(q,wrong){
return `<div class="lesson">${wrong?`<div class="lesson-block wrong"><h3>Twoja odpowiedź</h3><p>${esc(q.lesson.wrong[wrong])}</p></div>`:""}<div class="lesson-block"><h3>Poprawna myśl</h3><p>${esc(q.lesson.correct)}</p></div><div class="lesson-block"><h3>Przykład</h3><p>${esc(q.lesson.example)}</p></div><div class="lesson-block remember"><h3>Zapamiętaj</h3><p>${esc(q.lesson.remember)}</p></div></div>`;
}
function grade(){
const rows=collect();
const missing=rows.filter(row=>!row.answer).map(row=>row.n);
if(missing.length){alert(`Brak odpowiedzi w pytaniach: ${missing.join(", ")}`);return null}
let score=0;
let unknown=0;
const detail=rows.map(row=>{
const q=QUIZ.questions[row.n-1];
const isUnknown=row.answer==="?";
const isCorrect=row.answer===q.correct;
if(isCorrect)score+=1;
if(isUnknown)unknown+=1;
const status=isCorrect?"OK":isUnknown?"NIE WIEM":"BŁĄD";
const card=document.getElementById(`card-${q.n}`);
const feedback=document.getElementById(`feedback-${q.n}`);
card.classList.remove("ok","bad","idk");
card.classList.add(isCorrect?"ok":isUnknown?"idk":"bad");
feedback.hidden=false;
feedback.innerHTML=isCorrect?`<p class="status-ok">OK</p><p>${esc(q.why)}</p>`:isUnknown?`<p class="status-idk">NIE WIEM · Poprawna: ${q.correct}</p><p class="encourage">Bez zgadywania — oto wyjaśnienie.</p>${lessonBlocks(q,"")}`:`<p class="status-bad">BŁĄD · Twoja: ${row.answer} · Poprawna: ${q.correct}</p>${lessonBlocks(q,row.answer)}`;
return{...row,correct:q.correct,status,why:q.why,prompt:q.prompt,isCorrect,isUnknown};
});
const percentage=Math.round(score/20*100);
document.getElementById("score").textContent=`${score}/20`;
document.getElementById("percentage").textContent=`Skuteczność: ${percentage}%`;
document.getElementById("unknown").textContent=`Nie wiem: ${unknown}`;
document.getElementById("state").textContent="Sprawdzono";
results.classList.add("show");
lastGrade={score,percentage,unknown,detail};
results.scrollIntoView({behavior:"smooth",block:"start"});
return lastGrade;
}
function download(filename,content){
const url=URL.createObjectURL(new Blob([content],{type:"text/markdown;charset=utf-8"}));
const link=document.createElement("a");
link.href=url;
link.download=filename;
link.click();
URL.revokeObjectURL(url);
}
function answersMd(detail){
const rows=detail.map(row=>`| ${row.n} | ${row.answer} | ${row.confidence==="—"?"":row.confidence} |  |`).join("\n");
return `# Moje odpowiedzi – ${QUIZ.date}\n\n| # | Twoja odpowiedź (A/B/C/D/?) | Pewność (1-5) | Uwagi |\n|---|------------------------------|---------------|-------|\n${rows}\n\n## Notatki\n\n`;
}
function resultsMd(grade){
const rows=grade.detail.map(row=>`| ${row.n} | ${row.answer} | ${row.correct} | ${row.status} | ${row.confidence} | ${row.why} |`).join("\n");
const strong=grade.detail.filter(row=>row.isCorrect).map(row=>row.n);
const weak=grade.detail.filter(row=>!row.isCorrect).map(row=>`#${row.n} (${row.status})`);
const strongText=strong.length?`Pytania OK: ${strong.join(", ")}.`:"Brak trafionych pytań w tej próbie.";
const weakText=weak.length?`Do powtórki: ${weak.join(", ")}.`:"Brak pozycji do powtórki.";
return `# Wynik quizu — ${QUIZ.date}\n\n## Wynik\n\n- Wynik: ${grade.score}/20\n- Skuteczność: ${grade.percentage}%\n- Nie wiem: ${grade.unknown}\n\n## Szczegóły\n\n| # | Twoja odpowiedź | Poprawna odpowiedź | Wynik | Pewność | Komentarz |\n|---|-----------------|--------------------|-------|---------|-----------|\n${rows}\n\n## Mocne strony\n\n${strongText}\n\n## Obszary do powtórki\n\n${weakText}\n`;
}
form.addEventListener("change",updateProgress);
document.getElementById("grade").addEventListener("click",grade);
document.getElementById("reset").addEventListener("click",()=>{form.reset();results.classList.remove("show");lastGrade=null;document.getElementById("state").textContent="W trakcie";QUIZ.questions.forEach(q=>{const card=document.getElementById(`card-${q.n}`);const feedback=document.getElementById(`feedback-${q.n}`);card.classList.remove("ok","bad","idk");feedback.hidden=true;feedback.innerHTML="";});updateProgress();});
document.getElementById("download-answers").addEventListener("click",()=>{const grade=lastGrade||grade();if(!grade)return;download(`${QUIZ.date}_my_answers.md`,answersMd(grade.detail));});
document.getElementById("download-results").addEventListener("click",()=>{const grade=lastGrade||grade();if(!grade)return;download(`${QUIZ.date}_results.md`,resultsMd(grade));});
render();
updateProgress();
</script>
</body>
</html>
