<style>

.diff-łatwe{color:var(--idk);background:#e8f3fa}.diff-średnie{color:var(--mid);background:#faf0e4}.diff-trudne{color:var(--hard);background:#fce8ef}

<script>
const QUIZ={"date":"06.10.2026","questions":[{"n":1,"difficulty":"łatwe","category":"ML","prompt":"Accuracy w klasyfikacji binarnej mówi, jaki procent wszystkich predykcji był poprawny. Jak liczymy accuracy z komórek macierzy konfuzji?","options":{"A":"(TP + TN) / (TP + TN + FP + FN)","B":"TP / (TP + FP)","C":"FP / (FP + TN)","D":"FN / (FN + TP)"},"correct":"A","why":"Accuracy to odsetek wszystkich poprawnych predykcji, czyli suma trafień (TP i TN) podzielona przez wszystkie cztery komórki macierzy.","lesson":{"correct":"Accuracy to po prostu: ile razy model trafił, podzielone przez wszystkie próby. Trafienia to dwie komórki: TP (prawdziwy chory rozpoznany jako chory) i TN (prawdziwy zdrowy rozpoznany jako zdrowy). Błędy FP i FN też wliczamy do mianownika, bo to też były predykcje. W przykładzie z notatek 7 trafień na 10 próbek daje 70%. Sama accuracy nie mówi, JAKIE błędy popełniono.","example":"Wyobraź sobie 10 osób. Model dobrze ocenił 3 zdrowych i 4 chorych (TN=3, TP=4). Pomylił się 1 raz na zdrowym i 2 razy na chorym. Trafienia: 3+4=7. Wszystkie osoby: 10. Accuracy = 7/10 = 70%. To jak ocena ze sprawdzianu: 7 punktów na 10, bez informacji, które zadania były źle.","remember":"Accuracy = (TP + TN) / wszystkie. Trafienia przez całość.","wrong":{"B":"To wzór na precision: wśród przewidzianych chorych, ilu naprawdę było chorych. Nie liczy wszystkich próbek.","C":"To FPR: odsetek zdrowych błędnie uznanych za chorych. To nie accuracy.","D":"To FNR: odsetek chorych pominiętych. To inna metryka niż accuracy."}}},{"n":2,"difficulty":"łatwe","category":"ML","prompt":"Dlaczego klasyfikator Bayesa nazywamy „naiwnym”?","options":{"A":"Bo zawsze pomija prior i liczy tylko mianownik evidence","B":"Bo działa wyłącznie na drzewach decyzyjnych z Gini = 0","C":"Bo wymaga, żeby cechy miały zawsze rozkład jednostajny","D":"Bo zakłada, że poszczególne cechy są od siebie niezależne"},"correct":"D","why":"„Naiwność” wynika z silnego założenia, że cechy są (warunkowo) niezależne — to uproszczenie, które przyspiesza obliczenia.","lesson":{"correct":"Część „Bayes” pochodzi od twierdzenia Bayesa. „Naiwny” znaczy: model udaje, że cechy nie zależą od siebie. W prawdziwym świecie wzrost, masa i BMI są powiązane, ale model i tak mnoży prawdopodobieństwa cech osobno. Dzięki temu nie musi modelować skomplikowanego wspólnego P(wszystkie cechy | klasa). Mimo że założenie często nie jest prawdziwe, model bywa zaskakująco dobry i szybki. Typowe zastosowania to spam i dokumenty.","example":"Wyobraź sobie, że oceniasz, czy ktoś weźmie parasol, patrząc na „deszcz” i „chmury” osobno, jakby to były dwa niezależne sygnały. W życiu chmury i deszcz chodzą w parze. Naive Bayes i tak mnoży te sygnały osobno — to właśnie ta naiwność.","remember":"Naiwny = zakładamy niezależność cech (żeby łatwiej mnożyć likelihoods).","wrong":{"A":"Prior jest ważny: posterior ~ prior × likelihoods. Model nie polega na samym evidence.","B":"Naive Bayes to nie drzewo i nie wymaga Gini = 0.","C":"Odmiany różnią się założeniem o rozkładzie (np. Gauss), nie wymogiem rozkładu jednostajnego."}}},{"n":3,"difficulty":"łatwe","category":"ML","prompt":"Co oznacza True Negative (TN), gdy 0 = osoba zdrowa, a 1 = osoba zakażona?","options":{"A":"Osoba jest chora, a model przewiduje chorobę","B":"Osoba jest zdrowa i model poprawnie przewiduje, że jest zdrowa","C":"Osoba jest zdrowa, ale model przewiduje chorobę","D":"Osoba jest chora, ale model uznaje ją za zdrową"},"correct":"B","why":"TN to zgodność obu zer: rzeczywistość = 0 i predykcja = 0, czyli poprawnie rozpoznany zdrowy.","lesson":{"correct":"True znaczy „prawdziwie”, Negative znaczy „negatyw”, tu: zdrowy (klasa 0). TN = model i prawda mówią „zdrowy”. To trafienie, nie błąd. W przykładzie TN = 3. Łatwo pomylić TN z TP, bo oba są poprawne — różni je klasa. TN dotyczy negatywu, TP pozytywnego przypadku choroby.","example":"Lekarz i test mówią: ta osoba jest zdrowa. Trafiony zdrowy = TN. Jak test i prawda mówią „chory”, to już TP, nie TN.","remember":"TN = prawdziwy zdrowy + model mówi zdrowy (0 i 0).","wrong":{"A":"To TP: chory i model wykrył chorobę.","C":"To FP: fałszywy alarm na zdrowej osobie.","D":"To FN: pominięty chory."}}},{"n":4,"difficulty":"łatwe","category":"ML","prompt":"Co pozwala soft margin w SVM?","options":{"A":"Zakazuje jakiegokolwiek naruszenia marginesu","B":"Zamienia klasyfikację na regresję z metryką MAE","C":"Naruszyć margines i zaakceptować część błędnych klasyfikacji","D":"Usuwa wszystkie kernele poza linear"},"correct":"C","why":"Soft margin jest elastyczny: pozwala naruszyć margines i zaakceptować część błędów, co pomaga przy outlierach.","lesson":{"correct":"Soft margin to „miękki” pas wokół granicy. Model nie musi rozdzielić klas idealnie. Kilka punktów może wejść w margines albo nawet po złej stronie. Dzięki temu lepiej znosi nietypowe obserwacje. Hard margin jest sztywny i wymaga czystego podziału. Parametr C steruje, jak mocno karzemy te naruszenia.","example":"Dwa stada owiec i jedna zbłąkana owca daleko po drugiej stronie. Hard margin mocno przesunie ogrodzenie przez tę jedną owcę. Soft margin powie: ta jedna może zostać po złej stronie — ogrodzenie zostaje szerokie i sensowne.","remember":"Soft = wolno trochę zbłądzić. Hard = zero naruszeń.","wrong":{"A":"To opis hard margin, nie soft.","B":"Soft margin nadal dotyczy klasyfikacji i marginesu, nie zamiany na MAE.","D":"Soft margin nie usuwa kerneli. Kernel i margines to osobne sprawy."}}},{"n":5,"difficulty":"łatwe","category":"ML","prompt":"Co oznacza False Positive (FP) w przykładzie wykrywania choroby (0 = zdrowa, 1 = zakażona)?","options":{"A":"Osoba jest zdrowa, ale model przewiduje chorobę","B":"Osoba jest chora i model poprawnie wykrywa chorobę","C":"Osoba jest zdrowa i model przewiduje, że jest zdrowa","D":"Osoba jest chora, ale model uznaje ją za zdrową"},"correct":"A","why":"FP to fałszywy alarm: rzeczywistość = 0, predykcja = 1 — zdrowa osoba uznana za chorą.","lesson":{"correct":"False = błąd, Positive = model krzyczy „pozytyw / choroba”. FP to zdrowy człowiek odesłany na dodatkowe badania. W przykładzie FP = 1. W chorobie zakaźnej ten błąd jest zwykle mniej groźny niż FN, bo raczej kosztuje czas i stres, a nie puszcza chorego między ludzi. FP wchodzi do wzoru precision i FPR.","example":"Alarm przeciwpożarowy wyje, a w kuchni tylko tosty. Dom nie płonie (negatyw), alarm mówi „ogień” (pozytyw) — fałszywy alarm, FP.","remember":"FP = fałszywy alarm: zdrowy, a model mówi chory.","wrong":{"B":"To TP — poprawne wykrycie choroby.","C":"To TN — poprawny zdrowy.","D":"To FN — pominięty chory, nie fałszywy alarm."}}},{"n":6,"difficulty":"łatwe","category":"ML","prompt":"Co zwraca metoda score() estymatora regresji liniowej (LinearRegression) w scikit-learn?","options":{"A":"Accuracy klasyfikacji (odsetek poprawnych etykiet 0/1)","B":"R² — udział wyjaśnionej wariancji","C":"MAE — średni błąd bezwzględny jako jedyny wynik score()","D":"Liczbę drzew w lesie (n_estimators)"},"correct":"B","why":"Dla regresji score() zwraca R², nie accuracy. Accuracy dotyczy klasyfikacji.","lesson":{"correct":"W scikit-learn score() zależy od typu zadania. LinearRegression przewiduje liczby ciągłe, więc score to R²: ile wariancji targetu model „wyjaśnia”. Accuracy liczy trafione etykiety klas i pasuje do klasyfikatorów. Łatwo to pomylić po przejściu z regresji do klasyfikacji. MAE i RMSE to osobne metryki, nie domyślny wynik score() regresji liniowej.","example":"Model ceny mieszkania: score = 0,8 znaczy, że R² wynosi 0,8, nie że 80% mieszkań dostało poprawną klasę. Nie ma tu klas 0/1.","remember":"Regresja: score() = R². Klasyfikacja: score() = accuracy.","wrong":{"A":"Accuracy jest dla klasyfikacji, nie dla LinearRegression.","C":"MAE liczymy osobno (mean_absolute_error); score regresji to R².","D":"n_estimators dotyczy lasu, nie LinearRegression.score()."}}},{"n":7,"difficulty":"średnie","category":"ML","prompt":"W przykładzie choroby zakaźnej który rodzaj błędu jest uznany za groźniejszy i dlaczego?","options":{"A":"False Positive, bo zawsze bardziej psuje accuracy niż FN","B":"True Negative, bo TN nie wlicza się do macierzy","C":"True Positive, bo TP to błąd modelu","D":"False Negative, bo chora osoba uznana za zdrową może dalej zakażać"},"correct":"D","why":"FN oznacza chorego uznanego za zdrowego; taka osoba może dalej zakażać. FP to raczej dodatkowe badania zdrowej osoby.","lesson":{"correct":"Nie wszystkie błędy bolą tak samo. FN: prawda = chory, model = zdrowy. Człowiek wychodzi bez izolacji i może zarażać. FP: prawda = zdrowy, model = chory — zwykle dodatkowe badania. Accuracy traktuje oba błędy jak ten sam minus jeden punkt. Dlatego w tym problemie patrzymy na macierz i na FNR, nie tylko na 70% accuracy. W innym zadaniu (np. spam) groźniejszy może być FP.","example":"Na lotnisku: pominąć naprawdę chorego (FN) jest groźniejsze niż odesłać zdrowego na dodatkowy test (FP). Jeden błąd puszcza wirusa dalej, drugi kosztuje kolejkę.","remember":"W zakażeniu groźniejszy jest FN: chory „przechodzi” jako zdrowy.","wrong":{"A":"FP nie jest tu uznany za groźniejszy; też nie „zawsze” bardziej psuje accuracy — każdy błąd liczy się tak samo w accuracy.","B":"TN to trafienie, nie błąd, i jest w macierzy.","C":"TP to poprawne wykrycie choroby, nie błąd."}}},{"n":8,"difficulty":"średnie","category":"ML","prompt":"Do jakich cech przeznaczony jest Gaussian Naive Bayes i jakie ma założenie o rozkładzie?","options":{"A":"Wyłącznie do tekstu jako zliczeń słów, zawsze bez żadnego rozkładu","B":"Tylko do etykiet drzewa, bo Gauss to inne imię wskaźnika Gini","C":"Do cech ciągłych; w obrębie klasy wartości cechy mają rozkład normalny (Gaussa)","D":"Do cech, które muszą być liniowo zależne od siebie"},"correct":"C","why":"GaussianNB jest wariantem dla cech ciągłych i zakłada rozkład normalny cechy w obrębie klasy.","lesson":{"correct":"Naive Bayes ma odmiany, bo cechy bywają różne. Gdy cecha to kategoria (słońce/deszcz), liczymy częstości. Gdy cecha to liczba ciągła (temperatura w °C), potrzebujemy rozkładu. GaussianNB zakłada dzwon Gaussa w każdej klasie. Potem pyta: jak bardzo ta wartość pasuje do dzwonu klasy A, a jak do klasy B. Wybiera klasę z wyższym wynikiem. Założenie niezależności cech nadal obowiązuje.","example":"Wzrost w cm u dwóch grup. W grupie A wzrost układa się wokół 170, w grupie B wokół 185. Nowy wzrost 172 jest bardziej prawdopodobny pod dzwonem A. GaussianNB tak właśnie porównuje klasy.","remember":"GaussianNB = cechy ciągłe + dzwon normalny w klasie.","wrong":{"A":"Zliczenia słów to raczej teren multinomialny, nie definicja Gaussa.","B":"Gini to miara czystości węzła drzewa, nie Naive Bayes.","D":"Model zakłada niezależność cech, nie liniową zależność między nimi."}}},{"n":9,"difficulty":"średnie","category":"ML","prompt":"Precision odpowiada na pytanie: jeżeli model powiedział „pozytywny”, jak często miał rację. Przy TP = 4 i FP = 1 ile wynosi precision?","options":{"A":"4 / (4 + 2) ≈ 66,7%","B":"4 / (4 + 1) = 80%","C":"(4 + 3) / 10 = 70%","D":"1 / (1 + 3) = 25%"},"correct":"B","why":"Precision = TP / (TP + FP) = 4 / (4 + 1) = 80%.","lesson":{"correct":"Precision patrzy tylko na to, co model oznaczył jako pozytyw. Mianownik to TP + FP: wszyscy „wskazani palcem jako chorzy”. Licznik to ci, którzy naprawdę byli chorzy (TP). FN w precision nie wchodzi — to inna historia (recall). W przykładzie 4 prawdziwych chorych wśród 5 alarmów daje 80%. Wysoka precision = mało fałszywych alarmów wśród pozytywnych predykcji.","example":"Model krzyknął „chory!” pięć razy. Cztery razy miał rację, raz pomylił zdrowego. Precision = 4/5 = 80%. Nie pyta, ilu chorych w ogóle przegapił.","remember":"Precision = TP / (TP + FP). Jakość alarmów, nie pokrycie wszystkich chorych.","wrong":{"A":"To recall: TP / (TP + FN) = 4/6.","C":"To accuracy: (TP+TN)/n = 7/10.","D":"To FPR: FP / (FP + TN) = 1/4."}}},{"n":10,"difficulty":"średnie","category":"ML","prompt":"Co oznacza Gini = 0 w węźle drzewa klasyfikacyjnego?","options":{"A":"Węzeł jest czysty — wszystkie obserwacje należą do jednej klasy","B":"Klasy są wymieszane dokładnie po równo (maksimum zanieczyszczenia)","C":"Entropia jest maksymalna, bo logarytm jest zera","D":"Drzewo musi mieć dokładnie jeden liść w całym modelu"},"correct":"A","why":"Gini = 0 oznacza węzeł czysty: wszystkie obserwacje są jednej klasy.","lesson":{"correct":"Gini mierzy, jak bardzo klasy są wymieszane w węźle. Wzór to 1 minus suma kwadratów udziałów klas. Gdy jedna klasa ma 100%, Gini spada do 0. Gdy klasy są po równo, Gini w zadaniu binarnym rośnie (nawet do 0,5). Drzewo lubi podziały, które prowadzą do czystszych węzłów. Gini = 0 to sukces czystości, nie opis całego drzewa.","example":"W worku same czerwone kulki — Gini 0. Pół na pół czerwone i niebieskie — Gini wyższe. Drzewo chce worków jednokolorowych.","remember":"Gini 0 = czysty węzeł (jedna klasa).","wrong":{"B":"Równe wymieszanie to wysokie zanieczyszczenie, nie Gini = 0.","C":"Maksymalna entropia opisuje chaos klas, nie czystość.","D":"Czysty węzeł nie ogranicza liczby liści całego drzewa."}}},{"n":11,"difficulty":"średnie","category":"ML","prompt":"Recall odpowiada na pytanie: spośród wszystkich naprawdę pozytywnych przypadków, ile model wykrył. Przy TP = 4 i FN = 2 ile wynosi recall?","options":{"A":"4 / (4 + 1) = 80%","B":"1 / (1 + 3) = 25%","C":"(4 + 3) / 10 = 70%","D":"4 / (4 + 2) ≈ 66,7%"},"correct":"D","why":"Recall = TP / (TP + FN) = 4 / (4 + 2) = 4/6 ≈ 66,7%.","lesson":{"correct":"Recall (czułość) patrzy na wszystkich naprawdę chorych. Mianownik to TP + FN: chorzy wykryci plus chorzy pominięci. Licznik to tylko wykryci (TP). FP tu nie wchodzi — to temat precision. W przykładzie 4 z 6 chorych zostało złapanych, więc około 66,7%. Wysoki recall = mało przeoczeń. Precision i recall to dwa różne pytania; F1 stara się je pogodzić.","example":"W sali jest 6 chorych. Model znalazł 4, dwóch puścił. Recall = 4/6. Nie obchodzi go, ilu zdrowych omyłkowo złapał — to by było precision.","remember":"Recall = TP / (TP + FN). Jaki procent prawdziwych pozytywów złapaliśmy.","wrong":{"A":"To precision: TP / (TP + FP).","B":"To FPR.","C":"To accuracy."}}},{"n":12,"difficulty":"średnie","category":"ML","prompt":"Jak poprawnie użyć StandardScaler przed modelem wrażliwym na skalę cech?","options":{"A":"fit i transform tylko na zbiorze testowym","B":"fit tylko na train, potem transform na train i na test","C":"fit osobno na train i osobno na test","D":"transform na train, a fit na test"},"correct":"B","why":"Scaler uczymy wyłącznie na train; test tylko transformujemy tym samym scalerem, żeby uniknąć wycieku informacji z testu.","lesson":{"correct":"StandardScaler liczy średnią i odchylenie. Te liczby wolno poznać tylko ze zbioru treningowego. Potem tą samą linijką przeskalowujemy train i test. Gdybyśmy fitowali też na teście, model podglądałby „przyszłość” — to wyciek informacji (data leakage). Osobny fit na teście psuje spójność skali.","example":"Train ma temperatury 10, 20, 30. Scaler uczy się średniej 20. Test ma 40 — tylko przeliczamy względem 20, nie wciągamy 40 do średniej uczącej.","remember":"Fit tylko train. Test tylko transform.","wrong":{"A":"Fit wyłącznie na teście to podglądanie danych testowych.","C":"Osobny fit na teście zmienia skalę inaczej niż na train.","D":"Fit należy do train, nie do test."}}},{"n":13,"difficulty":"średnie","category":"ML","prompt":"False Positive Rate liczymy jako FP / (FP + TN). Przy FP = 1 i TN = 3 jak interpretować FPR = 25%?","options":{"A":"25% wszystkich chorych zostało poprawnie wykrytych","B":"Accuracy spadła dokładnie do 25%","C":"25% rzeczywiście zdrowych osób zostało błędnie uznanych za chore","D":"Precision wynosi 25%, bo FP = 1"},"correct":"C","why":"FPR = 1/(1+3) = 25% oznacza odsetek prawdziwych negatywów (zdrowych), które model uznał za pozytyw.","lesson":{"correct":"FPR stoi po stronie zdrowych. Mianownik FP + TN to wszyscy naprawdę zdrowi. Licznik FP to zdrowi, na których model podniósł fałszywy alarm. 1 na 4 zdrowych = 25%. To nie jest accuracy i nie jest precision. FPR odpowiada: jak często „krzyczymy chory”, gdy ktoś jest zdrowy. W screeningu zależy nam, by rozumieć ten odsetek alarmów wśród negatywów.","example":"Cztery zdrowe osoby. Trzy model zostawia w spokoju (TN), jedną straszy chorobą (FP). Co czwarty zdrowy dostaje fałszywy alarm — FPR 25%.","remember":"FPR = fałszywe alarmy wśród naprawdę zdrowych.","wrong":{"A":"Wykrycie chorych to recall, nie FPR.","B":"Accuracy w przykładzie to 70%, nie 25%.","D":"Precision to 80% (4/5), nie 25%."}}},{"n":14,"difficulty":"średnie","category":"ML","prompt":"Dlaczego przy porównywaniu klas w Naive Bayes wspólny mianownik P(X1, …, Xn) (evidence) często można pominąć?","options":{"A":"Dla tej samej próbki evidence jest takie samo dla każdej klasy, więc ranking zależy od licznika prior × likelihoods","B":"Bo prior zawsze wynosi zero, więc mianownik musi być ujemny","C":"Bo GaussianNB zakazuje liczenia jakichkolwiek prawdopodobieństw","D":"Bo niezależność cech kasuje prior, a zostawia tylko evidence"},"correct":"A","why":"Evidence jest wspólne dla wszystkich klas przy tej samej próbce, więc do wyboru argmax wystarczy porównać prior × iloczyn likelihoods.","lesson":{"correct":"Chcemy P(klasa | cechy) = prior × likelihoods / evidence. Evidence to P(same cechy) — jedna liczba dla tej obserwacji, identyczna przy klasie A, B i C. Dzielenie wszystkich wyników przez to samo nie zmienia, kto jest największy. Dlatego do decyzji „która klasa wygra” liczy się licznik. Do odczytania prawdziwych procentów (żeby sumowały się do 100%) mianownik albo normalizacja z powrotem się przydaje.","example":"Trzy zawodników dzielisz przez ten sam czas biegu sędziego. Kolejność na mecie się nie zmieni, jeśli wszystkim podzielisz wynik przez 2. Tak samo evidence nie zmienia rankingu klas.","remember":"Ta sama próbka → to samo evidence → do wyboru klasy wystarczy licznik.","wrong":{"B":"Prior nie jest zerem; to P(klasa) przed cechami.","C":"Model właśnie liczy (przybliżone) prawdopodobieństwa; GaussianNB ma też predict_proba.","D":"Niezależność rozpisuje likelihoods na iloczyn, nie kasuje prioru."}}},{"n":15,"difficulty":"trudne","category":"ML","prompt":"False Negative Rate to FN / (FN + TP). Przy FN = 2 i TP = 4 co oznacza FNR ≈ 33,3%?","options":{"A":"Jedna trzecia zdrowych dostała fałszywy alarm","B":"Precision spadła do 33,3%, bo FN psuje mianownik precision","C":"Około 33,3% rzeczywiście chorych osób zostało błędnie uznanych za zdrowe","D":"Accuracy wynosi 33,3%, bo 2 błędy FN na 6 wszystkich próbek"},"correct":"C","why":"FNR = 2/(2+4) = 2/6 ≈ 33,3% to odsetek prawdziwych pozytywów (chorych), których model nie wykrył.","lesson":{"correct":"FNR stoi po stronie naprawdę chorych. Mianownik FN + TP to wszyscy chorzy. Licznik FN to ci, których model nazwał zdrowymi. 2 z 6 chorych „przeszło” — około 33,3%. To lustrzane odbicie recall: recall ≈ 66,7%, FNR ≈ 33,3%, razem 100% chorych. FPR dotyczy zdrowych, FNR chorych. W zakażeniu FNR jest szczególnie ważny, bo mierzy puszczonych chorych.","example":"Sześciu chorych w kolejce. Model wypuszcza dwóch jako „zdrowych”. Co trzeci chory jest pominięty. To FNR, nie odsetek fałszywych alarmów wśród zdrowych.","remember":"FNR = pominięci chorzy / wszyscy chorzy. Recall + FNR = 1 (dla tej klasy pozytywnej).","wrong":{"A":"Fałszywe alarmy wśród zdrowych to FPR, tu 25%, nie 33,3%.","B":"Precision nie ma FN w mianowniku; tu precision = 80%.","D":"Accuracy jest liczona na wszystkich 10, nie na 6 chorych, i wynosi 70%."}}},{"n":16,"difficulty":"trudne","category":"ML","prompt":"W przykładzie grypy: P(grypa)=15%, P(gorączka)=20%, P(gorączka|grypa)=80%. Ile wynosi P(grypa|gorączka) z twierdzenia Bayesa?","options":{"A":"15%, bo posterior zawsze równa się priorowi","B":"80%, bo likelihood i posterior to to samo","C":"20%, bo bierzemy samo P(gorączka)","D":"60%, bo 0,8 × 0,15 / 0,20 = 0,6"},"correct":"D","why":"P(A|B) = P(B|A)·P(A)/P(B) = 0,8·0,15/0,20 = 0,6, czyli 60%.","lesson":{"correct":"Twierdzenie Bayesa odwraca pytanie. Znamy, jak często grypa daje gorączkę (80%). Chcemy: jak często gorączka oznacza grypę. Mnożymy likelihood przez prior i dzielimy przez częstość gorączki w ogóle. 0,8 × 0,15 to 0,12; przez 0,20 daje 0,6. Wniosek: wśród osób z wysoką gorączką około 60% ma grypę, nie 80% i nie 15%.","example":"Na 100 osób: 15 ma grypę, z nich 80% (12) ma gorączkę. Gorączkę ma 20 osób. 12 z tych 20 to grypa — 60%. Reszta gorączek ma inną przyczynę.","remember":"P(A|B) = P(B|A)·P(A)/P(B). Tu: 80% × 15% / 20% = 60%.","wrong":{"A":"Posterior nie kopiuje prioru; cecha (gorączka) go aktualizuje.","B":"Likelihood P(gorączka|grypa)=80% to nie to samo co P(grypa|gorączka).","C":"P(gorączka) jest mianownikiem, nie odpowiedzią."}}},{"n":17,"difficulty":"trudne","category":"ML","prompt":"F1-score to średnia harmoniczna precision i recall. Przy precision = 0,8 i recall ≈ 0,667 która wartość i po co jest F1?","options":{"A":"F1 = (0,8 + 0,667)/2 ≈ 73,4% i jest średnią arytmetyczną, nie harmoniczną","B":"F1 ≈ 72,7% i łączy precision z recall, gdy chcemy balans obu","C":"F1 zawsze równa się accuracy, tu 70%","D":"F1 = FPR − FNR i w przykładzie wynosi ujemne 8,3%"},"correct":"B","why":"F1 = 2·precision·recall/(precision+recall) ≈ 72,7% i służy do balansu między precision a recall.","lesson":{"correct":"Średnia harmoniczna karze silniej, gdy jedna z liczb jest niska. Wzór: dwa razy iloczyn przez sumę. 2 × 0,8 × 0,667 / (0,8+0,667) daje około 0,727. To nie accuracy (70%) i nie zwykła średnia arytmetyczna. F1 jest przydatne, gdy nie chcesz chwalić modelu tylko za ładne alarmy albo tylko za czułość. Nadal F1 nie mówi, który błąd jest groźniejszy w Twoim problemie — to decyzja dziedzinowa.","example":"Precision 80% i recall 67% to jak dwa stopnie szkolne. F1 ≈ 73% stoi pośrodku, ale bliżej niższej wartości niż zwykła średnia. Gdyby recall spadł do 10% przy precision 90%, F1 mocno by spadło — nie da się „schować” słabego recall za ładną precision.","remember":"F1 = 2PR/(P+R) ≈ średnia harmoniczna. W przykładzie ≈ 72,7%, nie 70%.","wrong":{"A":"To byłaby średnia arytmetyczna; F1 jest harmoniczna i w notatkach ≈ 72,7%.","C":"Accuracy i F1 to inne wzory; tu 70% vs ≈ 72,7%.","D":"F1 nie jest różnicą FPR i FNR."}}},{"n":18,"difficulty":"trudne","category":"ML","prompt":"Jaka jest główna intuicja kernela w SVM przy problemie nieliniowym?","options":{"A":"Kernel zawsze usuwa połowę cech wejściowych","B":"Kernel wymusza hard margin i zakazuje soft margin","C":"Po przekształceniu przestrzeni dane mogą stać się liniowo separowalne (np. intuicja z R² do R³)","D":"Kernel zamienia SVM w regresję liniową bez marginesu"},"correct":"C","why":"Kernel pozwala myśleć o transformacji przestrzeni: problem nieliniowy może stać się liniowo separowalny w nowej przestrzeni.","lesson":{"correct":"W 2D czasem nie da się narysować prostej między klasami. Kernel to sztuczka: patrzymy na dane jakby były w bogatszej przestrzeni. Tam podział liniowy bywa możliwy. Intuicja uniesienia punktów z płaszczyzny do 3D pokazuje, że płaszczyzna może je rozdzielić. Soft/hard i C to osobny temat tolerancji błędów. Domyślny kernel w SVC to często rbf, który umie rysować kręte granice.","example":"Na osi punkty są wymieszane tak, że jednym progiem ich nie przetniesz. Po „uniesieniu” skrajne punkty układają się inaczej i nagle da się je odciąć płaszczyzną.","remember":"Kernel: trudne na starej mapie → łatwiejszy podział po przemapowaniu przestrzeni.","wrong":{"A":"Kernel nie polega na usuwaniu połowy cech.","B":"Hard/soft dotyczy tolerancji błędów (C), nie samego jądra.","D":"Kernel nie kasuje idei marginesu ani nie zamienia SVM w regresję bez marginesu."}}},{"n":19,"difficulty":"trudne","category":"ML","prompt":"Jakie jest kluczowe wniosek z lekcji o ocenie klasyfikacji (choroba zakaźna, macierz, precision/recall/F1)?","options":{"A":"Wystarczy accuracy, bo FPR, FNR, precision i recall zawsze są sobie równe","B":"Confusion matrix służy tylko do rysunku i nie rozróżnia FP od FN","C":"F1 zastępuje decyzję, który błąd jest groźniejszy, więc FN i FP mają zawsze ten sam koszt","D":"Nie wystarczy patrzeć tylko na accuracy — trzeba rozumieć macierz konfuzji i wiedzieć, który rodzaj błędu jest najgroźniejszy w danym problemie"},"correct":"D","why":"Najważniejsze zdanie lekcji: sama accuracy nie wystarcza; macierz pokazuje rodzaj błędów, a ich koszt zależy od problemu.","lesson":{"correct":"Accuracy z przykładu to 70% — brzmi „dość dobrze”, ale ukrywa 2 pominiętych chorych i 1 fałszywy alarm. Macierz rozbija TN, FP, FN, TP. Precision pyta o jakość alarmów, recall o wykrycie chorych, F1 o balans. FPR i FNR mówią, jak często mylimy zdrowych albo chorych. Potem człowiek, nie wzór, decyduje, co jest groźniejsze. W zakażeniu zwykle FN. W innym zadaniu może być odwrotnie.","example":"Dwa modele mają 70% accuracy. Jeden puszcza wielu chorych (wysokie FN), drugi straszy wielu zdrowych (wysokie FP). Na accuracy wyglądają tak samo. Macierz od razu pokazuje, który jest niebezpieczny epidemiologicznie.","remember":"Accuracy to start, nie meta. Patrz na macierz i koszt błędu w Twoim problemie.","wrong":{"A":"Te metryki nie są sobie równe; w przykładzie mają różne wartości (70%, 25%, 33%, 80%, 67%, 73%).","B":"Właśnie po to jest macierz, by oddzielić FP od FN.","C":"F1 łączy precision i recall liczbowo, ale nie ustala kosztu FN vs FP w dziedzinie."}}},{"n":20,"difficulty":"trudne","category":"ML","prompt":"Po naiwnym założeniu niezależności cech pełna postać Naive Bayes to posterior = ?","options":{"A":"prior × (iloczyn likelihoods) / evidence","B":"same evidence, bez prioru i bez cech","C":"wyłącznie Gini rodzica minus Gini dzieci","D":"R² / MAE, bo Bayes w sklearn zwraca metryki regresji"},"correct":"A","why":"P(Y|X) = P(Y) · ∏ P(Xi|Y) / P(X), czyli posterior = prior × likelihoods / evidence.","lesson":{"correct":"Najpierw twierdzenie Bayesa: posterior = likelihood łączne × prior / evidence. Łączne P(wszystkie cechy | klasa) jest trudne. Naiwność rozbija je na iloczyn P(cecha1|klasa) × P(cecha2|klasa) × … Potem dla każdej klasy liczymy ten licznik i (gdy trzeba) dzielimy przez evidence. Wybieramy klasę o największym posteriorze. Prior to P(klasa) zanim zobaczymy cechy. Likelihood to „jak bardzo te cechy pasują do klasy”.","example":"Klasa „spacer = tak” ma prior 5/9. Mnożysz przez P(słońce|tak) i P(ciepło|tak). To samo robisz dla „nie”. Który iloczyn (po ewentualnym podzieleniu przez to samo evidence) większy, tę klasę wybierasz.","remember":"Posterior = prior × iloczyn P(cecha|klasa) / evidence.","wrong":{"B":"Evidence samo nie wskazuje klasy; jest wspólne dla wszystkich klas przy tej próbce.","C":"To zysk informacyjny / nieczystość drzewa, nie wzór Bayesa.","D":"Naive Bayes to klasyfikator probabilistyczny, nie zamiana na R² i MAE."}}}]};
const form=document.getElementById("quiz");
const answered=document.getElementById("answered");
const results=document.getElementById("results");
let lastGrade=null;
const esc=value=>String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function render(){
form.innerHTML=QUIZ.questions.map(q=>`<article class="card" id="card-${q.n}"><div class="meta"><span class="tag">#${q.n}</span><span class="tag diff-${q.difficulty}">${q.difficulty}</span><span class="tag">${q.category}</span></div><p class="prompt">${q.n}. ${esc(q.prompt)}</p><div class="options">${["A","B","C","D"].map(letter=>`<label class="opt"><input type="radio" name="q${q.n}" value="${letter}"><span class="letter">${letter})</span><span>${esc(q.options[letter])}</span></label>`).join("")}<label class="opt idk-option"><input type="radio" name="q${q.n}" value="?"><span class="letter">?</span><span>Nie mam pojęcia — bez zgadywania, chcę się nauczyć</span></label></div><label class="confidence">Pewność:<select name="c${q.n}" aria-label="Pewność pytania ${q.n}"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><div class="feedback" id="feedback-${q.n}" hidden></div></article>`).join("");
}
function collect(){
return QUIZ.questions.map(q=>{const selected=form.querySelector(`input[name="q${q.n}"]:checked`);const confidence=form.querySelector(`select[name="c${q.n}"]`).value;return{n:q.n,answer:selected?selected.value:"",confidence:confidence||"—"};});
}
function updateProgress(){
answered.textContent=String(collect().filter(row=>row.answer).length);
}
function lessonBlocks(q,wrong){
return `<div class="lesson">${wrong?`<div class="lesson-block wrong"><h3>Twoja odpowiedź</h3><p>${esc(q.lesson.wrong[wrong])}</p></div>`:""}<div class="lesson-block"><h3>Poprawna myśl</h3><p>${esc(q.lesson.correct)}</p></div><div class="lesson-block"><h3>Przykład</h3><p>${esc(q.lesson.example)}</p></div><div class="lesson-block remember"><h3>Zapamiętaj</h3><p>${esc(q.lesson.remember)}</p></div></div>`;
}
function grade(){
const rows=collect();
const missing=rows.filter(row=>!row.answer).map(row=>row.n);
if(missing.length){alert(`Brak odpowiedzi w pytaniach: ${missing.join(", ")}`);return null}
let score=0;
let unknown=0;
const detail=rows.map(row=>{
const q=QUIZ.questions[row.n-1];
const isUnknown=row.answer==="?";
const isCorrect=row.answer===q.correct;
if(isCorrect)score+=1;
if(isUnknown)unknown+=1;
const status=isCorrect?"OK":isUnknown?"NIE WIEM":"BŁĄD";
const card=document.getElementById(`card-${q.n}`);
const feedback=document.getElementById(`feedback-${q.n}`);
card.classList.remove("ok","bad","idk");
card.classList.add(isCorrect?"ok":isUnknown?"idk":"bad");
feedback.hidden=false;
feedback.innerHTML=isCorrect?`<p class="status-ok">OK</p><p>${esc(q.why)}</p>`:isUnknown?`<p class="status-idk">NIE WIEM · Poprawna: ${q.correct}</p><p class="encourage">Bez zgadywania — oto wyjaśnienie.</p>${lessonBlocks(q,"")}`:`<p class="status-bad">BŁĄD · Twoja: ${row.answer} · Poprawna: ${q.correct}</p>${lessonBlocks(q,row.answer)}`;
return{...row,correct:q.correct,status,why:q.why,prompt:q.prompt,isCorrect,isUnknown};
});
const percentage=Math.round(score/20*100);
document.getElementById("score").textContent=`${score}/20`;
document.getElementById("percentage").textContent=`Skuteczność: ${percentage}%`;
document.getElementById("unknown").textContent=`Nie wiem: ${unknown}`;
document.getElementById("state").textContent="Sprawdzono";
results.classList.add("show");
lastGrade={score,percentage,unknown,detail};
results.scrollIntoView({behavior:"smooth",block:"start"});
return lastGrade;
}
function download(filename,content){
const url=URL.createObjectURL(new Blob([content],{type:"text/markdown;charset=utf-8"}));
const link=document.createElement("a");

function answersMd(detail){
const rows=detail.map(row=>`| ${row.n} | ${row.answer} | ${row.confidence==="—"?"":row.confidence} |  |`).join("\n");
return `# Moje odpowiedzi – ${QUIZ.date}\n\n| # | Twoja odpowiedź (A/B/C/D/?) | Pewność (1-5) | Uwagi |\n|---|------------------------------|---------------|-------|\n${rows}\n\n## Notatki\n\n`;
}
function resultsMd(grade){
const rows=grade.detail.map(row=>`| ${row.n} | ${row.answer} | ${row.correct} | ${row.status} | ${row.confidence} | ${row.why} |`).join("\n");
const strong=grade.detail.filter(row=>row.isCorrect).map(row=>row.n);
const weak=grade.detail.filter(row=>!row.isCorrect).map(row=>`#${row.n} (${row.status})`);
const strongText=strong.length?`Pytania OK: ${strong.join(", ")}.`:"Brak trafionych pytań w tej próbie.";
const weakText=weak.length?`Do powtórki: ${weak.join(", ")}.`:"Brak pozycji do powtórki.";
return `# Wynik quizu — ${QUIZ.date}\n\n## Wynik\n\n- Wynik: ${grade.score}/20\n- Skuteczność: ${grade.percentage}%\n- Nie wiem: ${grade.unknown}\n\n## Szczegóły\n\n| # | Twoja odpowiedź | Poprawna odpowiedź | Wynik | Pewność | Komentarz |\n|---|-----------------|--------------------|-------|---------|-----------|\n${rows}\n\n## Mocne strony\n\n${strongText}\n\n## Obszary do powtórki\n\n${weakText}\n`;
}
form.addEventListener("change",updateProgress);
document.getElementById("grade").addEventListener("click",grade);
document.getElementById("reset").addEventListener("click",()=>{form.reset();results.classList.remove("show");lastGrade=null;document.getElementById("state").textContent="W trakcie";QUIZ.questions.forEach(q=>{const card=document.getElementById(`card-${q.n}`);const feedback=document.getElementById(`feedback-${q.n}`);card.classList.remove("ok","bad","idk");feedback.hidden=true;feedback.innerHTML="";});updateProgress();});
document.getElementById("download-answers").addEventListener("click",()=>{const grade=lastGrade||grade();if(!grade)return;download(`${QUIZ.date}_my_answers.md`,answersMd(grade.detail));});
document.getElementById("download-results").addEventListener("click",()=>{const grade=lastGrade||grade();if(!grade)return;download(`${QUIZ.date}_results.md`,resultsMd(grade));});
render();
updateProgress();
