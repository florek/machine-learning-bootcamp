<style>
:root {

  --surface: #ffffff;

  --border: #d5cfc4;
  --text: #1c1917;

}
* { box-sizing: border-box; }
body {
  margin: 0;

  font-family: var(--font-body);
  color: var(--text);
  background:
    radial-gradient(ellipse 70% 45% at 0% 0%, #dceee4 0%, transparent 55%),
    radial-gradient(ellipse 55% 40% at 100% 0%, #f3e6d0 0%, transparent 50%),
    var(--bg);
  line-height: 1.55;
}
.wrap { max-width: 820px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
header {
  margin-bottom: 1.75rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--border);
}
header .eyebrow {
  font-size: 0.75rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
  margin: 0 0 0.4rem;
}
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1.75rem, 4vw, 2.35rem);

  letter-spacing: -0.02em;
  color: #1a1a1a;
}
.sub { color: var(--muted); margin: 0; font-size: 0.95rem; }
.progress {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  gap: 1rem;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1rem;
  margin: 0 0 1.5rem;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.progress strong { color: var(--accent); }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1rem;
  box-shadow: var(--shadow);
}
.card.ok {

.card.bad {

}
.meta {

  gap: 0.4rem;
  margin-bottom: 0.65rem;
}
.tag {

.lesson-block.remember {
  background: var(--accent-soft);

  display: flex;
  flex-wrap: wrap;

  padding: 1rem 0 0;

button, .btn {

  border: none;
  border-radius: 10px;
  padding: 0.7rem 1.1rem;
  font: inherit;
  font-weight: 650;
  cursor: pointer;

button.primary {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 2px 8px rgba(15, 107, 76, 0.25);

button.primary:hover { background: var(--accent-hover); }
button.ghost, .btn.ghost {

  border: 1px solid var(--border);
  box-shadow: var(--shadow);

  border-color: var(--accent);
  color: var(--accent);
}

#results .score-line {
  font-family: var(--font-display);
  font-size: 1.75rem;

.hint { color: var(--muted); font-size: 0.85rem; margin: 0.5rem 0 0; }
code {
  font-size: 0.9em;
  background: var(--surface-2);
  padding: 0.1em 0.35em;
  border-radius: 4px;
  border: 1px solid var(--border);
}

.card.learn {
  border-color: color-mix(in srgb, #1d6fa5 40%, var(--border));
  background: linear-gradient(180deg, #e8f3fa, var(--surface) 40%);
}

  border-style: dashed;
}

}
.status-idk {
  font-weight: 700;
  color: #1d6fa5;
  margin: 0 0 0.5rem;
}
.lesson.learn-lesson {
  background: #f3f8fc;
  border-color: #c5dde9;
}

</style>

ionTreeClassifier (klasa większościowa), nie regressor.", "B": "Prawdopodobieństwa z sigmoidy to świat regresji logistycznej, nie drzewa regresyjnego.", "C": "Liczba sąsiadów k należy do KNN, nie do DecisionTreeRegressor."}}}, {"n": 3, "difficulty": "łatwe", "category": "ML", "prompt": "Zrównoważone klasy w Iris (po 50 próbek na klasę) sprawiają, że:", "options": {"A": "accuracy jest łatwiejsza do interpretacji niż przy silnym niezbalansowaniu", "B": "drzewo musi używać `criterion='entropy'`", "C": "`max_depth` przestaje mieć znaczenie", "D": "model automatycznie odzyskuje 4 cechy przy wizualizacji 2D"}, "correct": "A", "why": "Przy zrównoważonych klasach (po 50) accuracy jest łatwiejsza do interpretacji niż przy silnym niezbalansowaniu.", "lesson": {"correct": "Gdy klasy mają podobną liczebność, accuracy sensownie oddaje jakość modelu. Przy silnym niezbalansowaniu wysoka accuracy może wynikać głównie z przewidywania klasy większościowej.", "example": "Iris: 50/50/50 – accuracy 66% oznacza realne pomyłki. Przy 90%/10% model „zawsze klasa A” ma 90% accuracy mimo że niczego nie nauczył się o klasie B.", "remember": "Zbalansowane klasy → accuracy łatwiej czytać; przy niezbalansowaniu uważaj na myląco wysoki wynik.", "wrong": {"B": "Zrównoważenie klas nie wymusza kryterium 'entropy' – nadal domyślnie można używać Gini.", "C": "max_depth nadal steruje złożonością drzewa niezależnie od balansu klas.", "D": "Redukcja do 2 cech traci pozostałe atrybuty – model ich sam nie odzyskuje."}}}, {"n": 4, "difficulty": "średnie", "category": "ML", "prompt": "Podziały „axis-aligned” w drzewie decyzyjnym oznaczają, że:", "options": {"A": "granice są zawsze okręgami wokół centroidów", "B": "model dzieli przestrzeń wyłącznie po przekątnej płaszczyzny", "C": "progi są prostopadłe do osi cech (regiony prostokątne / schodkowe)", "D": "każdy podział musi używać jednocześnie wszystkich cech"}, "correct": "C", "why": "Podziały axis-aligned są prostopadłe do osi cech, więc regiony w 2D są pros ialFeatures nie zastępuje one-hot encodingu kategorii."}}}]};

const form = document.getElementById('quiz-form');
const answeredCount = document.getElementById('answered-count');
const statusLabel = document.getElementById('status-label');
const resultsEl = document.getElementById('results');
let graded = false;
let lastGrade = null;

function esc(s) {
  return String(s)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;');
}

function renderForm() {
  form.innerHTML = QUIZ.questions.map(q => {
    const opts = ['A','B','C','D'].map(L => `
      <label class="opt">
        <input type="radio" name="q${q.n}" value="${L}" />
        <span class="letter">${L})</span>
        <span>${esc(q.options[L] || '')}</span>
      </label>`).join('') + `
      <label class="opt idk-opt">
        <input type="radio" name="q${q.n}" value="?" />
        <span class="letter">?</span>
        <span>Nie mam pojęcia — chcę się nauczyć</span>
      </label>`;
    return `
      <article class="card" id="card-${q.n}" data-n="${q.n}">
        <div class="meta">
          <span class="tag">#${q.n}</span>
          <span class="tag diff-${esc(q.difficulty)}">${esc(q.difficulty)}</span>
          <span class="tag">${esc(q.category)}</span>
        </div>
        <h2 class="q-title"><span class="num">${q.n}.</span></h2>
        <p class="prompt">${esc(q.prompt)}</p>
        <div class="options">${opts}</div>
        <div class="confidence">
          <span>Pewność:</span>
          <select name="c${q.n}" aria-label="Pewność pytania ${q.n}">
            <option value="">—</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>
        <div class="feedback" id="fb-${q.n}" hidden></div>
      </article>`;
  }).join('');
}

function collect() {
  return QUIZ.questions.map(q => {
    const picked = form.querySelector(`input[name="q${q.n}"]:checked`);
    const conf = form.querySelector(`select[name="c${q.n}"]`);
    return {
      n: q.n,
      answer: picked ? picked.value : '',
      confidence: conf && conf.value ? conf.value : '—',
    };
  });
}

function updateProgress() {
  const n = collect().filter(x => x.answer).length;
  answeredCount.textContent = String(n);
}

function renderOk(why) {
  return `<p class="status-ok">OK</p><p>${esc(why)}</p>`;
}

function renderBad(picked, correct, q) {
  const wrongText = (q.lesson.wrong && q.lesson.wrong[picked]) || 'Ta opcja nie jest poprawna względem notatek.';
  return `
    <p class="status-bad">BŁĄD · Twoja: ${picked} · Poprawna: ${correct}</p>
    <div class="lesson">
      <div class="lesson-block wrong-pick">
        <h3>Twoja odpowiedź</h3>
        <p>${esc(wrongText)}</p>
      </div>
      <div class="lesson-block">
        <h3>Poprawna myśl</h3>
        <p>${esc(q.lesson.correct)}</p>
      </div>
      <div class="lesson-block">
        <h3>Przykład</h3>
        <p>${esc(q.lesson.example)}</p>
      </div>
      <div class="lesson-block remember">
        <h3>Zapamiętaj</h3>
        <p>${esc(q.lesson.remember)}</p>
      </div>
    </div>`;
}

function renderIdk(correct, q) {
  return `
    <p class="status-idk">NIE WIEM · Poprawna: ${correct}</p>
    <p>Bez zgadywania — oto wyjaśnienie:</p>
    <div class="lesson learn-lesson">
      <div class="lesson-block">
        <h3>Poprawna myśl</h3>
        <p>${esc(q.lesson.correct)}</p>
      </div>
      <div class="lesson-block">
        <h3>Przykład</h3>
        <p>${esc(q.lesson.example)}</p>
      </div>
      <div class="lesson-block remember">
        <h3>Zapamiętaj</h3>
        <p>${esc(q.lesson.remember)}</p>
      </div>
    </div>`;
}

function grade() {
  const rows = collect();
  const missing = rows.filter(r => !r.answer).map(r => r.n);
  if (missing.length) {
    alert('Brak odpowiedzi w pytaniach: ' + missing.join(', '));
    return null;
  }
  let ok = 0;
  let idk = 0;
  const detail = rows.map(r => {
    const q = QUIZ.questions.find(x => x.n === r.n);
    const correct = q.correct;
    const isIdk = r.answer === '?';
    const isOk = !isIdk && r.answer === correct;
    if (isOk) ok += 1;
    if (isIdk) idk += 1;
    const card = document.getElementById('card-' + r.n);
    const fb = document.getElementById('fb-' + r.n);
    card.classList.remove('ok', 'bad', 'learn');
    card.classList.add(isOk ? 'ok' : (isIdk ? 'learn' : 'bad'));
    fb.hidden = false;
    if (isOk) fb.innerHTML = renderOk(q.why);
    else if (isIdk) fb.innerHTML = renderIdk(correct, q);
    else fb.innerHTML = renderBad(r.answer, correct, q);
    const wynik = isOk ? 'OK' : (isIdk ? 'NIE WIEM' : 'BŁĄD');
    return { ...r, correct, isOk, isIdk, wynik, why: q.why };
  });
  const pct = Math.round((ok / 20) * 100);
  document.getElementById('score-text').textContent = `${ok}/20`;
  document.getElementById('pct-text').textContent = `Skuteczność: ${pct}%`;
  const idkEl = document.getElementById('idk-text');
  if (idkEl) idkEl.textContent = idk ? `Nie wiem: ${idk}` : '';
  resultsEl.classList.add('show');
  statusLabel.textContent = 'Sprawdzono';
  graded = true;
  lastGrade = { ok, pct, idk, detail };
  resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  return lastGrade;
}

function download(filename, content) {
  const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function buildMyAnswers(detail) {
  const lines = [
    `# Moje odpowiedzi – ${QUIZ.date}`,
    '',
    '| # | Twoja odpowiedź (A/B/C/D/?) | Pewność (1-5) | Uwagi |',
    '|---|----------------------------|---------------|-------|',
  ];
  for (const r of detail) {
    lines.push(`| ${r.n} | ${r.answer} | ${r.confidence === '—' ? '' : r.confidence} | |`);
  }
  lines.push('', '## Notatki', '');
  return lines.join('\n');
}

function buildResults(grade) {
  const lines = [
    `# Wynik quizu — ${QUIZ.date}`,
    '',
    '## Wynik',
    '',
    `- Poprawne odpowiedzi: ${grade.ok}/20`,
    `- Skuteczność: ${grade.pct}%`,
    `- Nie wiem: ${grade.idk || 0}`,
    '',
    '## Szczegóły',
    '',
    '| # | Twoja odpowiedź | Poprawna odpowiedź | Wynik | Pewność | Komentarz |',
    '|---|---|---|---|---|---|',
  ];
  for (const r of grade.detail) {
    const wynik = r.wynik || (r.isOk ? 'OK' : 'BŁĄD');
    const pew = r.confidence === '—' ? '—' : r.confidence;
    const ans = r.answer === '?' ? '?' : r.answer;
    lines.push(`| ${r.n} | ${ans} | ${r.correct} | ${wynik} | ${pew} | ${r.why} |`);
  }
  const wrong = grade.detail.filter(r => !r.isOk);
  lines.push('', '## Mocne strony', '');
  if (grade.ok >= 15) {
    lines.push('- Wysoki wynik ogólny — solidne opanowanie większości zagadnień z notatek.');
  } else if (grade.ok >= 10) {
    lines.push('- Część zagadnień opanowana poprawnie — warto utrwalić błędne pytania poniżej.');
  } else {
    lines.push('- Warto wrócić do notatek i powtórzyć pytania oznaczone jako BŁĄD / NIE WIEM.');
  }
  lines.push('', '## Obszary do powtórki', '');
  if (!wrong.length) {
    lines.push('- Brak — pełny wynik.');
  } else {
    for (const r of wrong) {
      lines.push(`- Pyt. ${r.n}: ${r.why}`);
    }
  }
  lines.push('');
  return lines.join('\n');
}

form.addEventListener('change', updateProgress);
document.getElementById('submit-btn').addEventListener('click', () => grade());
document.getElementById('reset-btn').addEventListener('click', () => {
  form.reset();
  graded = false;
  lastGrade = null;
  resultsEl.classList.remove('show');
  statusLabel.textContent = 'W trakcie';
  QUIZ.questions.forEach(q => {
    const card = document.getElementById('card-' + q.n);
    const fb = document.getElementById('fb-' + q.n);
    card.classList.remove('ok', 'bad', 'learn');
    fb.hidden = true;
    fb.innerHTML = '';
  });
  updateProgress();
});
document.getElementById('dl-answers').addEventListener('click', () => {
  const g = lastGrade || grade();
  if (!g) return;
  download(`${QUIZ.date}_my_answers.md`, buildMyAnswers(g.detail));
});
document.getElementById('dl-results').addEventListener('click', () => {
  const g = lastGrade || grade();
  if (!g) return;
  download(`${QUIZ.date}_results.md`, buildResults(g));
});

renderForm();
updateProgress();
</script>
