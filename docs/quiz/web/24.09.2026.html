<title>ML Bootcamp Quiz — 24.09.2026</title>
<style>
:root {
  --bg: #f7f4ef;
  --bg-accent: #e7f1ea;
  --surface: #ffffff;
  --surface-2: #f1ece4;
  --border: #d5cfc4;
  --text: #1c1917;
  --muted: #6b6560;
  --accent: #0f6b4c;
  --accent-soft: #d8ebe2;
  --accent-hover: #0b553c;
  --ok: #1a7f4b;
  --ok-bg: #e6f5ec;
  --bad: #b42318;
  --bad-bg: #fcebea;
  --easy: #1d6fa5;
  --mid: #b45309;
  --hard: #9f1239;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(28, 25, 23, 0.04), 0 8px 24px rgba(28, 25, 23, 0.06);
  --font-display: "Fraunces", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--text);
  background:
    radial-gradient(ellipse 70% 45% at 0% 0%, #dceee4 0%, transparent 55%),
    radial-gradient(ellipse 55% 40% at 100% 0%, #f3e6d0 0%, transparent 50%),
    var(--bg);
  line-height: 1.55;
}
.wrap { max-width: 820px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
header {
  margin-bottom: 1.75rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--border);
}
header .eyebrow {
  font-size: 0.75rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
  margin: 0 0 0.4rem;
}
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1.75rem, 4vw, 2.35rem);
  margin: 0 0 0.5rem;
  letter-spacing: -0.02em;
  color: #1a1a1a;
}
.sub { color: var(--muted); margin: 0; font-size: 0.95rem; }
.progress {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  gap: 1rem;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1rem;
  margin: 0 0 1.5rem;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.progress strong { color: var(--accent); }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1rem;
  box-shadow: var(--shadow);
}
.card.ok {
  border-color: color-mix(in srgb, var(--ok) 45%, var(--border));
  background: linear-gradient(180deg, var(--ok-bg), var(--surface) 40%);
}
.card.bad {
  border-color: color-mix(in srgb, var(--bad) 40%, var(--border));
  background: linear-gradient(180deg, var(--bad-bg), var(--surface) 40%);
}
.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 0.65rem;
}
.tag {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 0.22rem 0.55rem;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--muted);
  border: 1px solid var(--border);
}
.tag.diff-łatwe { color: var(--easy); background: #e8f3fa; border-color: #c5dde9; }
.tag.diff-średnie { color: var(--mid); background: #faf0e4; border-color: #ead5b8; }
.tag.diff-trudne { color: var(--hard); background: #fce8ef; border-color: #e9c0cd; }
.q-title {
  font-family: var(--font-display);
  font-size: 1.15rem;
  margin: 0 0 0.9rem;
  font-weight: 600;
}
.q-title .num { color: var(--accent); margin-right: 0.35rem; }
.prompt { margin: 0 0 1rem; white-space: pre-wrap; }
.options { display: grid; gap: 0.45rem; }
label.opt {
  display: flex;
  gap: 0.65rem;
  align-items: flex-start;
  padding: 0.7rem 0.85rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  background: #fafaf8;
  transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
}
label.opt:hover {
  border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
  background: var(--accent-soft);
}
label.opt:has(input:checked) {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
}
label.opt input { margin-top: 0.25rem; accent-color: var(--accent); }
.letter { font-weight: 700; min-width: 1.4rem; }
.confidence {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-top: 0.85rem;
  color: var(--muted);
  font-size: 0.9rem;
}
.confidence select {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.25rem 0.45rem;
  background: #fff;
}
.feedback {
  margin-top: 1rem;
  padding-top: 0.85rem;
  border-top: 1px dashed var(--border);
}
.feedback .status-ok {
  color: var(--ok);
  font-weight: 700;
  margin: 0 0 0.35rem;
}
.feedback .status-bad {
  color: var(--bad);
  font-weight: 700;
  margin: 0 0 0.75rem;
}
.lesson {
  display: grid;
  gap: 0.65rem;
}
.lesson-block {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.75rem 0.9rem;
}
.lesson-block h3 {
  margin: 0 0 0.35rem;
  font-size: 0.78rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
}
.lesson-block p { margin: 0; font-size: 0.95rem; }
.lesson-block.wrong-pick { border-color: color-mix(in srgb, var(--bad) 35%, var(--border)); }
.lesson-block.remember {
  background: var(--accent-soft);
  border-color: color-mix(in srgb, var(--accent) 30%, var(--border));
}
.actions {
  position: sticky;
  bottom: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 0.65rem;
  padding: 1rem 0 0;
  margin-top: 1rem;
  background: linear-gradient(180deg, transparent, var(--bg) 30%);
}
button, .btn {
  appearance: none;
  border: none;
  border-radius: 10px;
  padding: 0.7rem 1.1rem;
  font: inherit;
  font-weight: 650;
  cursor: pointer;
}
button.primary {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 2px 8px rgba(15, 107, 76, 0.25);
}
button.primary:hover { background: var(--accent-hover); }
button.ghost, .btn.ghost {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
button.ghost:hover, .btn.ghost:hover {
  border-color: var(--accent);
  color: var(--accent);
}
#results { display: none; margin-bottom: 1.5rem; }
#results.show { display: block; }
#results .score-line {
  font-family: var(--font-display);
  font-size: 1.75rem;
  margin: 0 0 0.35rem;
}
#results .score-line span { color: var(--accent); }
.hint { color: var(--muted); font-size: 0.85rem; margin: 0.5rem 0 0; }
code {
  font-size: 0.9em;
  background: var(--surface-2);
  padding: 0.1em 0.35em;
  border-radius: 4px;
  border: 1px solid var(--border);
}

.card.learn {
  border-color: color-mix(in srgb, #1d6fa5 40%, var(--border));
  background: linear-gradient(180deg, #e8f3fa, var(--surface) 40%);
}
label.opt.idk-opt {
  background: #f3f7fa;
  border-style: dashed;
}
label.opt.idk-opt:has(input:checked) {
  border-color: #1d6fa5;
  background: #e8f3fa;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, #1d6fa5 35%, transparent);
}
.status-idk {
  font-weight: 700;
  color: #1d6fa5;
  margin: 0 0 0.5rem;
}
.lesson.learn-lesson {
  background: #f3f8fc;
  border-color: #c5dde9;
}

</style>
</head>

<script>
const QUIZ = {"date": "24.09.2026", "questions": [{"n": 1, "difficulty": "łatwe", "category": "ML", "prompt": "Domyślne kryterium podziału w `DecisionTreeClassifier` to:", "options": {"A": "`'entropy'`", "B": "`'gini'`", "C": "`'mse'`", "D": "`'mae'`"}, "correct": "B", "why": "Domyślne kryterium podziału w DecisionTreeClassifier to 'gini' (alternatywa: 'entropy').", "lesson": {"correct": "Wyobraź sobie, że drzewo pyta przy każdym rozgałęzieniu: „jak bardzo pomieszane są tu klasy?”. Do tego pytania używa miary. W scikit-learn domyślną miarą jest Gini. To znaczy: jak tworzysz DecisionTreeClassifier() i nic nie dopisujesz, program i tak wybiera Gini. Entropia też umie mierzyć „bałagan”, ale musisz ją włączyć sam, wpisując criterion='entropy'. MSE i MAE to miary z regresji (gdy przewidujemy liczbę), więc nie są domyślnym kryterium klasyfikatora etykiet.", "example": "Budujesz model tak: DecisionTreeClassifier(max_depth=1). Nie podajesz criterion. W środku i tak jest criterion='gini'. Dopiero gdy napiszesz DecisionTreeClassifier(criterion='entropy'), drzewo zacznie liczyć bałagan entropią. To jak domyślny język w telefonie: jest polski, dopóki sam nie zmienisz na angielski.", "remember": "Puste nawiasy = Gini. Entropia tylko gdy ją włączysz. MSE/MAE to świat liczb, nie etykiet klas.", "wrong": {"A": "Entropy jest OK jako wybór, ale nie startuje sama z siebie. To opcja dodatkowa, nie domyślna.", "C": "MSE patrzy na błąd liczbowy (jak daleko od prawdziwej liczby). Klasyfikator przewiduje nazwy klas, więc MSE nie jest jego domyślnym kryterium.", "D": "MAE też mierzy błąd liczbowy (średnią odległość). To nie domyślne narzędzie DecisionTreeClassifier."}}}, {"n": 2, "difficulty": "łatwe", "category": "ML", "prompt": "`DecisionTreeRegressor` w przeciwieństwie do `DecisionTreeClassifier` przewiduje:", "options": {"A": "wyłącznie etykietę klasy większościowej", "B": "prawdopodobieństwo klasy 1 z sigmoidy", "C": "liczbę sąsiadów k", "D": "wartość ciągłą (typowo średnią targetu w liściu)"}, "correct": "D", "why": "Regresor przewiduje wartość ciągłą – typowo średnią targetu w liściu; klasyfikator przewiduje etykietę klasy.", "lesson": {"correct": "Są dwa rodzaje drzew. Jedno zgaduje „co to za rzecz?” (klasa, np. setosa). Drugie zgaduje „ile?” (liczba, np. cena albo poziom wody). DecisionTreeClassifier to pierwsze: w liściu wygrywa najczęściej występująca etykieta. DecisionTreeRegressor to drugie: w liściu bierze zwykle średnią z liczb, które tam wpadły. Oba tną przestrzeń tymi samymi „schodkami”, ale odpowiadają na inne pytanie.", "example": "W liściu masz trzy domy o cenach 100, 120 i 140. Regresor powie mniej więcej 120. W innym liściu masz etykiety kot, kot, pies — klasyfikator powie „kot”, bo kotów jest więcej. Nie powie „średniej nazwy”, bo nazwy się nie uśrednia jak liczb.", "remember": "Classifier = etykieta (głosowanie). Regressor = liczba (zwykle średnia).", "wrong": {"A": "Klasa większościowa to właśnie klasyfikator. Regresor nie wybiera etykiety — liczy wartość ciągłą.", "B": "Prawdopodobieństwo z sigmoidy to historia regresji logistycznej. Drzewo regresyjne nie potrzebuje sigmoidy do średniej w liściu.", "C": "Liczba sąsiadów k należy do KNN. Drzewo nie szuka k sąsiadów — idzie ścieżką pytań od korzenia."}}}, {"n": 3, "difficulty": "łatwe", "category": "ML", "prompt": "Zrównoważone klasy w Iris (po 50 próbek na klasę) sprawiają, że:", "options": {"A": "accuracy jest łatwiejsza do interpretacji niż przy silnym niezbalansowaniu", "B": "drzewo musi używać `criterion='entropy'`", "C": "`max_depth` przestaje mieć znaczenie", "D": "model automatycznie odzyskuje 4 cechy przy wizualizacji 2D"}, "correct": "A", "why": "Przy zrównoważonych klasach (po 50) accuracy jest łatwiejsza do interpretacji niż przy silnym niezbalansowaniu.", "lesson": {"correct": "Accuracy mówi: „jaki procent odpowiedzi był dobry?”. Gdy każda klasa ma podobnie dużo przykładów, ten procent jest uczciwy. Iris ma po 50 kwiatów w każdej z 3 klas — nikt nie dominuje. Przy silnym niezbalansowaniu (np. 95% jednej klasy) model może mówić zawsze „klasa A” i mieć wysoką accuracy, choć nic nie potrafi. Zrównoważenie nie zmienia kryterium drzewa ani max_depth i nie przywraca odrzuconych cech.", "example": "Klasa A ma 90 osób, klasa B 10. Model zawsze mówi A → accuracy 90%, a B nigdy nie rozpoznaje. W Iris 50/50/50 wynik 66% naprawdę oznacza sporo pomyłek między klasami, a nie sztuczkę „zawsze najczęstsza”.", "remember": "Równe klasy → accuracy łatwiej zrozumieć. Przy krzywej nierównowadze uważaj na myląco wysoki wynik.", "wrong": {"B": "Balans klas nie każe używać entropy. Nadal możesz zostać przy Gini.", "C": "max_depth nadal steruje, jak głęboko drzewo może się rozgałęziać — balans tego nie wyłącza.", "D": "Jak weźmiesz tylko 2 cechy, pozostałe znikają z modelu. Same się nie wrócą przy rysowaniu."}}}, {"n": 4, "difficulty": "średnie", "category": "ML", "prompt": "Podziały „axis-aligned” w drzewie decyzyjnym oznaczają, że:", "options": {"A": "granice są zawsze okręgami wokół centroidów", "B": "model dzieli przestrzeń wyłącznie po przekątnej płaszczyzny", "C": "progi są prostopadłe do osi cech (regiony prostokątne / schodkowe)", "D": "każdy podział musi używać jednocześnie wszystkich cech"}, "correct": "C", "why": "Podziały axis-aligned są prostopadłe do osi cech, więc regiony w 2D są prostokątne / schodkowe.", "lesson": {"correct": "Drzewo nie rysuje ukośnych linii „na skos”. Przy każdym pytaniu bierze jedną cechę i próg: „czy długość > 5?”. Na wykresie 2D takie pytanie to linia prosta równoległa do osi (pion albo poziom). Kolejne pytania doklejają kolejne linie. Dlatego regiony klas wyglądają jak prostokąty albo schodki — stąd nazwa axis-aligned (wyrównane do osi).", "example": "Najpierw pytanie: sepal_length ≤ 5.5 — rysujesz pionową kreskę. Potem w jednym kawałku: sepal_width ≤ 3.0 — rysujesz poziomą kreskę. Mapa przypomina pokrojone ciasto na prostokątne kawałki, nie koła wokół środków klas.", "remember": "Jedna cecha + jeden próg = linia wzdłuż osi. Stąd prostokąty i schodki.", "wrong": {"A": "Okręgi wokół środków klas to inny sposób myślenia (bliżej centroidów / odległości). Zwykłe drzewo tak nie tnie.", "B": "Przekątna „na skos” wygląda jak granica modelu liniowego. Drzewo tnie poziomo/pionowo względem osi cech.", "D": "Jeden węzeł pyta zwykle o jedną cechę naraz, nie o wszystkie naraz."}}}, {"n": 5, "difficulty": "średnie", "category": "ML", "prompt": "Bardzo duża wartość `max_depth` (np. 15) na małym zbiorze treningowym zwykle:", "options": {"A": "gwarantuje najlepszą generalizację na niewidzianych danych", "B": "pozwala niemal idealnie dopasować train i niesie silne ryzyko overfittingu", "C": "wymusza `criterion='entropy'`", "D": "powoduje, że `score()` przestaje zwracać accuracy"}, "correct": "B", "why": "Bardzo głębokie drzewo na małym zbiorze może niemal idealnie dopasować train → silne ryzyko overfittingu.", "lesson": {"correct": "max_depth mówi drzewu: „ile poziomów pytań wolno Ci zadać?”. Jak dasz bardzo dużo (np. 15) na małym zbiorze, drzewo może wyciąć malutkie dziurki wokół pojedynczych punktów. Na danych treningowych wygląda to genialnie (prawie wszystko trafione). Ale to często wkuwanie na pamięć, nie rozumienie — na nowych przykładach psuje się. Sam wysoki wynik na train bez testu nie dowodzi, że model jest mądry.", "example": "Masz 150 kwiatów Iris. Drzewo z max_depth=15 może dostać niemal 100% na tych samych 150. Granice robią się poszarpane jak przypasowanie do każdej kropki. Bez osobnego testu nie wiesz, czy to nauka, czy ściąga z pamięci.", "remember": "Bardzo głębokie + mało danych = często overfitting. Patrz też na test, nie tylko na train.", "wrong": {"A": "Idealny train nie gwarantuje najlepszych nowych predykcji. Często jest odwrotnie.", "C": "Głębokość nie przełącza automatycznie na entropy.", "D": "score() klasyfikatora dalej liczy accuracy — głębokość tego nie wyłącza."}}}, {"n": 6, "difficulty": "średnie", "category": "ML", "prompt": "`plot_decision_regions` i `export_graphviz` odpowiadają na różne pytania, bo:", "options": {"A": "pierwszy pokazuje podział płaszczyzny cech, drugi – strukturę węzłów i progów drzewa", "B": "oba zawsze zwracają tę samą macierz confusion matrix", "C": "pierwszy liczy Gini, drugi liczy entropię", "D": "oba służą wyłącznie do skalowania cech"}, "correct": "A", "why": "plot_decision_regions pokazuje podział przestrzeni cech; export_graphviz – strukturę węzłów i progów.", "lesson": {"correct": "To dwa różne „okulary” na ten sam model. plot_decision_regions maluje kolorami, który kawałek płaszczyzny cech należy do której klasy — widzisz kształt granic. export_graphviz pisze przepis drzewa: jakie pytania, jakie progi, co w liściach. Jedno odpowiada „jak wygląda decyzja na mapie?”, drugie „jakie reguły if/else zbudował algorytm?”. Żadne nie jest confusion matrix ani skalowaniem.", "example": "Na wykresie widzisz pomarańczowe i zielone prostokąty. W grafie PNG czytasz: korzeń pyta sepal_length ≤ 5.45; w lewo idzie setosa. Ta sama wiedza, dwa sposoby opowiedzenia.", "remember": "Regiony = mapa. Graphviz = drzewo pytań. To nie to samo narzędzie.", "wrong": {"B": "Confusion matrix liczy, ile razy pomyliłeś klasy. Te funkcje rysują mapę albo graf, nie tę tabelkę.", "C": "Gini i entropy to sposoby mierzenia bałaganu przy budowie drzewa, nie nazwy tych dwóch wizualizacji.", "D": "Skalowanie cech robi np. StandardScaler. Te funkcje tylko pokazują model."}}}, {"n": 7, "difficulty": "średnie", "category": "ML", "prompt": "Przy samej parze cech działka (`sepal_*`) w Iris typowo:", "options": {"A": "wszystkie trzy klasy są idealnie liniowo rozdzielone", "B": "`setosa` oddziela się wyraźniej, a `versicolor` i `virginica` mocno się nakładają", "C": "redukcja do 2 cech zwiększa liczbę klas z 3 do 4", "D": "płytkie drzewo musi osiągnąć 100% accuracy na train"}, "correct": "B", "why": "Na cechach działka setosa oddziela się wyraźniej, a versicolor i virginica mocno się nakładają.", "lesson": {"correct": "Iris ma trzy gatunki. Gdy patrzysz tylko na długość i szerokość działka (sepal), setosa zwykle siedzi osobno — łatwiej ją odciąć jednym pytaniem. Versicolor i virginica często mieszają się w tej samej okolicy wykresu. Wtedy nawet zrównoważone klasy nie uratują płytkiego drzewa: w jednym regionie nadal są dwie nazwy naraz. Redukcja do 2 cech nie dodaje czwartej klasy i nie obiecuje 100% accuracy.", "example": "Przy max_depth=1 drzewo często oddziela setosę jedną kreską. Po drugiej stronie zostaje „mieszanka” versicolor+virginica. Accuracy jest ograniczona, bo w tej mieszance model musi wybrać jedną etykietę większościową.", "remember": "Na sepal: setosa łatwiejsza; versicolor i virginica się nakładają — płytkie drzewo ma limit.", "wrong": {"A": "Nie wszystkie trzy klasy są idealnie rozdzielone na cechach działka — dwie się plączą.", "C": "Nadal są trzy gatunki. Mniej cech ≠ więcej klas.", "D": "Przy nakładaniu klas płytkie drzewo rzadko dostaje 100% na train."}}}, {"n": 8, "difficulty": "trudne", "category": "ML", "prompt": "Funkcja pomocnicza, która dla zadanego `max_depth` trenuje model, rysuje granice i eksportuje graf, jest przydatna, bo:", "options": {"A": "zastępuje całkowicie potrzebę metryk klasyfikacji", "B": "gwarantuje brak overfittingu bez zbioru testowego", "C": "ułatwia systematyczne porównanie wpływu głębokości na złożoność i dopasowanie", "D": "automatycznie dodaje brakujące cechy Iris przy `predict()`"}, "correct": "C", "why": "Wspólna funkcja (train + granice + graf) ułatwia systematyczne porównanie różnych wartości max_depth.", "lesson": {"correct": "Żeby zrozumieć max_depth, najlepiej robić to samo dla 1, 2, 3, 5, 15: wytrenuj, narysuj granice, pokaż graf. Jedna funkcja z parametrem głębokości robi właśnie ten powtarzalny rytuał. Dzięki temu porównujesz uczciwie: zmienia się tylko głębokość, reszta pipeline’u stoi. To nie zastępuje metryk ani nie magicznie usuwa overfittingu bez testu.", "example": "Wywołujesz funkcję dla depth=1 — jedna prosta granica, prosty graf. Potem depth=5 — więcej prostokątów, wyższa accuracy na train. Potem 15 — bardzo gęsta mapa. Widzisz wzorzec oczami, nie tylko w tabelce liczb.", "remember": "Jedna funkcja porównawcza = ten sam eksperyment, inna głębokość.", "wrong": {"A": "Nadal patrzysz na accuracy i sens granic. Wykres nie zastępuje myślenia o jakości.", "B": "Porównanie na samym train nie gwarantuje, że nie ma przeuczenia.", "D": "Funkcja nie dokłada odrzuconych cech Iris sama z siebie."}}}, {"n": 9, "difficulty": "trudne", "category": "ML", "prompt": "Po wygenerowaniu opisu DOT przez `export_graphviz` do uzyskania obrazu PNG potrzeba:", "options": {"A": "wyłącznie wywołania `classifier.score()`", "B": "narzędzia renderującego DOT (np. pydotplus) budującego graf z bufora tekstowego", "C": "zamiany `DecisionTreeClassifier` na `LinearRegression`", "D": "ustawienia `n_neighbors` w drzewie"}, "correct": "B", "why": "export_graphviz daje DOT; do PNG potrzeba renderu (np. pydotplus z bufora tekstowego).", "lesson": {"correct": "export_graphviz nie maluje od razu obrazka. Najpierw powstaje tekstowy przepis drzewa w formacie DOT (opis węzłów i strzałek). Żeby zobaczyć PNG, ten przepis trzeba „przetłumaczyć” na grafikę — robi to renderer, np. pydotplus, często z bufora tekstowego. score() tylko liczy, ile trafień było. LinearRegression i n_neighbors nie są krokiem renderowania.", "example": "Kolejność jak przepis kulinarny: 1) wytrenuj drzewo, 2) export_graphviz → tekst DOT, 3) pydotplus czyta tekst, 4) zapisuje graph.png albo pokazuje obraz. Bez kroku 3–4 masz tylko litery, nie obrazek.", "remember": "DOT = przepis. PNG = dopiero po renderze (np. pydotplus).", "wrong": {"A": "score() mówi „ile procent dobrze”, nie rysuje drzewa.", "C": "Zmiana na regresję liniową nie zamienia DOT w PNG.", "D": "n_neighbors to pokrętło KNN. Drzewo go nie używa do grafu."}}}, {"n": 10, "difficulty": "trudne", "category": "ML", "prompt": "W porównaniu z KNN drzewo decyzyjne:", "options": {"A": "buduje jawną strukturę podziałów już podczas `fit()`; predykcja to ścieżka od korzenia do liścia", "B": "zapamiętuje tylko dane w `fit()` i odkłada całą decyzję wyłącznie na `predict()` (lazy learning)", "C": "zawsze daje gładką liniową granicę jak regresja logistyczna", "D": "nie ma parametru `max_depth`"}, "correct": "A", "why": "Drzewo buduje strukturę podziałów w fit(); KNN to lazy learning z decyzją przy predict().", "lesson": {"correct": "Drzewo uczy się pytań już przy fit(): buduje gotową strukturę. Potem predict() to spacer od korzenia do liścia według progów. KNN jest „leniwy”: w fit() głównie zapamiętuje punkty, a prawdziwą pracę (szukanie sąsiadów) odkłada na predict(). Dlatego po fit() drzewa możesz pokazać graf reguł, a po fit() KNN takiego drzewa reguł nie masz. Drzewo ma też max_depth; nie rysuje zawsze gładkiej linii jak regresja logistyczna.", "example": "Po nauczeniu drzewa eksportujesz PNG z pytaniami. Po nauczeniu KNN masz tylko zapamiętane kwiaty; dopiero gdy przyjdzie nowy kwiat, liczą się odległości do k sąsiadów.", "remember": "Drzewo = reguły w fit (eager). KNN = decyzja w predict (lazy).", "wrong": {"B": "To opis KNN. Drzewo nie odkłada całej decyzji na sam koniec.", "C": "Gładka linia to raczej model liniowy / logistyczny. Drzewo daje schodki.", "D": "max_depth jak najbardziej istnieje i ogranicza głębokość."}}}, {"n": 11, "difficulty": "łatwe", "category": "ML", "prompt": "Wskaźnik Gini równy 0 w węźle oznacza, że:", "options": {"A": "klasy są wymieszane po równo", "B": "entropia Shannona wynosi dokładnie 1 bit", "C": "model jest gorszy niż przewidywanie średnią", "D": "węzeł jest czysty (jedna klasa)"}, "correct": "D", "why": "Gini = 0 oznacza węzeł czysty – wszystkie obserwacje należą do jednej klasy.", "lesson": {"correct": "Gini mierzy, jak bardzo klasy są wymieszane w węźle. Zero oznacza: wszyscy w tym pudełku mają tę samą etykietę — bałaganu nie ma. Im bardziej po równo różne klasy, tym Gini wyższe. To nie to samo co „model gorszy od średniej” (to język R²) i nie to samo co „entropia = 1 bit” (to maksimum niepewności przy 50/50).", "example": "Pudełko: 40× setosa → Gini = 0 (czysto). Pudełko: 20× setosa i 20× versicolor → Gini wyraźnie powyżej zera (bałagan). Cel drzewa: ciąć tak, by dzieci były czystsze.", "remember": "Gini 0 = wszyscy jednej klasy. Duże Gini = mieszanka.", "wrong": {"A": "Równe wymieszanie to duży bałagan, więc Gini wysokie, nie zero.", "B": "1 bit entropii przy 50/50 to maksimum niepewności, przeciwieństwo czystego węzła.", "C": "Porównanie do średniej dotyczy R² w regresji, nie wskaźnika Gini."}}}, {"n": 12, "difficulty": "łatwe", "category": "ML", "prompt": "Użycie `drop_first=True` w one-hot encoding ma na celu głównie:", "options": {"A": "zwiększenie liczby kolumn dummy o jedną", "B": "zamianę targetu na wartości ciągłe", "C": "uniknięcie pułapki zmiennych fikcyjnych i redukcję kolinearności", "D": "wymuszenie `criterion='gini'`"}, "correct": "C", "why": "drop_first=True unika pułapki zmiennych fikcyjnych i redukuje kolinearność.", "lesson": {"correct": "One-hot robi z kategorii kolumny 0/1. Gdy masz K kategorii i zrobisz K kolumn, jedna jest zbędna: da się ją odczytać z pozostałych. To psuje modele liniowe (kolinearność) — „pułapka zmiennych fikcyjnych”. drop_first=True wyrzuca jedną kategorię jako bazę i zostawia K−1 kolumn. Nie zamienia targetu na liczby ciągłe i nie ma związku z Gini.", "example": "Kolor: czerwony / zielony / niebieski. Zamiast trzech flag wystarczą „zielony” i „niebieski”. Jeśli obie są 0, wnioskujesz „czerwony”. Mniej kolumn, mniej sztucznej zależności.", "remember": "drop_first = jedna kategoria jako baza, K−1 kolumn, mniej kolinearności.", "wrong": {"A": "drop_first odejmuje kolumnę, nie dodaje.", "B": "To kodowanie wejść kategorycznych, nie zamiana y na ciągłe.", "D": "Nie przełącza drzewa na Gini."}}}, {"n": 13, "difficulty": "średnie", "category": "ML", "prompt": "Dla klasyfikacji binarnej przy rozkładzie klas 50/50 entropia Shannona (log₂) osiąga maksimum równe:", "options": {"A": "1 bit", "B": "0 bitów", "C": "0,5 bita", "D": "2/3 bita"}, "correct": "A", "why": "Przy p = q = 0,5 entropia Shannona (log₂) osiąga maksimum 1 bit.", "lesson": {"correct": "Entropia Shannona z logarytmem o podstawie 2 mówi, ile „bitów niepewności” jest w rozkładzie klas. Przy dwóch klasach po równo (50/50) niepewność jest największa i wynosi dokładnie 1 bit. Gdy jedna klasa ma 100%, entropia spada do 0 — wiesz na pewno. Uwaga: maksimum Gini dla dwóch klas to 0,5 — inna miara, inna skala.", "example": "Uczciwa moneta: orzeł/reszka po połowie → H = 1 bit. Moneta zawsze orzeł → H = 0. Moneta prawie zawsze orzeł (90/10) → wartość pomiędzy. scipy bez base=2 liczy na innej skali (ln), więc pilnuj base=2, gdy chcesz bity.", "remember": "Binarnie 50/50 przy log₂ → max entropii = 1 bit.", "wrong": {"B": "0 bitów to pewność (węzeł czysty), nie maksimum przy 50/50.", "C": "0,5 to typowe maksimum Gini (2 klasy), nie maksimum entropii w bitach.", "D": "2/3 kojarzy się z Gini przy trzech równych klasach — to nie max entropii binarnej."}}}, {"n": 14, "difficulty": "średnie", "category": "ML", "prompt": "W klasyfikatorze sklearn metoda `predict_proba` zwraca:", "options": {"A": "wyłącznie etykiety klas (0/1)", "B": "prawdopodobieństwa przynależności do poszczególnych klas", "C": "współczynnik R² na zbiorze testowym", "D": "macierz korelacji cech"}, "correct": "B", "why": "predict_proba zwraca prawdopodobieństwa per klasa; predict – etykiety.", "lesson": {"correct": "predict() mówi krótko: „to klasa 1”. predict_proba() mówi dokładniej: „na klasę 0 daję 10%, na klasę 1 daję 90%”. Dzięki temu wiesz, czy model jest pewny, czy tylko ledwo przekroczył próg. To nie jest R² ani macierz korelacji cech.", "example": "Wynik [0.08, 0.92] → model mocno obstawia drugą klasę; predict zwróci tę klasę. Wynik [0.49, 0.51] → decyzja „na styk”; też dostaniesz etykietę, ale wiesz, że była niepewność.", "remember": "predict = etykieta. predict_proba = szanse na każdą klasę.", "wrong": {"A": "Same 0/1 etykiety to predict, nie proba.", "C": "R² dotyczy regresji / score modelu regresyjnego.", "D": "Korelacje cech liczysz osobno (np. corr), nie tą metodą."}}}, {"n": 15, "difficulty": "średnie", "category": "ML", "prompt": "RMSE w stosunku do MSE to:", "options": {"A": "kwadrat MSE", "B": "wartość bezwzględna MSE", "C": "accuracy pomniejszona o MSE", "D": "pierwiastek kwadratowy z MSE"}, "correct": "D", "why": "RMSE to pierwiastek kwadratowy z MSE.", "lesson": {"correct": "MSE bierze każdy błąd, podnosi do kwadratu i uśrednia — duże pomyłki bolą mocniej. RMSE bierze pierwiastek z MSE, więc wraca bliżej jednostek targetu (łatwiej powiedzieć „mniej więcej o tyle się mylimy”). RMSE nie jest kwadratem MSE ani „accuracy minus MSE”.", "example": "Błędy prowadzą do MSE = 25. RMSE = √25 = 5. Jeśli y to centymetry poziomu wody, myślisz „około 5 cm”, a nie „25 cm² w kwadratach błędu”.", "remember": "RMSE = pierwiastek z MSE. Prosta definicja.", "wrong": {"A": "Kwadrat MSE to coś innego — nie nazywamy tego RMSE.", "B": "Wartość bezwzględna to baza MAE, nie definicja RMSE.", "C": "Accuracy i MSE to różne światy; nie miesza się ich w jedną formułę."}}}, {"n": 16, "difficulty": "trudne", "category": "ML", "prompt": "Dopasowanie `StandardScaler` (`fit`) na całym zbiorze przed podziałem train/test jest ryzykowne, bo:", "options": {"A": "skalowanie zawsze niszczy informacje o klasach", "B": "`transform` przestaje działać na danych numerycznych", "C": "informacje ze zbioru testowego mogą „przeciec” do parametrów skalera (data leakage)", "D": "wymusza użycie drzewa zamiast regresji logistycznej"}, "correct": "C", "why": "fit skalera na całym zbiorze przed splitem może wprowadzić data leakage ze zbioru testowego.", "lesson": {"correct": "StandardScaler uczy się „jak wygląda typowa skala” (średnia, rozrzut) w fit(). Jeśli fit zrobisz na całym zbiorze przed podziałem, scaler „zerknie” też na test. Potem test nie jest już czysto niewidziany — to wyciek informacji (data leakage). Poprawna kolejność: najpierw train/test split, potem fit tylko na train, transform na train i na test tymi samymi liczbami.", "example": "W teście jest ekstremalnie duża wartość. Jeśli scaler widzi ją przy fit na wszystkim, zmienia σ dla całego świata, także dla train. To jak ściąganie na klasówce pytaniami z odpowiedziówki. Rób: split → scaler.fit(X_train) → transform obu zbiorów.", "remember": "Scaler: fit tylko na train. Test tylko transform — bez podglądania.", "wrong": {"A": "Skalowanie nie kasuje etykiet klas. Zmienia tylko skalę liczb w cechach.", "B": "transform działa na liczbach; problemem jest podglądanie testu, nie awaria transform.", "D": "Zły scaler nie zmusza Cię do drzewa zamiast regresji logistycznej."}}}, {"n": 17, "difficulty": "trudne", "category": "ML", "prompt": "Przy budowie drzewa algorytm wybiera podział z:", "options": {"A": "największym zyskiem informacyjnym (największy spadek ważonej nieczystości)", "B": "najmniejszym zyskiem informacyjnym", "C": "najwyższym `max_depth` spośród liści", "D": "najniższą accuracy na zbiorze testowym"}, "correct": "A", "why": "Drzewo wybiera podział z największym zyskiem informacyjnym (największy spadek ważonej nieczystości).", "lesson": {"correct": "Przy każdym możliwym cięciu drzewo pyta: „o ile mniej bałaganu będzie po podziale?”. Ta poprawa to zysk informacyjny (IG): bałagan rodzica minus ważony bałagan dzieci. Wybiera cięcie z największym IG — największe sprzątanie. Nie wybiera najmniejszego IG, nie patrzy na max_depth liści jako kryterium progu i nie minimalizuje accuracy testu w tym kroku.", "example": "Cięcie A: IG = 0.40. Cięcie B: IG = 0.05. Algorytm bierze A, bo bardziej porządkuje klasy w dzieciach. To jak wybór najlepszego pytania w zgadywance „tak/nie”.", "remember": "Największy zysk informacyjny wygrywa podział.", "wrong": {"B": "Najmniejszy IG to najgorsze sprzątanie — drzewo go nie chce.", "C": "max_depth to limit głębokości całego drzewa, nie wynik jednego porównania progów.", "D": "W const form = document.getElementById('quiz-form');
const answeredCount = document.getElementById('answered-count');
const statusLabel = document.getElementById('status-label');
const resultsEl = document.getElementById('results');
let graded = false;
let lastGrade = null;

function esc(s) {
  return String(s)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;');
}

function renderForm() {
  form.innerHTML = QUIZ.questions.map(q => {
    const opts = ['A','B','C','D'].map(L => `
      <label class="opt">
        <input type="radio" name="q${q.n}" value="${L}" />
        <span class="letter">${L})</span>
        <span>${esc(q.options[L] || '')}</span>
      </label>`).join('') + `
      <label class="opt idk-opt">
        <input type="radio" name="q${q.n}" value="?" />
        <span class="letter">?</span>
        <span>Nie mam pojęcia — chcę się nauczyć</span>
      </label>`;
    return `
      <article class="card" id="card-${q.n}" data-n="${q.n}">
        <div class="meta">
          <span class="tag">#${q.n}</span>
          <span class="tag diff-${esc(q.difficulty)}">${esc(q.difficulty)}</span>
          <span class="tag">${esc(q.category)}</span>
        </div>
        <h2 class="q-title"><span class="num">${q.n}.</span></h2>
        <p class="prompt">${esc(q.prompt)}</p>
        <div class="options">${opts}</div>
        <div class="confidence">
          <span>Pewność:</span>
          <select name="c${q.n}" aria-label="Pewność pytania ${q.n}">
            <option value="">—</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>
        <div class="feedback" id="fb-${q.n}" hidden></div>
      </article>`;
  }).join('');
}

function collect() {
  return QUIZ.questions.map(q => {
    const picked = form.querySelector(`input[name="q${q.n}"]:checked`);
    const conf = form.querySelector(`select[name="c${q.n}"]`);
    return {
      n: q.n,
      answer: picked ? picked.value : '',
      confidence: conf && conf.value ? conf.value : '—',
    };
  });
}

function updateProgress() {
  const n = collect().filter(x => x.answer).length;
  answeredCount.textContent = String(n);
}

function renderOk(why) {
  return `<p class="status-ok">OK</p><p>${esc(why)}</p>`;
}

function renderBad(picked, correct, q) {
  const wrongText = (q.lesson.wrong && q.lesson.wrong[picked]) || 'Ta opcja nie jest poprawna względem notatek.';
  return `
    <p class="status-bad">BŁĄD · Twoja: ${picked} · Poprawna: ${correct}</p>
    <div class="lesson">
      <div class="lesson-block wrong-pick">
        <h3>Twoja odpowiedź</h3>
        <p>${esc(wrongText)}</p>
      </div>
      <div class="lesson-block">
        <h3>Poprawna myśl</h3>
        <p>${esc(q.lesson.correct)}</p>
      </div>
      <div class="lesson-block">
        <h3>Przykład</h3>
        <p>${esc(q.lesson.example)}</p>
      </div>
      <div class="lesson-block remember">
        <h3>Zapamiętaj</h3>
        <p>${esc(q.lesson.remember)}</p>
      </div>
    </div>`;
}

function renderIdk(correct, q) {
  return `
    <p class="status-idk">NIE WIEM · Poprawna: ${correct}</p>
    <p>Bez zgadywania — oto wyjaśnienie:</p>
    <div class="lesson learn-lesson">
      <div class="lesson-block">
        <h3>Poprawna myśl</h3>
        <p>${esc(q.lesson.correct)}</p>
      </div>
      <div class="lesson-block">
        <h3>Przykład</h3>
        <p>${esc(q.lesson.example)}</p>
      </div>
      <div class="lesson-block remember">
        <h3>Zapamiętaj</h3>
        <p>${esc(q.lesson.remember)}</p>
      </div>
    </div>`;
}

function grade() {
  const rows = collect();
  const missing = rows.filter(r => !r.answer).map(r => r.n);
  if (missing.length) {
    alert('Brak odpowiedzi w pytaniach: ' + missing.join(', '));
    return null;
  }
  let ok = 0;
  let idk = 0;
  const detail = rows.map(r => {
    const q = QUIZ.questions.find(x => x.n === r.n);
    const correct = q.correct;
    const isIdk = r.answer === '?';
    const isOk = !isIdk && r.answer === correct;
    if (isOk) ok += 1;
    if (isIdk) idk += 1;
    const card = document.getElementById('card-' + r.n);
    const fb = document.getElementById('fb-' + r.n);
    card.classList.remove('ok', 'bad', 'learn');
    card.classList.add(isOk ? 'ok' : (isIdk ? 'learn' : 'bad'));
    fb.hidden = false;
    if (isOk) fb.innerHTML = renderOk(q.why);
    else if (isIdk) fb.innerHTML = renderIdk(correct, q);
    else fb.innerHTML = renderBad(r.answer, correct, q);
    const wynik = isOk ? 'OK' : (isIdk ? 'NIE WIEM' : 'BŁĄD');
    return { ...r, correct, isOk, isIdk, wynik, why: q.why };
  });
  const pct = Math.round((ok / 20) * 100);
  document.getElementById('score-text').textContent = `${ok}/20`;
  document.getElementById('pct-text').textContent = `Skuteczność: ${pct}%`;
  const idkEl = document.getElementById('idk-text');
  if (idkEl) idkEl.textContent = idk ? `Nie wiem: ${idk}` : '';
  resultsEl.classList.add('show');
  statusLabel.textContent = 'Sprawdzono';
  graded = true;
  lastGrade = { ok, pct, idk, detail };
  resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  return lastGrade;
}

function download(filename, content) {
  const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function buildMyAnswers(detail) {
  const lines = [
    `# Moje odpowiedzi – ${QUIZ.date}`,
    '',
    '| # | Twoja odpowiedź (A/B/C/D/?) | Pewność (1-5) | Uwagi |',
    '|---|----------------------------|---------------|-------|',
  ];
  for (const r of detail) {
    lines.push(`| ${r.n} | ${r.answer} | ${r.confidence === '—' ? '' : r.confidence} | |`);
  }
  lines.push('', '## Notatki', '');
  return lines.join('\n');
}

function buildResults(grade) {
  const lines = [
    `# Wynik quizu — ${QUIZ.date}`,
    '',
    '## Wynik',
    '',
    `- Poprawne odpowiedzi: ${grade.ok}/20`,
    `- Skuteczność: ${grade.pct}%`,
    `- Nie wiem: ${grade.idk || 0}`,
    '',
    '## Szczegóły',
    '',
    '| # | Twoja odpowiedź | Poprawna odpowiedź | Wynik | Pewność | Komentarz |',
    '|---|---|---|---|---|---|',
  ];
  for (const r of grade.detail) {
    const wynik = r.wynik || (r.isOk ? 'OK' : 'BŁĄD');
    const pew = r.confidence === '—' ? '—' : r.confidence;
    const ans = r.answer === '?' ? '?' : r.answer;
    lines.push(`| ${r.n} | ${ans} | ${r.correct} | ${wynik} | ${pew} | ${r.why} |`);
  }
  const wrong = grade.detail.filter(r => !r.isOk);
  lines.push('', '## Mocne strony', '');
  if (grade.ok >= 15) {
    lines.push('- Wysoki wynik ogólny — solidne opanowanie większości zagadnień z notatek.');
  } else if (grade.ok >= 10) {
    lines.push('- Część zagadnień opanowana poprawnie — warto utrwalić błędne pytania poniżej.');
  } else {
    lines.push('- Warto wrócić do notatek i powtórzyć pytania oznaczone jako BŁĄD / NIE WIEM.');
  }
  lines.push('', '## Obszary do powtórki', '');
  if (!wrong.length) {
    lines.push('- Brak — pełny wynik.');
  } else {
    for (const r of wrong) {
      lines.push(`- Pyt. ${r.n}: ${r.why}`);
    }
  }
  lines.push('');
  return lines.join('\n');
}

form.addEventListener('change', updateProgress);
document.getElementById('submit-btn').addEventListener('click', () => grade());
document.getElementById('reset-btn').addEventListener('click', () => {
  form.reset();
  graded = false;
  lastGrade = null;
  resultsEl.classList.remove('show');
  statusLabel.textContent = 'W trakcie';
  QUIZ.questions.forEach(q => {
    const card = document.getElementById('card-' + q.n);
    const fb = document.getElementById('fb-' + q.n);
    card.classList.remove('ok', 'bad', 'learn');
    fb.hidden = true;
    fb.innerHTML = '';
  });
  updateProgress();
});
document.getElementById('dl-answers').addEventListener('click', () => {
  const g = lastGrade || grade();
  if (!g) return;
  download(`${QUIZ.date}_my_answers.md`, buildMyAnswers(g.detail));
});
document.getElementById('dl-results').addEventListener('click', () => {
  const g = lastGrade || grade();
  if (!g) return;
  download(`${QUIZ.date}_results.md`, buildResults(g));
});

renderForm();
updateProgress();
</script>
</body>
</html>
